<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name=theme-color content="#5fa099">
<meta name=apple-mobile-web-app-capable content=yes>
<meta name=apple-mobile-web-app-status-bar-style content=black-translucent>
<meta name=apple-mobile-web-app-title content="LDRC RX V2">
<title>Setup &middot; LDRC RX V2</title>
<link rel=stylesheet href="/style.css?v=181">
<script src="/app.js?v=198" defer></script>
<style>html.h-dongle #protobtn, html.h-dongle a[href="/diagnostics"], html.h-dongle a[href="/rxsettings"], html.h-dongle #renamebtn, html.h-dongle #usbfcbtn { display: none !important; }</style>
<script>try{if(JSON.parse(localStorage.getItem('frontHints')||'{}').dongle)document.documentElement.classList.add('h-dongle');}catch(e){}</script>
</head>
<body>
<button class=helpBtn aria-label=Help title=Help onclick="LDRC.showHelp()">?</button>
<div class=bg-photo aria-hidden=true></div>
<div class=bg-wash  aria-hidden=true></div>
<div class=container>
    <h1>Setup</h1>

    <a class="btn btn-diag" href="/protocol" id=protobtn><span class=ico>&#128225;</span>Output protocol &mdash; <span id=protoname>&hellip;</span></a>
    <a class="btn btn-diag" href="/diagnostics"><span class=ico>&#127916;</span>View channels</a>
    <a class="btn btn-diag" href="/rxsettings"><span class=ico>&#9881;&#65039;</span>Receiver settings &mdash; failsafe, battery, wave</a>
    <a class="btn btn-fw"   href="/wifi" id=wifibtn style="display:none"><span class=ico>&#128246;</span>WiFi settings</a>
    <a class="btn btn-fw"   href="/firmware"><span class=ico>&#128229;</span>Update or roll back firmware</a>
    <button class="btn btn-diag" type=button id=usbfcbtn><span class=ico>&#128268;</span><span>USB socket&nbsp;&mdash;&nbsp;<span id=usbfcstate>&hellip;</span></span></button>
    <a class="btn btn-diag" href="/dongle" id=donglebtn><span class=ico>&#128268;</span><span id=donglelbl>Rotorflight dongle mode&nbsp;&mdash;&nbsp;<span id=donglestate>&hellip;</span></span></a>
    <button class="btn" type=button id=renamebtn style="background:#6f7e8b"><span class=ico>&#127991;&#65039;</span><span><span id=renamelbl>Rename receiver</span>&nbsp;&mdash;&nbsp;<span id=curname>&hellip;</span></span></button>

    <div class=footer></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    let s = null;
    for (let i = 0; i < 6 && !s; i++) { s = await LDRC.fetchState(); if (!s) await new Promise(r => setTimeout(r, 700)); }
    if (!s) return;
    document.documentElement.classList.toggle('h-dongle', !!s.dongle);   // the live answer wins (Malcolm 2026-09-10: "Setup page didn't hide it")

    // Output protocol — show what's selected right on the button.
    LDRC.setText('protoname', s.sim ? 'USB → SIM' : (s.protocol && s.protocol.current) || '…');

    // WiFi settings only make sense when an interface is up to serve the page from.
    const wifiVisible = s.net && (s.net.mode === 'WiFi up' || s.net.mode === 'AP mode');
    const ds = document.getElementById('donglestate'); if (ds) ds.textContent = s.dongle ? (s.dongle_auto ? 'dongle (automatic)' : 'always a dongle') : (s.dongle_mode == 2 ? 'always a receiver' : 'receiver (automatic)');
    if (s.dongle) { const dl = document.getElementById('donglelbl'); if (dl) dl.textContent = 'Dongle setup'; }   // a dongle needs no mode talk (Malcolm 2026-09-10)
    if (s.dongle) for (const sel of ['#protobtn', 'a[href="/diagnostics"]', 'a[href="/rxsettings"]']) { const el = document.querySelector(sel); if (el) el.style.display = 'none'; }   // receiver-only
    const wb = document.getElementById('wifibtn');
    if (wb) wb.style.display = wifiVisible ? '' : 'none';

    // USB socket (0.9.639): a receiver hosts the flight controller on it like the dongle; the simulator uses it instead.
    const ub = document.getElementById('usbfcbtn');
    if (ub) {
        if (s.dongle) ub.style.display = 'none';
        else {
            const off = s.usb_fc_mode === 0;
            LDRC.setText('usbfcstate', s.sim ? 'simulator' : off ? 'off' : (s.usb && s.usb.device) ? 'flight controller connected' : 'flight controller');
            ub.onclick = () => {
                const on = off || s.sim;
                const msg = on
                    ? 'Use the USB socket for the flight controller? A USB-C cable from this receiver to the flight controller then gives the app every Rotorflight setting, like the dongle.' + (s.sim ? ' The simulator is switched off.' : '') + ' The receiver restarts.'
                    : 'Switch the USB socket off? The flight controller is then reached over the radio link only. The receiver restarts.';
                if (!confirm(msg)) return;
                const fd = new URLSearchParams(); fd.set('on', on ? '1' : '0');
                fetch('/api/usbfc', { method: 'POST', body: fd })
                  .then(r => r.text()).then(html => { document.open(); document.write(html); document.close(); })
                  .catch(() => alert('Could not save — try again.'));
            };
        }
    }

    // Current name on the rename button.
    LDRC.setText('curname', (s.info && s.info.name) || 'RXV2');
    LDRC.setText('renamelbl', s.dongle ? 'Rename dongle' : 'Rename receiver');   // Malcolm 2026-09-10

    // Rename — same prompt-based flow as tapping the front-screen title.
    const rb = document.getElementById('renamebtn');
    if (rb) rb.onclick = () => {
        const cur = (s.info && s.info.name_custom) ? s.info.name : '';
        const v = prompt((s.dongle ? 'Rename this dongle' : 'Rename this receiver') + ' (blank = revert to "RXV2"):', cur);
        if (v === null) return;
        const fd = new URLSearchParams();
        fd.set('name', v.trim());
        fetch('/api/name', { method: 'POST', body: fd })
          .then(r => r.text()).then(html => { document.open(); document.write(html); document.close(); })
          .catch(() => alert('Could not save — try again.'));
    };
});
</script>
<template id=helpContent><h2>Setup</h2>
<p>Everything you configure once and then rarely touch again lives here, so the front screen stays simple.</p>
<h3>Buttons</h3>
<ul>
<li><b>Output protocol</b> &mdash; what the receiver sends to your flight controller on D6 (CRSF for Rotorflight, SBUS, IBUS or PPM). The current choice is shown on the button.</li>
<li><b>View channels</b> &mdash; live channel bars, plus capturing your failsafe positions.</li>
<li><b>WiFi settings</b> &mdash; home network details and the &ldquo;AP mode only&rdquo; field setting.</li>
<li><b>Update firmware</b> &mdash; install newer firmware or roll back.</li>
<li><b>USB socket</b> &mdash; a USB-C cable from the receiver to the flight controller gives the app every Rotorflight setting, like the dongle. The simulator uses the socket instead, so choosing one switches the other off.</li>
<li><b>Rename receiver</b> &mdash; the name is also the WiFi network name and the <code>.local</code> address.</li>
</ul>
<h3>Tips</h3>
<p>A brand-new receiver only needs two visits here: check the protocol and add your WiFi (Bind now lives on the front menu). After that you may never need this page at the field.</p>
</template>
</body>
</html>
