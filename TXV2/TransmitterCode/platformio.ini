
; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; B211 (the fourteenth review): EVERYTHING THE FIRMWARE IS BUILT WITH IS PINNED - to what the released firmware (B210) was built with. The platform
; had no version, three libraries had none, and two came from the heads of their git repositories (one of them the WATCHDOG): a build made on
; another day, or another machine, could be another firmware under the same version text. A newer library is taken on purpose, here, and tried.
; (dev/test_release_gate.py holds this file to that form. The Adafruit GFX and SSD1306 libraries are what Adafruit INA219 names as its own needs - no
;  line of the firmware uses them. They stand IN FRONT of it: found there already, they are not fetched a second time in whatever version is newest.)
[env:teensy41]
platform = teensy @ 5.0.0
platform_packages =
	framework-arduinoteensy @ 1.159.0
	toolchain-gccarmnoneeabi-teensy @ 1.110301.0
board = teensy41
framework = arduino
monitor_speed = 115200
lib_deps = 
	adafruit/Adafruit BusIO @ 1.17.4
	adafruit/Adafruit Unified Sensor @ 1.1.15
	adafruit/Adafruit GFX Library @ 1.12.6
	adafruit/Adafruit SSD1306 @ 2.5.17
	adafruit/Adafruit INA219 @ 1.2.3
	https://github.com/luisllamasbinaburo/Arduino-Interpolation.git#91bab2ceb57ea3e8c1eef4c2d6161138b202b3e5
	nrf24/RF24 @ 1.4.10
	https://github.com/tonton81/WDT_T4#1910b57d24468cd3419959118a2e1e6192f5e7fa
	
