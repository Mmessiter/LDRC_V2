; LDRC SimRX — Phase 1 HID spike
; Seeed XIAO ESP32-S3, native USB / TinyUSB HID with 16 analog axes.
;
; TWO build flags matter, and both differ from the board defaults:
;
; 1) ARDUINO_USB_MODE: board default is 1 (Hardware Serial/JTAG), which
;    COMPILES OUT TinyUSB -> custom HID impossible. Force 0 (USB-OTG/TinyUSB).
;
; 2) ARDUINO_USB_CDC_ON_BOOT: MUST be 0. The core derives
;       ARDUINO_USB_ON_BOOT = (CDC_ON_BOOT | MSC_ON_BOOT | DFU_ON_BOOT)
;    and, when set, calls USB.begin() in app_main() BEFORE setup() runs --
;    enumerating with the variant's default VID/PID and WITHOUT our HID
;    interface (hid.begin() hasn't run yet). All our setup() overrides then
;    no-op behind the _started guard. With CDC_ON_BOOT=0 we own the init
;    order in setup(): set IDs -> hid.begin() -> USB.begin(). A USB CDC for
;    the debug heartbeat is added manually in code (USBCDC USBSerial).

[env:seeed_xiao_esp32s3]
platform = espressif32@6.6.0
board = seeed_xiao_esp32s3
framework = arduino

; Port name changes with VID/PID/serial across reflashes, so let esptool
; auto-detect the S3 for upload/monitor instead of hard-coding it.
monitor_speed = 115200

build_unflags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

build_flags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
