; Nextion emulator for the LDRC transmitter V1B: the CrowPanel 5.0 speaks the Nextion serial protocol to the Teensy 4.1
[env:crowpanel50]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = min_spiffs.csv   ; two 1.9 MB app slots for OTA (fonts + WiFi need the room)
board_upload.flash_size = 4MB
monitor_speed = 115200
upload_speed = 460800
build_flags = -DCORE_DEBUG_LEVEL=0 -DBOARD_HAS_PSRAM -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    moononournation/GFX Library for Arduino @ 1.3.8
    lewisxhe/SensorLib @ ^0.2.0
    bblanchon/ArduinoJson @ ^7.0.4
    h2zero/NimBLE-Arduino @ ^2.2.3
    bitbank2/JPEGDEC @ ^1.6.1

; THE BUILD THAT IS PUBLISHED. Its workshop door is shut (no firmware from the Mac, no web pages but /status)
; until the pilot opens it on the screen: hold the top right corner for three seconds.
; Over the air: `pio run -e ota -t upload` (the screen answers as ldrc-screen.local once on the house WiFi)
[env:ota]
extends = env:crowpanel50
upload_protocol = espota
upload_port = ldrc-screen.local

; Two builds that are MEANT to fail, to try the fall-back of the screen's own firmware on the real thing
; (push one with `pio run -e ota_test_fail_trial -t upload --upload-port <ip>`; the previous firmware must come back and say so):
[env:ota_test_fail_trial]
extends = env:ota
build_flags = ${env:crowpanel50.build_flags} -DLDRC_DOORS_OPEN -DLDRC_TEST_FAIL_TRIAL -DSCREEN_VERSION=\"9.9.8-test\"

[env:ota_test_fall_over]
extends = env:ota
build_flags = ${env:crowpanel50.build_flags} -DLDRC_DOORS_OPEN -DLDRC_TEST_FALL_OVER -DSCREEN_VERSION=\"9.9.9-test\"

; A bench build for Malcolm's own boards: it puts the networks of include/secrets.h into the chip's store, once.
; NEVER PUBLISHED (it holds passwords; TXV1B dev/release_v1b.py refuses it). Push it, then let the transmitter
; update itself to the published firmware: the networks stay in the chip.
[env:ota_seed]
extends = env:ota
build_flags = ${env:crowpanel50.build_flags} -DLDRC_DOORS_OPEN -DLDRC_SEED_WIFI -DSCREEN_VERSION=\"1.1.0-bench\"

; What is pushed from the Mac while something is being worked on. Its version is "dev": whatever is published
; differs from it, so "Check for update" offers the published firmware and never says "Up to date" to a bench build.
[env:ota_dev]
extends = env:ota
build_flags = ${env:crowpanel50.build_flags} -DLDRC_DOORS_OPEN -DSCREEN_VERSION=\"dev\"

; A FRESH SCREEN, over USB (Malcolm's own boards only): the bench build that knows the networks of include/secrets.h,
; flashed with the partition table, once. The screen then joins the WiFi, fills its empty card from messiter.com by
; itself, and the transmitter's next "Transmitter updates" replaces this build with the published one (the networks stay
; in the chip). NEVER PUBLISHED. `pio run -e usb_seed -t upload --upload-port /dev/cu.usbserial-XXXX`
; (dev/usb_setup.py reads the chip's flash size and picks this or usb_seed_full by itself.)
[env:usb_seed]
extends = env:ota_seed
upload_protocol = esptool
upload_port =

; ---------------------------------------------------------------------------------------------------------------------
; THE 16 MB BOARDS (Elecrow DLE06050B, N16R8; the three that came 23 Oct 2026; src/board.h). The same source, with the
; 16 MB layout: two 6.25 MB app slots and 3.4 MB spare (default_16MB.csv), and -DLDRC_FULL, which marks the image as the
; FULL build (LDRCBUILD=full;). Every env above runs on these boards too, on the 4 MB layout, as STANDARD: the firmware
; tells the boards apart at start-up by the chip itself, not by the build. What differs is the slot: a board on the 16 MB
; layout takes ONLY images built for 16 MB (their header says so), and "Check for update" fetches the release's
; screen_full part for it. The release tool (TXV1B dev/release_v1b.py) builds and publishes ota AND ota_full together.
[env:ips16]
extends = env:crowpanel50
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
build_flags = ${env:crowpanel50.build_flags} -DLDRC_FULL

; THE PUBLISHED FULL BUILD (as env:ota is the published STANDARD one)
[env:ota_full]
extends = env:ips16
upload_protocol = espota
upload_port = ldrc-screen.local

[env:ota_full_dev]
extends = env:ota_full
build_flags = ${env:ips16.build_flags} -DLDRC_DOORS_OPEN -DSCREEN_VERSION=\"dev\"

; A FRESH 16 MB SCREEN, over USB, with the 16 MB partition table (see usb_seed above; NEVER PUBLISHED - it holds secrets.h):
; `pio run -e usb_seed_full -t upload --upload-port /dev/cu.usbserial-XXXX`, or dev/usb_setup.py
[env:usb_seed_full]
extends = env:ota_full
build_flags = ${env:ips16.build_flags} -DLDRC_DOORS_OPEN -DLDRC_SEED_WIFI -DSCREEN_VERSION=\"1.1.0-bench\"
upload_protocol = esptool
upload_port =
