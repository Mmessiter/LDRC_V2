<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Model photo</title>
<!-- The transmitter's screen serves this page (hmi/web/photo.html on its card) while its picture chooser waits for a
     photo: http://<screen>/photo?k=<key>. The PHONE makes the picture exactly what the transmitter shows (320 x 200,
     RGB565, dithered) and sends it to /photo/put. See src/pics_device.h and lib/LdrcPics in the screen's project. -->
<style>
  :root { --bg: #0f1a2e; --ink: #ffffff; --soft: #b8c4d6; --accent: #ffd400; --good: #7dff9a; --bad: #ff9e94; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 19px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 25px; margin: 4px 0 0; }
  .model { color: var(--soft); margin: 0; min-height: 1.4em; }
  .frame { position: relative; width: 100%; aspect-ratio: 320 / 200; background: #000; border: 3px solid var(--accent); border-radius: 6px; overflow: hidden; touch-action: none; }
  canvas#view { width: 100%; height: 100%; display: block; }
  .hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--soft); padding: 12px; pointer-events: none; }
  button, .pick { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 14px 18px; min-height: 56px; cursor: pointer; }
  .pick { display: block; text-align: center; background: #d6dbe2; color: #000; }
  .send { background: var(--accent); color: #000; }
  button:disabled { opacity: 0.45; cursor: default; }
  button:focus-visible, .pick:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .zoom { display: flex; gap: 12px; align-items: center; }
  .zoom input { flex: 1; }
  input[type=text] { font: 600 24px/1.2 ui-monospace, Menlo, Consolas, monospace; padding: 10px 12px; border-radius: 8px; border: 2px solid #8899aa; width: 100%; }
  label { display: block; margin-bottom: 6px; color: var(--soft); }
  .note { min-height: 1.4em; color: var(--soft); margin: 0; }
  .note.good { color: var(--good); } .note.bad { color: var(--bad); }
  progress { width: 100%; height: 14px; }
</style>
</head>
<body>
<main>
  <h1>Add a model photo</h1>
  <p class="model" id="model"></p>
  <label class="pick" for="file" tabindex="0">Choose a photo</label>
  <input id="file" type="file" accept="image/*" hidden>
  <div class="frame" id="frame"><canvas id="view"></canvas><div class="hint" id="hint">Your photo goes here</div></div>
  <div class="zoom"><span>Zoom</span><input id="zoom" type="range" min="0" max="1000" value="500" disabled aria-label="Zoom"></div>
  <p class="note">Drag the photo to move it. Pinch, or use Zoom.</p>
  <div><label for="name">Its name on the transmitter: 8 letters or digits at most</label>
  <input id="name" type="text" maxlength="8" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
  <p class="note" id="nameNote"></p>
  <button class="send" id="send" disabled>Send to the transmitter</button>
  <progress id="prog" max="100" value="0" hidden></progress>
  <p class="note" id="msg"></p>
</main>
<script>
(() => {
  const W = 320, H = 200;                                     // the transmitter's picture frame
  const key = new URLSearchParams(location.search).get('k') || '';
  const $ = id => document.getElementById(id);
  const view = $('view'), frame = $('frame'), zoomEl = $('zoom'), nameEl = $('name'), sendEl = $('send');
  let img = null, info = { taken: [] };
  let scale = 1, cx = W / 2, cy = H / 2, minS = 1, maxS = 4;  // the photo's centre in frame pixels, and its scale

  function msg(t, cls) { const m = $('msg'); m.textContent = t; m.className = 'note' + (cls ? ' ' + cls : ''); }

  fetch('/photo/info?k=' + encodeURIComponent(key), { cache: 'no-store' })
    .then(r => r.ok ? r.json() : r.text().then(t => Promise.reject(t)))
    .then(j => { info = j; $('model').textContent = j.model ? 'For ' + j.model : ''; nameEl.value = j.name || ''; checkName(); })
    .catch(t => msg(typeof t === 'string' && t ? t : 'The transmitter did not answer. Is the phone on the same WiFi?', 'bad'));

  // ---------------------------------------------------------------- the name
  function cleanName(v) { return v.replace(/[^A-Za-z0-9_-]/g, '').slice(0, 8); }
  function checkName() {
    const v = cleanName(nameEl.value); if (v !== nameEl.value) nameEl.value = v;
    let t = '', bad = false;
    if (!v) { t = 'Type a name.'; bad = true; }
    else if (v.toLowerCase() === 'noimage') { t = 'Choose another name.'; bad = true; }
    else {
      const hit = (info.taken || []).find(e => e.n.toLowerCase() === v.toLowerCase());
      if (hit) t = hit.m ? 'This replaces your photo ' + hit.n + '.' : 'Your photo will be shown instead of ' + hit.n + '.';
    }
    const n = $('nameNote'); n.textContent = t; n.className = 'note' + (bad ? ' bad' : '');
    sendEl.disabled = !img || bad;
  }
  nameEl.addEventListener('input', checkName);

  // ---------------------------------------------------------------- the photo
  $('file').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const im = new Image();
    im.onload = () => { img = im; fitNew(); $('hint').hidden = true; zoomEl.disabled = false; checkName(); msg(''); };
    im.onerror = () => msg('That photo could not be opened. Try another one.', 'bad');
    im.src = URL.createObjectURL(f);
  });
  function fitNew() {
    const cover = Math.max(W / img.naturalWidth, H / img.naturalHeight);
    minS = Math.min(W / img.naturalWidth, H / img.naturalHeight);    // smallest: the whole photo, with dark bars
    maxS = cover * 4;
    scale = cover; cx = W / 2; cy = H / 2;                          // first: it fills the frame
    zoomEl.value = toSlider(scale); draw();
  }
  function toSlider(s) { return maxS > minS ? Math.round(1000 * Math.log(s / minS) / Math.log(maxS / minS)) : 0; }
  function fromSlider(v) { return minS * Math.pow(maxS / minS, v / 1000); }
  zoomEl.addEventListener('input', () => { scale = fromSlider(+zoomEl.value); draw(); });

  function render(ctx, k) {                                       // k: frame pixels to canvas pixels
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W * k, H * k);
    if (!img) return;
    const w = img.naturalWidth * scale * k, h = img.naturalHeight * scale * k;
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, cx * k - w / 2, cy * k - h / 2, w, h);
  }
  function draw() {
    const r = frame.getBoundingClientRect(), k = r.width / W * (window.devicePixelRatio || 1);
    view.width = Math.round(W * k); view.height = Math.round(H * k);
    render(view.getContext('2d'), k);
  }
  window.addEventListener('resize', () => { if (img) draw(); });

  // ---------------------------------------------------------------- fingers: one moves the photo, two pinch it
  const pts = new Map(); let last = null;
  function snap() {
    const a = [...pts.values()]; if (!a.length) return null;
    const x = a.reduce((s, p) => s + p.x, 0) / a.length, y = a.reduce((s, p) => s + p.y, 0) / a.length;
    return { n: a.length, x, y, d: a.length >= 2 ? Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) : 0 };
  }
  frame.addEventListener('pointerdown', e => {
    if (!img) return;
    frame.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); last = snap();
  });
  frame.addEventListener('pointermove', e => {
    if (!img || !pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const now = snap(), r = frame.getBoundingClientRect(), u = W / r.width;
    if (last && now && now.n === last.n) {
      cx += (now.x - last.x) * u; cy += (now.y - last.y) * u;
      if (now.n >= 2 && last.d > 0) {                             // about the point between the fingers
        const ns = Math.min(maxS, Math.max(minS, scale * now.d / last.d)), g = ns / scale;
        const mx = (now.x - r.left) * u, my = (now.y - r.top) * u;
        cx = mx + (cx - mx) * g; cy = my + (cy - my) * g; scale = ns;
        zoomEl.value = toSlider(scale);
      }
      draw();
    }
    last = now;
  });
  const lift = e => { pts.delete(e.pointerId); last = snap(); };
  frame.addEventListener('pointerup', lift); frame.addEventListener('pointercancel', lift);
  frame.addEventListener('wheel', e => {                          // a mouse on a computer
    if (!img) return; e.preventDefault();
    scale = Math.min(maxS, Math.max(minS, scale * Math.exp(-e.deltaY / 500))); zoomEl.value = toSlider(scale); draw();
  }, { passive: false });

  // ---------------------------------------------------------------- what the transmitter shows
  function finalPixels() {                                        // drawn at 4 x, then halved twice: a big photo does not shimmer
    let c = document.createElement('canvas'); c.width = W * 4; c.height = H * 4;
    render(c.getContext('2d'), 4);
    for (const k of [2, 1]) {
      const d = document.createElement('canvas'); d.width = W * k; d.height = H * k;
      const x = d.getContext('2d'); x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
      x.drawImage(c, 0, 0, d.width, d.height); c = d;
    }
    return c.getContext('2d').getImageData(0, 0, W, H).data;
  }
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];   // ordered dither: no bands in a sky
  function to565(px) {                                            // the header (u16 width, u16 height), then RGB565 little-endian
    const out = new Uint8Array(4 + W * H * 2);
    out[0] = W & 255; out[1] = W >> 8; out[2] = H & 255; out[3] = H >> 8;
    let o = 4;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4, t = BAYER[(y & 3) * 4 + (x & 3)] / 16 - 0.47;
      const r = Math.max(0, Math.min(31, Math.round(px[i] * 31 / 255 + t)));
      const g = Math.max(0, Math.min(63, Math.round(px[i + 1] * 63 / 255 + t)));
      const b = Math.max(0, Math.min(31, Math.round(px[i + 2] * 31 / 255 + t)));
      const v = (r << 11) | (g << 5) | b;
      out[o++] = v & 255; out[o++] = v >> 8;
    }
    return out;
  }

  sendEl.addEventListener('click', () => {
    const name = cleanName(nameEl.value); if (!img || !name) return;
    sendEl.disabled = true; msg('Sending...');
    const fd = new FormData();
    fd.append('f', new Blob([to565(finalPixels())], { type: 'application/octet-stream' }), name + '.565');
    const x = new XMLHttpRequest(), prog = $('prog');
    x.open('POST', '/photo/put?k=' + encodeURIComponent(key) + '&name=' + encodeURIComponent(name));
    x.setRequestHeader('X-LDRC', '1');
    prog.hidden = false; prog.value = 0;
    x.upload.onprogress = e => { if (e.lengthComputable) prog.value = Math.round(100 * e.loaded / e.total); };
    x.onload = () => {
      prog.hidden = true;
      if (x.status === 200) {
        msg('Sent! On the transmitter, press OK to use it.', 'good');
        info.taken = (info.taken || []).filter(e => e.n.toLowerCase() !== name.toLowerCase()).concat([{ n: name, m: 1 }]);
        checkName();
      } else { msg(x.responseText || 'Not sent (' + x.status + ').', 'bad'); sendEl.disabled = false; }
    };
    x.onerror = () => { prog.hidden = true; msg('The transmitter did not answer. Is the phone on the same WiFi?', 'bad'); sendEl.disabled = false; };
    x.send(fd);
  });
})();
</script>
</body>
</html>
