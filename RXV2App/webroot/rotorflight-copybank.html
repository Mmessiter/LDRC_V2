<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Copy a bank &middot; LDRC RX V2</title>
<link rel=stylesheet href="/style.css?v=372">
<script src="/app.js?v=372" defer></script>
<style>
.fldRow{display:flex;justify-content:space-between;align-items:center;gap:.6em;
        padding:.45em .7em;background:#f2f6f8;border-radius:8px;margin:.25em 0}
.fldRow label{flex:1;color:#3a5165;font-size:.95em}
.fldRow input[type=checkbox]{width:1.4em;height:1.4em;flex:0 0 auto}
.banner{padding:.7em;border-radius:10px;text-align:center;font-weight:600;margin:0 0 1em}
.banner.info{background:#c8d2dc;color:#3a5165}
.banner.good{background:#a8d29a;color:#2a4d1f}
.banner.bad {background:#dca08c;color:#5c2a1a}
.banner.warn{background:#ffc88c;color:#5c3a1a;font-size:1.05em;padding:1em}
.profRow{display:flex;gap:.5em;margin:.3em 0}
.profBtn{flex:1;padding:.7em;border:0;border-radius:10px;font-size:1.1em;font-weight:600;
         background:#cdd6df;color:#3a5165;cursor:pointer}
.profBtn.active{background:#5fa099;color:#fff}
.profBtn.to.active{background:#d4944a;color:#fff}
.profBtn:disabled{background:#e4e8ec;color:#a5adb5;cursor:default}
.guide{background:#c8d2dc;color:#3a5165;padding:1em;border-radius:10px;margin:0 0 1em;text-align:left;font-size:1.02em}
.sub{color:#5f7385;font-size:.85em;margin:.2em 0 0}
</style>

<body class=hasFab>
<button class=helpBtn aria-label=Help title=Help onclick="LDRC.showHelp()">?</button>
<div class=bg-photo aria-hidden=true></div>
<div class=bg-wash  aria-hidden=true></div>
<div class=container>
    <h1>Copy a bank</h1>
    <div id=status class="banner info" style="display:none"></div>

    <div class=card>
        <h2>From bank</h2>
        <div class=profRow id=fromRow></div>
        <p class=sub id=fromNote></p>
    </div>

    <div class=card>
        <h2>To bank</h2>
        <div class=profRow id=toRow></div>
        <p class=sub>This bank&rsquo;s ticked settings are overwritten.</p>
        <p class=sub id=parkNote style="display:none"></p>
    </div>

    <div class=card>
        <h2>What to copy</h2>
        <div class=fldRow><label data-help="The whole flight-tuning profile: the PIDs page, the PID + page and the Rescue page, plus the bank's name.">Flight tuning (PIDs, PID +, rescue)</label> <input type=checkbox id=c_flight checked></div>
        <div class=fldRow><label data-help="The Rates &amp; Dynamics page for this bank.">Rates &amp; dynamics</label> <input type=checkbox id=c_rates checked></div>
        <div class=fldRow><label data-help="The Governor (profile) page: master/P/I/D/F gains, tail-torque assist, anticipation weights, throttle limits and the spool-up switch.">Governor gains</label> <input type=checkbox id=c_gov checked></div>
        <div class=fldRow><label data-help="Normally OFF: each bank keeps its own head speed — that is usually the whole point of having banks. Tick it only if you want the target bank to spin at the same speed.">Head speed too</label> <input type=checkbox id=c_hs></div>
        <p class=sub id=govNote></p>
        <div class=fldRow><label data-help="The rotor’s control power grows with head speed squared: a bank tuned at one head speed is too sharp at a faster one and too soft at a slower one. With this ticked, the copied P, I, D, feedforward and boost gains are scaled by the two banks’ head speeds — down fully for a faster bank, up more gently (never more than +25 %) for a slower one. Filters, offsets and the governor are left alone. Tune the middle bank, then copy it outwards.">Adjust gains for the target bank’s head speed</label> <input type=checkbox id=c_hsadj onchange="updateHsNote()"></div>
        <p class=sub id=hsNote></p>
    </div>

    <div class=fabBar>
        <button class="btn btn-fly" id=copyBtn onclick="copyBank()" style="background:#d4944a;margin:0" disabled><span class=ico>&#128203;</span>Copy</button>
    </div>
    <div class=footer></div>
</div>

<script>
// Whole-bank copy in one tap (Malcolm 2026-09-03: "copy current settings
// into another bank — that would save a lot of travelling, which is a
// little error prone").
//
// Bank N = Rotorflight PID profile N + rate profile N. The flight controller
// does the heavy lifting with MSP_COPY_PROFILE (183: [type, dst, src],
// type 0 = PID profile, 1 = rate profile) — the PID profile carries the
// PIDs, PID + (advanced), rescue AND the governor profile, so the governor
// bytes are put back the way the pilot asked (head speed kept by default)
// with a read-modify-write of MSP 148/149 afterwards. Then EEPROM save,
// then every copied block is read back byte-for-byte from the target bank
// (seeing is believing), and the FC is returned to the bank it was on.
// EVERY bank the flight controller has — this page deliberately ignores the
// pilot's "How many banks" cap (0.9.745, Malcolm: "our copy bank function
// should allow all banks even if we don't use them all. That will allow a
// bank to be PARKED so it can be restored after an unsuccessful
// experiment"). A hidden bank is the safest place to keep a known-good
// tune, and parking is useless if you cannot copy it back.
// Set at DOMContentLoaded — app.js is `defer`, so LDRC does not exist yet here (0.9.748).
let BANKS = 4;
let fromBank = 0, toBank = -1, fcPid = 0, fcRate = 0, busy = false, live = false, govOk = false;

function setStatus(kind, msg) {
    const b = document.getElementById('status');
    b.style.display = msg ? '' : 'none';      // no banner until there is a status (Malcolm 2026-09-10)
    if (!msg) return;
    b.className = 'banner ' + kind;
    b.textContent = msg;
}
function hexToBytes(h) {
    const out = new Uint8Array(h.length / 2);
    for (let i = 0; i < out.length; i++) out[i] = parseInt(h.substr(i*2, 2), 16);
    return out;
}
function bytesToHex(b) {
    let s = '';
    for (let i = 0; i < b.length; i++) s += b[i].toString(16).padStart(2, '0');
    return s;
}
// Head-speed scaling of the copied gains (Malcolm 2026-09-05: "tune bank 2
// first, copy it to 1 and 3, and let the firmware make intelligent
// reductions / increases for the head speed"). Control power ~ rpm², so
// the loop gain a tune was made at changes with (hsSrc/hsDst)². Going
// FASTER we scale down with exponent 1.5 (a shade soft beats a wobble);
// going SLOWER we scale up with exponent 1 and cap +25 % — too much gain
// wobbles, too little is only soft. The exponents are the thing Malcolm's
// flights calibrate. Words: 3 axes × (P,I,D,F), then B ×3, then O ×2
// (MSP 112, RF 4.6); O is left alone. Gains clamp to Rotorflight's 0–1000.
function hsScale(hsSrc, hsDst) {
    if (!(hsSrc > 0) || !(hsDst > 0)) return null;
    const r = hsSrc / hsDst;
    let f = r < 1 ? Math.pow(r, 1.5) : Math.min(Math.pow(r, 1.0), 1.25);
    const pct = Math.round((f - 1) * 100);
    const speed = Math.round((hsDst / hsSrc - 1) * 100);
    return { factor: f, pct,
             text: 'Bank runs ' + Math.abs(speed) + ' % ' + (speed >= 0 ? 'faster' : 'slower') +
                   ' (' + hsSrc + ' → ' + hsDst + ' rpm): gains ' + (pct >= 0 ? 'up ' : 'down ') + Math.abs(pct) + ' %' };
}
function hsScaleWords(words, f) {
    const out = words.slice();
    for (let i = 0; i < 15 && i < out.length; i++)          // 0..11 = P,I,D,F ×3 axes, 12..14 = B; 15,16 = O untouched
        out[i] = Math.max(0, Math.min(1000, Math.round(out[i] * f)));
    return out;
}
const wordsOf = b => { const w = []; for (let i = 0; i + 1 < b.length; i += 2) w.push(b[i] | (b[i+1] << 8)); return w; };
const bytesOf = w => { const b = new Uint8Array(w.length * 2); w.forEach((v, i) => { b[i*2] = v & 0xff; b[i*2+1] = (v >> 8) & 0xff; }); return b; };
let hsPreview = null;      // {src, dst} head speeds read for the note
async function updateHsNote() {
    const n = document.getElementById('hsNote');
    const on = document.getElementById('c_hsadj').checked;
    if (!on || !live || busy || toBank < 0 || !govOk) { n.textContent = on && !govOk ? 'Needs Rotorflight 2.3 (the governor profile carries the head speed).' : ''; return; }
    try {
        await readWhereFcIs();
        await LDRC.msp(210, P(fromBank)); const a = hexToBytes(await LDRC.msp(148));
        await LDRC.msp(210, P(toBank));   const b = hexToBytes(await LDRC.msp(148));
        await putFcBack();
        const hsS = a[0] | (a[1] << 8), hsD = document.getElementById('c_hs').checked ? hsS : (b[0] | (b[1] << 8));
        const sc = hsScale(hsS, hsD);
        n.textContent = sc ? 'Bank ' + (toBank + 1) + ' ' + sc.text.charAt(0).toLowerCase() + sc.text.slice(1)
                           : (hsS === hsD ? 'Both banks run ' + hsS + ' rpm — nothing to adjust.' : 'A bank has no head speed set — gains would be copied unchanged.');
    } catch (e) { n.textContent = ''; }
}

const P = i => i.toString(16).padStart(2, '0');            // select PID profile i
const R = i => (0x80 | i).toString(16).padStart(2, '0');   // select rate profile i

function paint() {
    LDRC.bankRow('fromRow', 'fb', 'setFrom', BANKS);
    LDRC.bankRow('toRow',   'tb', 'setTo',   BANKS, 'to');
    for (let i = 0; i < BANKS; i++) {
        const fb = document.getElementById('fb' + i), tb = document.getElementById('tb' + i);
        fb.classList.toggle('active', i === fromBank);
        fb.disabled = busy || !live;
        tb.classList.toggle('active', i === toBank);
        tb.disabled = busy || !live || i === fromBank;
    }
    const btn = document.getElementById('copyBtn');
    btn.disabled = busy || !live || toBank < 0 || toBank === fromBank;
    btn.innerHTML = '<span class=ico>&#128203;</span>' +
        (toBank < 0 ? 'Copy bank ' + (fromBank + 1) + ' to &hellip;'
                    : 'Copy bank ' + (fromBank + 1) + ' &rarr; bank ' + (toBank + 1));
    // Lead with the pick, then where the FC actually is — the old "The flight
    // controller is on bank 1 now" read as if the pick had not taken
    // (Malcolm 2026-09-03: "continues to say bank one, when it should have
    // been bank three").
    document.getElementById('fromNote').textContent = !live ? '' :
        fromBank === fcPid
            ? 'Copying from bank ' + (fromBank + 1) + ' — the bank your transmitter’s switch has the flight controller on right now.'
            : 'Copying from bank ' + (fromBank + 1) + '. (Your transmitter’s switch has the flight controller on bank ' +
              (fcPid + 1) + ' right now — this page doesn’t change that.)';
}
function setFrom(i) { if (busy) return; fromBank = i; if (toBank === i) toBank = -1; paint(); updateHsNote(); }
function setTo(i)   { if (busy || i === fromBank) return; toBank = i; paint(); updateHsNote(); }

async function readWhereFcIs() {
    // MSP_STATUS (101): byte 23 = PID profile, byte 25 = rate profile (RF 4.6).
    const b = hexToBytes(await LDRC.msp(101));
    if (b.length > 25) { fcPid = b[23] & 0x0f; fcRate = b[25] & 0x0f; }
}
async function putFcBack() {
    await LDRC.msp(210, P(fcPid));
    await LDRC.msp(210, R(fcRate));
}

async function init() {
    await LDRC.replayReady;
    if (LDRC.replay) {
        setStatus('warn', 'Connect to the model first — copying a bank needs the flight controller live.');
        paint(); return;
    }
    try {
        const st = await LDRC.fetchState();
        const fc = (st && st.fcinfo) || {};
        if (!fc.detected) { setStatus('bad', (st.usb && st.usb.silent) ? 'The flight controller’s USB stopped answering after the restart — power the model off and on.' : 'No flight controller answering — check the model is powered and the protocol is CRSF.'); paint(); return; }
        if (!fc.rotorflight_capable) { setStatus('bad', 'This needs Rotorflight (found ' + (fc.variant || 'unknown') + ').'); paint(); return; }
        // The 17-byte governor profile (MSP 148/149) is Rotorflight 2.3 (API 12.9);
        // on older firmware the governor simply travels with the flight tuning.
        govOk = ((fc.api_major * 100) + fc.api_minor) >= 1209;
        if (!govOk) {
            for (const id of ['c_gov', 'c_hs']) { const c = document.getElementById(id); c.checked = false; c.disabled = true; }
            document.getElementById('govNote').textContent =
                'Rotorflight ' + fc.rf_major + '.' + fc.rf_minor + ': the governor (head speed included) is copied as part of the flight tuning.';
        }
        // Only believe a state that actually carries the counts (0.9.757):
        // an older receiver, or the demo's canned state, has none, and the
        // fallback of 4 was overwriting the six already drawn (Malcolm
        // 2026-09-18: "on Android the bank copy function doesn't yet offer
        // all six banks").
        if (st.fcinfo && (st.fcinfo.pid_banks | 0) >= 1) BANKS = LDRC.bankMax(st, 'pid');
        // More banks here than on the tuning pages is deliberate, and looks
        // like a fault unless it is said once.
        const cap = (st.fcinfo || {}).banks_shown | 0;
        if (cap >= 1 && cap < BANKS) {
            const el = document.getElementById('parkNote');
            el.innerHTML = 'All ' + BANKS + ' banks are here, including the ' +
                (BANKS - cap) + ' you have hidden on the tuning pages &mdash; ' +
                'park a tune you want to keep in one of those before an experiment.';
            el.style.display = '';
        }
        await readWhereFcIs();
        fromBank = Math.min(fcPid, BANKS - 1);
        live = true;
        setStatus('', '');                 // loaded: nothing to say until Copy is tapped
    } catch (e) {
        setStatus('bad', 'Read failed: ' + e.message);
    }
    paint();
}

async function copyBank() {
    if (busy || !live || toBank < 0 || toBank === fromBank) return;
    const doFlight = document.getElementById('c_flight').checked;
    const doRates  = document.getElementById('c_rates').checked;
    const doGov    = govOk && document.getElementById('c_gov').checked;
    const doHs     = govOk && document.getElementById('c_hs').checked;
    const doAdj    = govOk && doFlight && document.getElementById('c_hsadj').checked;
    const touchGov = govOk && (doFlight || doGov);   // governor block needs putting right afterwards
    if (!doFlight && !doRates && !doGov) { setStatus('bad', 'Tick at least one thing to copy.'); return; }
    const what = [doFlight && (govOk ? (doAdj ? 'flight tuning (gains adjusted for head speed)' : 'flight tuning') : 'flight tuning incl. governor'),
                  doRates  && 'rates',
                  doGov    && (doHs ? 'governor incl. head speed' : 'governor gains (head speed kept)')]
                 .filter(Boolean).join(', ');
    const from = fromBank + 1, to = toBank + 1;
    if (!(await LDRC.confirm('Copy ' + what + ' from bank ' + from + ' to bank ' + to +
            '? Bank ' + to + '’s own values for these are overwritten.',
            {title: 'Copy bank ' + from + ' → ' + to, icon: '📋', yes: 'Copy + verify', kind: 'warn'}))) return;
    busy = true; paint();
    try {
        await readWhereFcIs();                       // so we can put it back afterwards

        // 1. Read the source bank — the yardstick for the read-back check.
        setStatus('info', 'Reading bank ' + from + '…');
        await LDRC.msp(210, P(fromBank));
        const srcPid  = doFlight ? (await LDRC.msp(112)).toLowerCase() : null;
        const srcAdv  = doFlight ? (await LDRC.msp(94)).toLowerCase()  : null;
        const srcResc = doFlight ? (await LDRC.msp(146)).toLowerCase() : null;
        const srcGov  = touchGov ? hexToBytes(await LDRC.msp(148)) : null;
        let srcRates = null;
        if (doRates) { await LDRC.msp(210, R(fromBank)); srcRates = (await LDRC.msp(111)).toLowerCase(); }
        if (srcGov && srcGov.length < 17) throw new Error('governor profile too short (' + srcGov.length + ' bytes)');

        // 2. Read the target's governor — its head speed is kept unless asked,
        //    and the whole block is put back if governor gains are unticked.
        let dstGov = null;
        if (touchGov) {
            await LDRC.msp(210, P(toBank));
            dstGov = hexToBytes(await LDRC.msp(148));
            if (dstGov.length < 17) throw new Error('governor profile too short (' + dstGov.length + ' bytes)');
        }

        // 3. Copy.
        setStatus('info', 'Copying to bank ' + to + '…');
        if (doFlight) await LDRC.msp(183, '00' + P(toBank) + P(fromBank));
        let expGov = null;
        if (touchGov) {
            if (doGov) {
                expGov = Uint8Array.from(srcGov);
                if (!doHs) { expGov[0] = dstGov[0]; expGov[1] = dstGov[1]; }
            } else {
                // Flight tuning brought the source's governor along — put the target's own back.
                expGov = Uint8Array.from(dstGov);
            }
            await LDRC.msp(210, P(toBank));
            await LDRC.msp(149, bytesToHex(expGov));
        }
        if (doRates) await LDRC.msp(183, '01' + P(toBank) + P(fromBank));
        // 3b. Head-speed adjustment: scale the copied PIDs by the two head
        //     speeds (the target's FINAL one — it may just have been copied).
        let expPid = srcPid, adjText = '';
        if (doAdj) {
            const hsS = srcGov ? (srcGov[0] | (srcGov[1] << 8)) : 0;
            const hsD = expGov ? (expGov[0] | (expGov[1] << 8)) : 0;
            const sc = hsScale(hsS, hsD);
            if (sc && sc.pct !== 0) {
                setStatus('info', 'Adjusting gains for ' + hsD + ' rpm…');
                await LDRC.msp(210, P(toBank));
                const w = hsScaleWords(wordsOf(hexToBytes(await LDRC.msp(112))), sc.factor);
                expPid = bytesToHex(bytesOf(w)).toLowerCase();
                await LDRC.msp(202, expPid);
                adjText = ' Gains ' + (sc.pct >= 0 ? 'up ' : 'down ') + Math.abs(sc.pct) + ' % for bank ' + to + '’s ' +
                          (hsD > hsS ? 'faster' : 'slower') + ' head speed (' + hsS + ' → ' + hsD + ' rpm).';
            } else {
                adjText = sc ? ' Both banks run ' + hsS + ' rpm, so the gains are unchanged.' : ' A bank has no head speed set, so the gains are copied unchanged.';
            }
        }
        setStatus('info', 'Saving…');
        await LDRC.msp(250);

        // 4. Read the target back and compare byte-for-byte.
        setStatus('info', 'Verifying — reading bank ' + to + ' back…');
        const bad = [];
        await LDRC.msp(210, P(toBank));
        if (doFlight) {
            if ((await LDRC.msp(112)).toLowerCase() !== expPid)  bad.push('PIDs');
            if ((await LDRC.msp(94)).toLowerCase()  !== srcAdv)  bad.push('PID +');
            if ((await LDRC.msp(146)).toLowerCase() !== srcResc) bad.push('rescue');
        }
        if (expGov) {
            const got = hexToBytes(await LDRC.msp(148));
            if (bytesToHex(got.slice(0, 17)) !== bytesToHex(expGov.slice(0, 17))) bad.push('governor');
        }
        if (doRates) {
            await LDRC.msp(210, R(toBank));
            if ((await LDRC.msp(111)).toLowerCase() !== srcRates) bad.push('rates');
        }

        // 5. Back to the bank the flight controller was on.
        await putFcBack();

        // The result goes in the banner AND a pop-up: the Copy button is
        // pinned to the bottom, so the banner at the top has usually scrolled
        // out of sight by now (Malcolm 2026-09-03: "I hoped to see a
        // confirmation banner — I did not see one").
        if (bad.length) {
            const msg = 'Copied, but ' + bad.join(', ') + ' read back differently — open that page on bank ' + to + ' and check.';
            setStatus('bad', '⚠ ' + msg);
            await LDRC.alert(msg, {title: 'Check bank ' + to, icon: '⚠️', kind: 'danger'});
        } else {
            const hs = expGov ? (expGov[0] | (expGov[1] << 8)) : null;
            const msg = 'Bank ' + from + ' copied to bank ' + to + ' and verified: ' + what +
                (hs !== null ? '. Bank ' + to + ' head speed is ' + hs + ' rpm.' : '.') + adjText;
            setStatus('good', '✓ ' + msg);
            if (LDRC.baseClear) LDRC.baseClear();          // the copied bank's numbers are its sliders' new centres
            await LDRC.alert(msg, {title: 'Copied and verified', icon: '✅'});
        }
    } catch (e) {
        const msg = 'Copy failed: ' + e.message + '. Nothing was saved unless it got as far as Saving — if in doubt, open bank ' + to + '’s pages and look.';
        setStatus('bad', msg);
        try { await putFcBack(); } catch (_) {}
        await LDRC.alert(msg, {title: 'Not copied', icon: '⚠️', kind: 'danger'});
    }
    busy = false; paint();
    window.scrollTo({top: 0, behavior: 'smooth'});   // the banner keeps the result on screen
}

document.addEventListener('DOMContentLoaded', () => {
    BANKS = LDRC.bankMax(LDRC.bankInfo(), 'pid');
    paint(); init();
    // The same tiny source every tuning page uses (cache-backed): right even
    // before the flight controller answers, and in the demo.
    LDRC.fetchBanks().then(b => { const n = LDRC.bankMax(b, 'pid'); if (n !== BANKS) { BANKS = n; paint(); } });
});
</script>
<template id=helpContent><h2>Copy a bank</h2>
<p>Copies a whole bank to another in one go &mdash; instead of visiting the PIDs, PID +, Rates, Rescue and Governor pages one by one and copying each.</p>
<h3>What a bank is</h3>
<p>Bank N is Rotorflight&rsquo;s PID profile N together with rate profile N &mdash; the same numbering the other pages use and the bank switch on your transmitter selects.</p>
<h3>Parking a tune before an experiment</h3>
<p>Copy the bank you are happy with into a bank you never fly &mdash; bank 6, say &mdash; before you start changing things. If the experiment goes badly, copy it back and you are exactly where you were. Quicker than a full restore, and it survives the flying session.</p>
<p>This page shows <b>every</b> bank the flight controller has, even the ones you have hidden with <b>How many banks</b> on the Rotorflight page. That is on purpose: a bank you never fly is the best place to park, and parking would be useless if you could not copy it back.</p>
<h3>What gets copied</h3>
<ul>
<li><b>Flight tuning</b> &mdash; everything on the PIDs, PID + and Rescue pages (and a few Rotorflight settings only the CLI shows).</li>
<li><b>Rates &amp; dynamics</b> &mdash; the rate profile.</li>
<li><b>Governor gains</b> &mdash; the Governor (profile) page. The target bank <b>keeps its own head speed</b> unless you tick &ldquo;Head speed too&rdquo;.</li>
</ul>
<h3>Safety</h3>
<ul>
<li>Refused while the model is armed. Do it on the ground, blades off.</li>
<li>Every copied block is read back from the target bank and compared byte for byte before it says done.</li>
<li>The flight controller is returned to the bank it was on. The swashplate may twitch once or twice while banks switch &mdash; harmless, on the ground only.</li>
</ul>
<p><b>Adjust gains for the target bank&rsquo;s head speed</b> &mdash; the tick that rescales what it copies: the P, I, D, feedforward and boost are scaled by the two banks&rsquo; head speeds, down fully for a faster bank and up at most 25&nbsp;% for a slower one. Filters, offsets and the governor are left alone.</p>
</template>
</body>
