<template id=helpContent><h2>Diff &amp; execute</h2>
<p>A <b>diff</b> is every Rotorflight setting that differs from Rotorflight&rsquo;s own, as text: the same file the transmitter&rsquo;s <b>Diff to card</b> writes. It is kept <b>on this phone</b>, named after the model and the time it was made.</p>
<h3>Diff to phone</h3>
<p>Asks the flight controller for <b>diff all</b> (every bank) and keeps it. The flight controller then restarts; nothing on the model changes. A good habit after each tuning session: each diff is a point you can go back to.</p>
<h3>Execute</h3>
<p>Sends a diff&rsquo;s commands back to the flight controller, then saves: it restarts with those settings. Only this model&rsquo;s diffs are offered. A command the flight controller refuses (a setting this version does not have, for example) is counted and listed; the rest are still saved.</p>
<p>If the link drops or the phone sleeps part way, <b>nothing is saved</b>: the flight controller restarts with its settings as they were, and you can execute again.</p>
<h3>View, Share, Delete</h3>
<p><b>View</b> shows the file. <b>Share</b> hands it to the phone&rsquo;s share sheet: email it to yourself, or AirDrop it. <b>Delete</b> removes it from this phone.</p>
<h3>Needs</h3>
<p>The USB cable from the flight controller&rsquo;s USB socket to the receiver&rsquo;s (or the dongle&rsquo;s), and the transmitter off or its safety on. While a diff or an execute runs, the flight controller cannot arm and the other pages pause.</p>
</template>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---- the transmitter's lib/LdrcCli (ESP32-board2 board4/nextion-emulator), the parts that decide: the same lines, the
// same file names, the same commands, the same test of a whole diff
function cliLines(reply) {                                  // a reply as lines: carriage returns and control bytes dropped, the prompt and empty lines at the end dropped
    const out = [], s = String(reply || '');
    let cur = '';
    for (let i = 0; i <= s.length; ++i) {
        const c = i < s.length ? s[i] : '\n';
        if (c === '\r') continue;
        if (c === '\n') { out.push(cur); cur = ''; continue; }
        if (c.charCodeAt(0) < 32) continue;
        cur += c;
    }
    while (out.length) {
        const l = out[out.length - 1].replace(/ +$/, '');
        if (l === '' || l === '#') { out.pop(); continue; }
        if (l.endsWith(' #')) { out[out.length - 1] = l.slice(0, -2); continue; }
        out[out.length - 1] = l;
        break;
    }
    return out;
}
function safeName(model) {                                  // "Black Thunder 2" -> "Black_Thunder_2" (20 at most; "model" when none)
    let n = '';
    for (const c of String(model || '')) {
        if (n.length >= 20) break;
        if (/[A-Za-z0-9-]/.test(c)) n += c;
        else if ((c === ' ' || c === '_') && n && !n.endsWith('_')) n += '_';
    }
    n = n.replace(/_+$/, '');
    return n || 'model';
}
function stampOf(d) { const p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()); }
function diffFileName(model, d) { return safeName(model) + '_' + stampOf(d) + '.txt'; }
function fileKey(name, prefix) {                            // a file's place in time from its name ("..._2026-10-16_1548.txt" -> 202610161548; "..._7.txt" -> 7), -1: not this model's
    name = String(name);
    if (name.length <= prefix.length + 4 || !name.startsWith(prefix)) return -1;
    let tail = name.slice(prefix.length);
    if (tail.slice(-4).toLowerCase() !== '.txt') return -1;
    tail = tail.slice(0, -4);
    if (!tail || tail.length > 15) return -1;
    const digits = tail.length === 15 && tail[4] === '-' && tail[7] === '-' && tail[10] === '_' ? tail.slice(0, 4) + tail.slice(5, 7) + tail.slice(8, 10) + tail.slice(11) : tail;
    return /^[0-9]+$/.test(digits) ? Number(digits) : -1;
}
function modelDiffs(model, names) {                         // the model's diffs, newest first ("Goblin_700_..." is not a diff of "Goblin")
    const pre = safeName(model) + '_';
    return names.map(n => [fileKey(n, pre), n]).filter(k => k[0] >= 0).sort((a, b) => b[0] - a[0]).map(k => k[1]);
}
function diffWhen(name) {                                   // "16 Oct 2026, 15:48" from the name's stamp; "" without one
    const m = /(\d{4})-(\d{2})-(\d{2})_(\d{2})(\d{2})\.txt$/i.exec(String(name));
    if (!m || +m[2] < 1 || +m[2] > 12 || +m[3] < 1 || +m[3] > 31) return '';
    return (+m[3]) + ' ' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][+m[2] - 1] + ' ' + m[1] + ', ' + m[4] + ':' + m[5];
}
function cliCommands(text) {                                // a diff's commands: not empty, not comments; save, exit, reboot, defaults, the bootloaders and msc left out (the save is the job's own)
    const out = [];
    for (const l of cliLines(text)) {
        const c = l.trim();
        if (!c || c[0] === '#') continue;
        const low = c.toLowerCase();
        if (low === 'save' || low === 'exit' || low === 'reboot' || low === 'defaults' || low.startsWith('dfu') || low.startsWith('bl') || low === 'msc') continue;
        if (c.length > 160) continue;
        out.push(c);
    }
    return out;
}
function diffWhole(lines) {                                 // a diff's head, and settings in it (a Rotorflight 4.6 diff all ends with "save"; the receiver's 200 says it is all there)
    let head = false, settings = false;
    lines.forEach((l, i) => {
        if (i < 5 && (l.includes('diff') || l.includes('# version'))) head = true;
        if (l === 'batch start' || l === 'save' || l.startsWith('set ') || l.startsWith('feature ') || l.startsWith('board_name')) settings = true;
    });
    return head && settings && lines.length >= 3;
}
function errorWords(line) {                                 // "###ERROR IN diff: CORRUPTED CONFIG: gov_mode = 7###" -> "a setting out of range: gov_mode = 7"
    const t = String(line).replace(/^[# ]+/, '').replace(/[# \r]+$/, '');
    const c = t.indexOf('CORRUPTED CONFIG: ');
    return c >= 0 ? 'a setting out of range: ' + t.slice(c + 18) : t;
}
const isRefusal = l => l.includes('###ERROR') || l.includes('Invalid') || l.includes('UNKNOWN COMMAND');

// ---- the receiver's command line (as the Command line page and the transmitter use it): one command a request
let pause = ms => new Promise(r => setTimeout(r, ms));
let now = () => Date.now();
let cliMayBeOpen = false;                                   // a request has gone: the flight controller's command line may be open - it is left before the page goes
let lastAskAt = 0;                                          // when the last request went (0: a job's first)
// The receiver leaves a command line idle for 90 s without saving. A page that stood still longer than a minute between two
// requests (the phone slept, the app was put away - even while a reply was on its way) may have lost it, and a later save
// would keep only what came after: so the job stops instead.
function stoodStill() { return cliMayBeOpen && lastAskAt > 0 && now() - lastAskAt > 60000; }
const stillWords = () => 'the page stood still for ' + Math.round((now() - lastAskAt) / 1000) + ' s (the phone slept?)';
async function cliAsk(cmd, onMore) {
    if (stoodStill()) return { ok: false, code: -1, body: '', why: stillWords() };
    cliMayBeOpen = true; lastAskAt = now();
    let r, t;
    try { r = await fetch('/api/cli?cmd=' + encodeURIComponent(cmd) + '&wait=5000', { cache: 'no-store' }); t = await r.text(); }
    catch (e) { return { ok: false, code: 0, body: '', why: 'no answer from the receiver' }; }
    for (let n = 0; r.status === 202; ++n) {                // the start of a long reply: the rest from /api/cli/out until it is whole (90 s at most)
        if (n >= 180) return { ok: false, code: 202, body: t, why: 'the reply never ended (' + cliLines(t).length + ' lines)' };
        if (onMore) onMore(cliLines(t).length);
        await pause(500);
        if (stoodStill()) return { ok: false, code: -1, body: t, why: stillWords() };
        lastAskAt = now();
        try { r = await fetch('/api/cli/out', { cache: 'no-store' }); t = await r.text(); }
        catch (e) { return { ok: false, code: 0, body: '', why: 'no answer from the receiver' }; }
    }
    return { ok: r.status === 200, code: r.status, body: t, why: r.status === 200 ? '' : (t || 'error ' + r.status) };
}
async function cliLeave(save) {                             // save or not; either restarts the flight controller (a line that is not open: answered, nothing restarts)
    try {
        const r = await fetch('/api/cli/leave', { method: 'POST', body: new URLSearchParams({ save: save ? '1' : '0' }) });
        const t = await r.text();
        if (r.ok) cliMayBeOpen = false;
        return { ok: r.ok, why: t };
    } catch (e) { return { ok: false, why: 'no answer from the receiver' }; }
}
function leftWords(lv) {                                    // a leave that did not happen: what it means and what to do
    return lv.ok ? '' : '\n\nThe command line could not be closed: ' + lv.why + '. The flight controller cannot arm until it is: open Command line (À la carte) and tap Leave without saving.';
}

// ---- the files, kept by the app (/app/diff/*: BleSchemeHandler.swift, MainActivity.kt)
async function appJson(path, opts) {
    try { const r = await fetch(path, Object.assign({ cache: 'no-store' }, opts || {})); return await r.json(); }
    catch (e) { return { ok: false, error: 'the app did not answer' }; }
}
const appList = () => appJson('/app/diff/list');
const appSave = (name, text) => appJson('/app/diff/save?name=' + encodeURIComponent(name), { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: text });
const appLoad = name => appJson('/app/diff/load?name=' + encodeURIComponent(name));
const appDelete = name => appJson('/app/diff/delete?name=' + encodeURIComponent(name));
const appShare = name => appJson('/app/diff/share?name=' + encodeURIComponent(name));
const appAwake = s => appJson('/app/awake?s=' + s);         // the screen kept on while a job runs (a phone that sleeps stops the page)

// ---- the page
let busy = false, model = '', viewing = '';
function progress(text, frac) {                             // frac < 0: a sweep (how far the flight controller is cannot be known)
    $('prog').style.display = text ? '' : 'none';
    if (!text) return;
    $('progLab').textContent = text;
    const f = $('progFill');
    if (frac < 0) { f.className = 'sweep'; f.style.width = '35%'; f.style.animation = 'dSweep 1.1s ease-in-out infinite'; }
    else { f.className = ''; f.style.animation = 'none'; f.style.marginLeft = '0'; f.style.width = Math.round(100 * Math.min(1, Math.max(0, frac))) + '%'; }
}
function setBusy(b) {
    busy = b;
    document.querySelectorAll('#diffBtn, .dBtns button').forEach(el => { el.disabled = b || (el.classList.contains('usbOnly') && !usbOk); });
}
let usbOk = false;
async function usbGate() {                                   // a flight controller on the receiver's (or dongle's) USB socket: Diff and Execute need it
    const s = await LDRC.fetchState();
    usbOk = !!(s && s.usb && s.usb.device);
    model = (s && s.info && s.info.name) || model;
    const g = $('needUsb');
    g.style.display = usbOk || !s ? 'none' : '';
    if (s && !usbOk) g.textContent = s.sim ? 'Simulator mode is using the USB socket. Turn the simulator off (Setup) to reach the flight controller.'
        : 'Diff and Execute need the USB cable: plug the flight controller’s USB socket into the ' + (s.dongle ? 'dongle' : 'receiver') + '’s.';
    if (!busy) setBusy(false);
    return usbOk ? s : null;
}
async function refreshList() {
    const r = await appList();
    const names = (r && r.ok && Array.isArray(r.files)) ? r.files.map(f => f.name) : [];
    const bytes = {}; ((r && r.files) || []).forEach(f => { bytes[f.name] = f.bytes || 0; });
    const mine = modelDiffs(model, names);
    $('listCard').style.display = '';
    $('listHead').textContent = (model ? 'Diffs of ' + model : 'Diffs') + ' on this phone';
    $('list').innerHTML = mine.length ? mine.map(n => '<div class=dRow data-name="' + esc(n) + '"><span class=dWhen>' + esc(diffWhen(n) || n) + '</span><span class=dSize>' + Math.max(1, Math.round((bytes[n] || 0) / 1024)) + ' kB</span>'
        + '<div class=dBtns><button type=button class=usbOnly style="background:#b3703c" data-act=exec>&#9654;&#65039; Execute</button>'
        + '<button type=button style="background:#4f7fa0" data-act=view>' + (viewing === n ? 'Hide' : 'View') + '</button>'
        + '<button type=button style="background:#5f8fab" data-act=share>&#128228; Share</button>'
        + '<button type=button style="background:#8a8f94" data-act=delete>&#128465;&#65039; Delete</button></div></div>').join('')
        : '<p class=muted style="margin:.3em 0">None yet. <b>Diff to phone</b> makes one.</p>';
    $('list').querySelectorAll('.dRow button').forEach(b => {
        const n = b.closest('.dRow').dataset.name;
        b.onclick = () => ({ exec: executeDiff, view: viewDiff, share: shareDiff, delete: deleteDiff })[b.dataset.act](n);
    });
    if (viewing && !mine.includes(viewing)) { viewing = ''; $('viewBox').style.display = 'none'; }
    setBusy(busy);
}

// Diff to phone: diff all, kept on the phone, and out of the command line again (the flight controller restarts; nothing changed)
async function diffToPhone() {
    if (busy) return;
    const s = await usbGate(); if (!s) return;
    setBusy(true); appAwake(300); lastAskAt = 0;
    progress('Asking the flight controller for diff all…', -1);
    const res = await cliAsk('diff all', n => progress('Still printing… ' + n + ' lines so far', -1));
    let title = 'Diff to phone: NOT saved', icon = '⚠️', msg;
    if (!res.ok && res.code === 409) msg = 'The receiver said: ' + res.why;   // (its own no: nothing was opened)
    else if (!res.ok) msg = 'No diff: ' + res.why + '.' + leftWords(await cliLeave(false)) + (cliMayBeOpen ? '' : '\n\nThe command line was left: nothing changed.');
    else {
        const lines = cliLines(res.body);
        if (!diffWhole(lines)) {
            msg = 'That was not a whole diff: ' + lines.length + ' lines, first “' + (lines[0] || '').slice(0, 24) + '”, last “' + (lines[lines.length - 1] || '').slice(0, 24) + '”.' + leftWords(await cliLeave(false));
        } else {
            const name = diffFileName(model, new Date(now()));
            const sv = await appSave(name, lines.join('\n') + '\n');
            if (!sv || !sv.ok) msg = 'The phone would not keep it: ' + ((sv && sv.error) || 'no answer') + '.' + leftWords(await cliLeave(false));
            else {
                const errs = lines.filter(l => l.includes('###ERROR'));
                progress('Saved. Leaving the command line…', 1);
                const lv = await cliLeave(false);
                title = 'Diff to phone: saved'; icon = errs.length ? '⚠️' : '✅';
                msg = 'Kept on this phone as ' + name + ' (' + lines.length + ' lines).'
                    + (errs.length ? '\n\nThe flight controller reported ' + errorWords(errs[0]) + (errs.length > 1 ? ' (and ' + (errs.length - 1) + ' more in the file)' : '') + '.' : '')
                    + (lv.ok ? '\n\nThe flight controller is restarting (nothing changed).' : leftWords(lv));
            }
        }
    }
    progress('', 0); appAwake(0); setBusy(false);
    await refreshList();
    await LDRC.alert(msg, { title, icon });
}

// Execute: a diff's commands to the command line, one by one, then saved (the flight controller restarts with them)
async function executeDiff(name) {
    if (busy) return;
    const s = await usbGate(); if (!s) return;
    const f = await appLoad(name);
    if (!f || !f.ok) { await LDRC.alert('Could not read ' + name + ': ' + ((f && f.error) || 'no answer') + '.', { title: 'Execute diff', icon: '⚠️' }); return; }
    const cmds = cliCommands(f.text);
    if (!cmds.length) { await LDRC.alert('Nothing to execute in ' + name + ' (no commands in it).', { title: 'Execute diff', icon: '⚠️' }); return; }
    if (!(await LDRC.confirm('Execute the diff of ' + (diffWhen(name) || name) + '?\n\nIts ' + cmds.length + ' commands go to the flight controller’s command line, then it saves and restarts with those settings.',
        { title: 'Execute diff', icon: '▶️', yes: 'Execute', kind: 'warn' }))) return;
    setBusy(true); appAwake(900); lastAskAt = 0;
    let sent = 0, batchOpen = false, stop = '';
    const refused = [];
    for (let i = 0; i < cmds.length && !stop; ++i) {
        const c = cmds[i], low = c.toLowerCase().replace(/\s+/g, ' ');
        progress('Executing… ' + (i + 1) + ' of ' + cmds.length + (refused.length ? ' (' + refused.length + ' refused)' : ''), i / cmds.length);
        if (low === 'batch start') batchOpen = true; else if (low === 'batch end') batchOpen = false;
        const res = await cliAsk(c);
        if (!res.ok) {
            if (sent === 0 && res.code === 409) { progress('', 0); appAwake(0); setBusy(false); await LDRC.alert('The receiver said: ' + res.why, { title: 'Execute diff: not started', icon: '⚠️' }); return; }
            stop = 'command ' + (i + 1) + ' of ' + cmds.length + ' (' + c + '): ' + res.why;
            break;
        }
        sent++;
        const ls = cliLines(res.body), bad = ls.find(isRefusal);
        if (bad) refused.push(c + '\n   ' + bad);
    }
    // B53 (the transmitter's): Rotorflight will not save while a command batch with errors in it is still open, and a
    // Rotorflight 4.6 diff opens its batch and never closes it (it ends with "save") - so it is closed first
    if (!stop && refused.length && batchOpen) {
        const res = await cliAsk('batch end');
        if (!res.ok) stop = 'closing the batch: ' + res.why;
    }
    let title, icon, msg;
    if (stop) {
        const lv = await cliLeave(false);
        title = 'Execute diff: NOT done'; icon = '⚠️';
        msg = 'Stopped at ' + stop + '.\n\nNothing was saved' + (lv.ok ? ': the flight controller is restarting with its settings as they were. Execute again when ready.' : '.' + leftWords(lv));
    } else {
        progress('All ' + cmds.length + ' sent. Saving…', 1);
        const lv = await cliLeave(true);
        title = lv.ok ? 'Execute diff: saved' : 'Execute diff: NOT saved'; icon = lv.ok && !refused.length ? '✅' : '⚠️';
        msg = 'Executed: ' + sent + ' commands sent, ' + refused.length + ' refused.'
            + (lv.ok ? '\n\nSaved: the flight controller is restarting with them.' : '\n\nNOT saved: ' + lv.why + '. The flight controller cannot arm until the command line is closed: open Command line (À la carte) and tap Leave without saving.')
            + (refused.length ? '\n\nRefused (left out):\n' + refused.slice(0, 8).join('\n') + (refused.length > 8 ? '\n... and ' + (refused.length - 8) + ' more' : '') : '');
    }
    progress('', 0); appAwake(0); setBusy(false);
    await LDRC.alert(msg, { title, icon });
}

async function viewDiff(name) {
    if (viewing === name) { viewing = ''; $('viewBox').style.display = 'none'; refreshList(); return; }
    const f = await appLoad(name);
    if (!f || !f.ok) { await LDRC.alert('Could not read ' + name + '.', { title: 'View', icon: '⚠️' }); return; }
    viewing = name;
    $('viewBox').textContent = name + '\n\n' + f.text;
    $('viewBox').style.display = '';
    refreshList();
    if ($('viewBox').scrollIntoView) $('viewBox').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
async function shareDiff(name) {
    const r = await appShare(name);
    if (!r || !r.ok) await LDRC.alert((r && r.error) || 'Could not share it.', { title: 'Share', icon: '📤' });
}
async function deleteDiff(name) {
    if (!(await LDRC.confirm('Delete the diff of ' + (diffWhen(name) || name) + ' from this phone?', { title: 'Delete', icon: '🗑️', yes: 'Delete', kind: 'danger' }))) return;
    const r = await appDelete(name);
    if (!r || !r.ok) await LDRC.alert((r && r.error) || 'Could not delete it.', { title: 'Delete', icon: '⚠️' });
    if (viewing === name) { viewing = ''; $('viewBox').style.display = 'none'; }
    refreshList();
}

// Leaving the page while the command line may be open leaves it without saving (as the Command line page does): the
// home and back buttons wait for it; a swipe or the app closed get a keepalive request. The receiver also closes an
// idle command line by itself after 90 s.
function armLeaveOnExit() {
    document.addEventListener('click', async (e) => {
        const a = e.target.closest && e.target.closest('a.homeBtn, a.backBtn');
        if (!a || !cliMayBeOpen) return;
        e.preventDefault();
        await cliLeave(false);
        location.href = a.href;
    }, true);
    window.addEventListener('pagehide', () => {
        if (cliMayBeOpen) fetch('/api/cli/leave', { method: 'POST', body: new URLSearchParams({ save: '0' }), keepalive: true }).catch(() => {});
        appAwake(0);
    });
}

document.addEventListener('DOMContentLoaded', async () => {
    await LDRC.replayReady;
    if (!(window.LDRC && LDRC.viaBle && !LDRC.replay)) { $('appNote').style.display = ''; return; }
    armLeaveOnExit();
    $('diffBtn').style.display = '';
    await usbGate();
    await refreshList();
    setInterval(() => { if (!busy) usbGate(); }, 4000);
});
</script>
