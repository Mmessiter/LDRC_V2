<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name=theme-color content="#5fa099">
<meta name=apple-mobile-web-app-capable content=yes>
<meta name=apple-mobile-web-app-status-bar-style content=black-translucent>
<meta name=apple-mobile-web-app-title content="LDRC RX V2">
<title>Receiver log &middot; LDRC RX V2</title>
<link rel=stylesheet href="/style.css?v=290">
<script src="/app.js?v=290" defer></script>
</head>
<body>
<button class=helpBtn aria-label=Help title=Help onclick="LDRC.showHelp()">?</button>
<div class=bg-photo aria-hidden=true></div>
<div class=bg-wash  aria-hidden=true></div>
<div class=container>
    <h1>Receiver log</h1>
    <p class=subtitle>What <b>this receiver</b> saw: live status, the radio link, past flights, events</p>

    <!-- Live battery/status stays right here — the at-a-glance check you want
         the moment you open the Receiver log, no extra tap. -->
    <div class=card>
        <h2 style="margin-top:0">Status</h2>
        <div style="display:flex;align-items:center;gap:.5em;margin:.1em 0 .3em;flex-wrap:wrap">
            <svg id=battSvg width=66 height=30 viewBox="0 0 66 30" style="flex:none" aria-hidden=true>
                <rect x=1 y=3 width=56 height=24 rx=3 fill=none stroke=#8199a8 stroke-width=2></rect>
                <rect x=58 y=11 width=5 height=8 rx=1.5 fill=#8199a8></rect>
                <rect id=battFill x=4 y=6 width=0 height=18 rx=1.5 fill=#2e7d32></rect>
            </svg>
            <span id=stCell style="font-size:2.4em;font-weight:700;line-height:1">&mdash;</span>
            <span style="font-size:1.0em;color:#5a6b74;align-self:flex-end;padding-bottom:.3em">V/cell</span>
            <span id=stPack class=muted style="margin-left:.3em;font-size:1.0em;align-self:flex-end;padding-bottom:.3em"></span>
        </div>
        <div id=stRows class=muted style="font-size:.92em;line-height:1.8"></div>
        <p id=stNote class=muted style="font-size:.82em;margin-top:.55em"></p>
    </div>

    <a class="btn" href="/flight" style="background:#4a90c9"><span class=ico>&#128200;</span>Flight analysis &mdash; graph &amp; link stats</a>
    <a class="btn" href="/events" style="background:#6f7e8b"><span class=ico>&#128209;</span>Event log</a>
    <!-- App-only (Malcolm 2026-08-04): explicit, verifiable snapshot of the
         whole session to the phone for the offline armchair review. -->
    <button id=saveSnapBtn class="btn" style="display:none;background:#5fa099"><span class=ico>&#128190;</span>Save session to phone</button>
    <!-- Solid progress panel (Malcolm 2026-08-04: no translucent text, and a
         real progress bar while the session saves). -->
    <div id=snapProg style="display:none;background:#f2f6f8;border-radius:14px;padding:1em 1.2em;margin:.7em 0;box-shadow:0 2px 6px rgba(0,0,0,.12)">
        <div id=snapLab style="font-weight:600;color:#2c3e50;margin-bottom:.6em">Saving session&hellip;</div>
        <div style="background:#d5dde4;border-radius:8px;height:14px;overflow:hidden">
            <div id=snapFill style="background:#5fa099;height:100%;width:0%;border-radius:8px;transition:width .4s"></div>
        </div>
        <div id=snapWarn style="margin-top:.6em;font-size:.85em;color:#5c3a1a;background:#ffc88c;border-radius:8px;padding:.45em .7em">
            &#9888;&#65039; Don't switch the transmitter ON or the model OFF until this finishes.
        </div>
    </div>

    <div class=footer></div>
</div>

<script>
// Resting-LiPo state-of-charge from per-cell voltage (the FC's own % is mAh-based
// and reads ~full on the bench even when the pack is half-empty by voltage).
function lipoPct(v) {
    const T = [[3.27,0],[3.61,5],[3.69,10],[3.71,15],[3.73,20],[3.75,25],[3.77,30],
               [3.79,35],[3.80,40],[3.82,45],[3.84,50],[3.85,55],[3.87,60],[3.91,65],
               [3.95,70],[3.98,75],[4.02,80],[4.08,85],[4.11,90],[4.15,95],[4.20,100]];
    if (v <= T[0][0]) return 0;
    if (v >= T[T.length - 1][0]) return 100;
    for (let i = 1; i < T.length; i++) {
        if (v <= T[i][0]) {
            const v0 = T[i-1][0], p0 = T[i-1][1], v1 = T[i][0], p1 = T[i][1];
            return Math.round(p0 + (p1 - p0) * (v - v0) / (v1 - v0));
        }
    }
    return 100;
}

// Live status — battery voltage etc. from the FC's telemetry (available whenever
// the model is powered; the transmitter does not need to be on).
async function refreshStatus() {
    const s = await LDRC.fetchState();
    if (!s) return;
    const fc = s.fc || {}, rf = s.rf || {};
    const telemLive = (typeof fc.last_frame_ms === 'number' && fc.last_frame_ms >= 0 && fc.last_frame_ms < 3000);
    // After the model powers down, keep showing the LAST-KNOWN voltage
    // (greyed, with its age) instead of a blank — that post-flight moment is
    // exactly when Malcolm checks "did I land the packs at 3.80 V/cell?"
    // (2026-08-14). fc.v is the receiver's cached last reading; a reboot
    // clears it, so a stale figure can never outlive the session it came from.
    const vStale = (!telemLive && typeof fc.last_frame_ms === 'number' &&
                    fc.last_frame_ms >= 3000 && +fc.v > 0.5) ? +fc.v : null;
    const v = telemLive ? +fc.v : vStale;
    const cellEl = document.getElementById('stCell');
    const packEl = document.getElementById('stPack');
    const fill = document.getElementById('battFill');
    if (v != null && v > 0.5) {
        // Cell count: the FC's own answer when it gives one (45.1 V is 11S
        // nearly-full AND 12S at storage — volts alone cannot decide), else
        // guess — knowing packs above 4S only come in EVEN counts (6S, 8S,
        // 12S… never 11S; Malcolm 2026-08-05), which settles the ambiguity.
        let guess = Math.max(1, Math.ceil(v / 4.3));
        if (guess > 4 && (guess % 2)) guess++;
        const cells = (fc.cells > 0) ? fc.cells : guess;
        const per = v / cells;
        const soc = lipoPct(per);                            // resting state-of-charge
        const col = soc >= 50 ? '#2e7d32' : soc >= 20 ? '#d99a3a' : '#c0392b';  // green / amber / red
        cellEl.textContent = per.toFixed(2);
        cellEl.style.color = telemLive ? col : '#5a6b74';    // grey when it's a last-known reading
        let packLine = cells + 'S &middot; ' + v.toFixed(2) + ' V &middot; ~' + soc + '%';
        if (!telemLive) {
            const ageS = Math.round(fc.last_frame_ms / 1000);
            const ageTxt = ageS < 90 ? ageS + ' s' : Math.round(ageS / 60) + ' min';
            packLine += ' <span style="color:#5a6b74">&middot; last seen ' + ageTxt + ' ago</span>';
        }
        packEl.innerHTML = packLine;
        fill.setAttribute('width', Math.max(0, Math.round(50 * soc / 100)));   // 50 = full inner width
        fill.setAttribute('fill', telemLive ? col : '#9aa7ad');
    } else {
        cellEl.textContent = '—'; cellEl.style.color = '';
        packEl.textContent = '';
        fill.setAttribute('width', 0);
    }
    let rows = '';
    if (telemLive) {
        rows += 'Current: <b>' + (+fc.a).toFixed(1) + ' A</b> &nbsp;&middot;&nbsp; Used: <b>' + (fc.mah || 0) + ' mAh</b><br>';
        rows += 'Head speed: <b>' + (rf.head_speed || 0) + ' rpm</b> &nbsp;&middot;&nbsp; ESC: <b>'
              + (rf.esc_temp_c != null ? (+rf.esc_temp_c).toFixed(0) : '—') + ' &deg;C</b>';
        if (fc.flight_mode) rows += '<br>Mode: <b>' + fc.flight_mode.replace(/</g, '&lt;') + '</b>';
    }
    // The receiver's clock — proof at a glance that the time has arrived
    // (from the phone, or the transmitter's calibrated RTC on phone-free days).
    const inf = s.info || {};
    let clk;
    if (inf.epoch_s) {
        const srcTxt = inf.clock_src === 'tx' ? 'transmitter' : 'phone';
        clk = 'Receiver clock: <b>' + new Date(inf.epoch_s * 1000).toLocaleString([],
            { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
            + '</b> <span style="color:#5a6b74">(set by ' + srcTxt + ')</span>';
    } else {
        clk = 'Receiver clock: <b>not set</b> <span style="color:#5a6b74">— teaching it now&hellip;</span>';
        LDRC.teachTime();   // receiver rebooted under us — re-teach without a page reload
    }
    if (inf.tx_off_known) clk += '<br><span style="color:#5a6b74;font-size:.85em">TX clock calibrated: '
        + (inf.tx_off_s >= 0 ? '+' : '') + inf.tx_off_s + ' s vs UTC</span>';
    rows += (rows ? '<br>' : '') + clk;
    document.getElementById('stRows').innerHTML = rows;
    document.getElementById('stNote').textContent = telemLive
        ? '% is a resting-voltage estimate (reads low under load). Cell count auto-detected. Store at 3.80 V/cell (~40%).'
        : (vStale != null
            ? 'Model powered down — showing the last reading from this session. Store at 3.80 V/cell (~40%).'
            : 'No flight-controller telemetry — is the model powered and on CRSF?');
}

document.addEventListener('DOMContentLoaded', () => {
    refreshStatus();                       // LDRC (deferred app.js) is loaded by now
    setInterval(refreshStatus, 2000);
    // "Save session to phone" — only inside the app (the phone IS the store).
    const snap = document.getElementById('saveSnapBtn');
    if (LDRC.viaBle && snap) {
        // In "Review last session" the phone IS the data source — saving is
        // meaningless there, so the app answers phase:"replay" and we hide.
        fetch('/app/snapshot/progress', { cache: 'no-store' })
            .then(r => r.json())
            .then(p => { if (p.phase !== 'replay') snap.style.display = ''; })
            .catch(() => {});
        // Progress lives in its own SOLID panel with a bar — the button
        // itself never dims (a disabled button goes translucent = unreadable).
        const prog = document.getElementById('snapProg');
        const lab = document.getElementById('snapLab');
        const fill = document.getElementById('snapFill');
        let timer = null, saving = false;
        const warn = document.getElementById('snapWarn');
        function finish(msg, delayMs) {
            lab.textContent = msg;
            warn.style.display = 'none';
            setTimeout(() => { prog.style.display = 'none'; snap.style.display = '';
                               saving = false; }, delayMs);
        }
        snap.addEventListener('click', async () => {
            if (saving) return;
            saving = true;
            snap.style.display = 'none';
            prog.style.display = '';
            warn.style.display = '';
            lab.textContent = 'Saving session…';
            fill.style.width = '0%';
            try {
                const r = await (await fetch('/app/snapshot/start', { cache: 'no-store' })).json();
                if (!r.ok) throw new Error(r.error || 'not available now');
            } catch (e) {
                finish('⚠️ ' + e.message, 4000);
                return;
            }
            timer = setInterval(async () => {
                try {
                    const p = await (await fetch('/app/snapshot/progress', { cache: 'no-store' })).json();
                    if (p.phase === 'running') {
                        lab.textContent = 'Saving… ' + p.done + ' / ' + p.total;
                        if (p.total > 0) fill.style.width = Math.min(100, Math.round(100 * p.done / p.total)) + '%';
                    } else if (p.phase === 'done') {
                        clearInterval(timer);
                        fill.style.width = '100%';
                        finish('✅ All saved!  (' + p.done + ' items on the phone)', 6000);
                        // A completed backup signs off the tune generation —
                        // the proven-tune nudge goes away until settings change.
                        try {
                            const st = await LDRC.fetchState();
                            if (st && st.tune && st.tune.gen > 0)
                                localStorage.setItem('tuneNudge-' + ((st.info && st.info.name) || '') + '-' + st.tune.gen, '1');
                        } catch (e) {}
                    }
                } catch (e) { /* transient — keep polling */ }
            }, 700);
        });
    }
});
</script>
<template id=helpContent><h2>Receiver log</h2>
<p>This is the <b>receiver&rsquo;s own</b> record: the radio link, the battery, and what it saw on each flight. The flight controller keeps a separate one of its gyro and controls &mdash; that is the <a href="/rotorflight-blackbox">Black box (Flight recorder)</a>, under Rotorflight.</p>
<h3>On this page</h3>
<p><b>Status</b> shows live flight-controller telemetry whenever the model is powered — the transmitter does not need to be on. Per-cell voltage with a resting state-of-charge estimate, current, head speed and ESC temperature.</p>
<h3>Buttons</h3>
<ul>
<li><b>Flight analysis</b> &mdash; the telemetry graph (ESC temp, head speed, battery, current vs time) and the radio-link statistics for the current session and the last twenty saved flights.</li>
<li><b>Event log</b> &mdash; a one-line entry for every interesting moment since boot: WiFi up/down, bind, radio swaps, TX edits.</li>
<li><b>Save session to phone</b> (app only) &mdash; copies <b>everything</b> to your phone: all the Black box data (every saved flight and the event log) <b>and</b> every bank's Rotorflight settings. Afterwards the whole model can be reviewed offline ("Review" on the receiver list), and the settings can be restored from the Rotorflight page — the phone becomes a complete backup.</li>
</ul>
<h3>The receiver clock</h3>
<p>The status card shows the receiver's date and time and who taught it: your <b>phone</b> (whenever this app connects) or the <b>transmitter</b>'s built-in clock (on phone-free days). The transmitter's clock is calibrated against the phone automatically — the figure shown — and is itself corrected over the radio link, so all the clocks agree without you ever setting one.</p>
<h3>Tips</h3>
<p>Store your packs at about <b>3.80&thinsp;V/cell</b> (~40%) — the battery figure here is ideal for checking that before you put them away.</p>
</template>
</body>
</html>
