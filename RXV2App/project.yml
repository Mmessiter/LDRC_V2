# xcodegen spec for the RXV2 Bluetooth config app.
# Regenerate the Xcode project with:  xcodegen generate
name: RXV2App
options:
  bundleIdPrefix: com.messiter
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  RXV2App:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: webroot
        type: folder
        buildPhase: resources
      - path: demo
        type: folder
        buildPhase: resources
      - path: Assets.xcassets
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: LDRC backup file
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
              - public.plain-text
        CFBundleShortVersionString: "5.154"
        CFBundleVersion: "441"
        CFBundleDisplayName: RXV2
        UILaunchScreen: {}
        NSCameraUsageDescription: RXV2 uses the camera to take a photograph of your helicopter, shown beside its receiver.
        NSBluetoothAlwaysUsageDescription: >-
          RXV2 uses Bluetooth to find and configure your LockDown Radio
          Control receiver.
        # A firmware install over Bluetooth keeps going when the screen locks
        # or another app comes to the front (Malcolm 2026-09-18: "screen
        # timeout or checking emails etc during update" must not matter).
        UIBackgroundModes:
          - bluetooth-central
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.messiter.rxv2app
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ANLD6T79T5
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
