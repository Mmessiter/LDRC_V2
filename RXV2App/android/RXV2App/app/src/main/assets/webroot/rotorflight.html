<button class=helpBtn aria-label=Help title=Help onclick="LDRC.showHelp()">?</button>
<div class=bg-photo aria-hidden=true></div>
<div class=bg-wash  aria-hidden=true></div>
<div class=container>
    <h1>Rotorflight</h1>
    <p class=subtitle id=fcInfo>&hellip;</p>

    <div class="banner" style="background:#c8d2dc;color:#3a5165;padding:.7em;border-radius:10px;text-align:center;font-weight:600;margin:0 0 .8em">&#128161; Don&rsquo;t understand a term? If it&rsquo;s <span data-help="Exactly like this! Lift your finger and the explanation disappears.">underlined like this</span>, simply put your finger on it to see an explanation.</div>
    <a class="btn btn-fw" href="/rotorflight-wizards"  style="background:#4a8a5f"><span class=ico>&#129497;</span><span style="display:flex;flex-direction:column;align-items:flex-start;text-align:left"><span>Wizards</span><span style="font-size:.62em;font-weight:400;opacity:.85;margin-top:.25em">step-by-step: new helicopter &amp; tuning</span></span></a>
    <a class="btn btn-fw" href="/rotorflight-alacarte" style="background:#8e6cab"><span class=ico>&#127860;</span><span style="display:flex;flex-direction:column;align-items:flex-start;text-align:left"><span>&Agrave; la carte</span><span style="font-size:.62em;font-weight:400;opacity:.85;margin-top:.25em">straight to one setting</span></span></a>
    <a class="btn btn-fw" href="/rotorflight-backup"   style="background:#d4944a"><span class=ico>&#128190;</span><span style="display:flex;flex-direction:column;align-items:flex-start;text-align:left"><span>Backup &amp; restore</span><span style="font-size:.62em;font-weight:400;opacity:.85;margin-top:.25em">the whole setup, safe on the phone</span></span></a>

    <div class=footer></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    const s = await LDRC.fetchState();
    if (!s) return;
    const fc = s.fcinfo || {};
    const label = (fc.rf_major > 0)
        ? ('Rotorflight ' + fc.rf_major + '.' + fc.rf_minor + ' (BetaFlight ' + fc.fw_major + '.' + fc.fw_minor + '.' + fc.fw_patch + ' \u2022 API ' + fc.api_major + '.' + fc.api_minor + ')')
        : (fc.detected ? fc.variant : 'Flight controller connected (version pending)');
    LDRC.setText('fcInfo', label);
});
</script>
<template id=helpContent><h2>Rotorflight</h2>
<p>Three doors:</p>
<ul>
<li><b>Wizards</b> &mdash; step-by-step guides that take you through a whole job in order: building a new helicopter, or tuning one afterwards.</li>
<li><b>&Agrave; la carte</b> &mdash; straight to any single setting when you know what you want.</li>
<li><b>Backup &amp; restore</b> &mdash; the whole setup saved on the phone, restorable any time.</li>
</ul>
<h3>Why the swashplate may twitch</h3>
<p>Changing banks and saving make the flight controller pause its servo outputs for a few milliseconds &mdash; a brief, harmless jump, on the ground only (the official configurator does the same).</p>
<h3>Requirements</h3>
<p>Protocol set to <b>CRSF</b> and a Rotorflight flight controller connected.</p>
</template>
</body>
</html>
