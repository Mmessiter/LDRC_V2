<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name=theme-color content="#5fa099">
<meta name=apple-mobile-web-app-capable content=yes>
<meta name=apple-mobile-web-app-status-bar-style content=black-translucent>
<meta name=apple-mobile-web-app-title content="LDRC RX V2">
<title>Setup &middot; LDRC RX V2</title>
<link rel=stylesheet href="/style.css?v=322">
<script src="/app.js?v=322" defer></script>
<style>html.h-dongle #protobtn, html.h-dongle a[href="/rxsettings"], html.h-dongle #renamebtn,
html.h-simif #protobtn, html.h-simif a[href="/rxsettings"], html.h-simif #renamebtn { display: none !important; }</style>
<script>try{const h=JSON.parse(localStorage.getItem('frontHints')||'{}');if(h.dongle)document.documentElement.classList.add('h-dongle');if(h.simif)document.documentElement.classList.add('h-simif');}catch(e){}</script>
</head>
<body>
<button class=helpBtn aria-label=Help title=Help onclick="LDRC.showHelp()">?</button>
<div class=bg-photo aria-hidden=true></div>
<div class=bg-wash  aria-hidden=true></div>
<div class=container>
    <h1>Setup</h1>

    <a class="btn btn-diag" href="/protocol" id=protobtn><span class=ico>&#128225;</span>Output protocol &mdash; <span id=protoname>&hellip;</span></a>
    <a class="btn btn-diag" href="/diagnostics"><span class=ico>&#127916;</span>View channels</a>
    <a class="btn btn-diag" href="/rxsettings"><span class=ico>&#9881;&#65039;</span>Receiver settings &mdash; failsafe, battery, wave</a>
    <a class="btn btn-fw"   href="/wifi" id=wifibtn style="display:none"><span class=ico>&#128246;</span>WiFi settings</a>
    <a class="btn btn-fw"   href="/firmware"><span class=ico>&#128229;</span>Update or roll back firmware</a>
    <a class="btn btn-diag" href="/dongle" id=donglebtn style="display:none"><span class=ico>&#128268;</span>Dongle settings &mdash; role, name and serial speed</a>
    <button class="btn" type=button id=renamebtn style="background:#6f7e8b"><span class=ico>&#127991;&#65039;</span><span><span id=renamelbl>Rename receiver</span>&nbsp;&mdash;&nbsp;<span id=curname>&hellip;</span></span></button>

    <div class=footer></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    let s = null;
    for (let i = 0; i < 6 && !s; i++) { s = await LDRC.fetchState(); if (!s) await new Promise(r => setTimeout(r, 700)); }
    if (!s) return;
    document.documentElement.classList.toggle('h-dongle', !!s.dongle);   // the live answer wins (Malcolm 2026-09-10: "Setup page didn't hide it")
    document.documentElement.classList.toggle('h-simif', !!s.sim_if);   // a dongle in its simulator-interface role (0.9.762)
    const bare = !!(s.dongle || s.sim_if);   // a board with no transceivers, whichever role it is in

    // Output protocol — show what's selected right on the button.
    LDRC.setText('protoname', s.sim ? 'USB → SIM' : (s.protocol && s.protocol.current) || '…');

    // WiFi settings need an interface to SERVE this page from - in a browser.
    // In the app the page comes over Bluetooth, so the WiFi state is beside the
    // point, and hiding the button was a catch-22: the one moment you need it
    // is when WiFi is NOT up (wrong password, moved house, new router). Malcolm
    // 2026-09-18, on a dongle that could not join: "I wasn't able to inspect
    // the Wi-Fi settings because the button isn't there."
    const wifiVisible = LDRC.viaBle || (s.net && (s.net.mode === 'WiFi up' || s.net.mode === 'AP mode'));
    if (bare) for (const sel of ['#protobtn', 'a[href="/rxsettings"]']) { const el = document.querySelector(sel); if (el) el.style.display = 'none'; }   // receiver-only
    // Dongle settings exist on a board with no transceivers, in EITHER of its roles:
    // the simulator interface must be able to find its way back (0.9.762 - the
    // button keyed off s.dongle alone, which that role is not).
    const db = document.getElementById('donglebtn');
    if (db && bare) db.style.display = '';

    const wb = document.getElementById('wifibtn');
    if (wb) wb.style.display = wifiVisible ? '' : 'none';

    // Current name on the rename button.
    LDRC.setText('curname', (s.info && s.info.name) || 'RXV2');
    LDRC.setText('renamelbl', bare ? 'Rename dongle' : 'Rename receiver');   // Malcolm 2026-09-10

    // Rename — same prompt-based flow as tapping the front-screen title.
    const rb = document.getElementById('renamebtn');
    if (rb) rb.onclick = () => {
        const cur = (s.info && s.info.name_custom) ? s.info.name : '';
        const v = prompt((s.dongle ? 'Rename this dongle' : 'Rename this receiver') + ' (blank = revert to "RXV2"):', cur);
        if (v === null) return;
        const fd = new URLSearchParams();
        fd.set('name', v.trim());
        fetch('/api/name', { method: 'POST', body: fd })
          // A refusal (transmitter on, armed, bad name) is a sentence, not a page.
          .then(r => r.text().then(t => { if (!r.ok) { alert(t); return; }
                                          document.open(); document.write(t); document.close(); }))
          .catch(() => alert('Could not save — try again.'));
    };
});
</script>
<template id=helpContent><h2>Setup</h2>
<p>Everything you configure once and then rarely touch again lives here, so the front screen stays simple.</p>
<h3>Buttons</h3>
<ul>
<li><b>Output protocol</b> &mdash; what the receiver sends to your flight controller on D6 (CRSF for Rotorflight, SBUS, IBUS or PPM). The current choice is shown on the button.</li>
<li><b>View channels</b> &mdash; live channel bars and the 3-D model.</li>
<li><b>Receiver settings</b> &mdash; failsafe positions, the battery divider and the hello wave.</li>
<li><b>WiFi settings</b> &mdash; home network details and the &ldquo;AP mode only&rdquo; field setting.</li>
<li><b>Update firmware</b> &mdash; install newer firmware or roll back.</li>
<li><b>Dongle settings</b> &mdash; only on a board with no transceivers: its role (Rotorflight dongle or Simulator interface), the name the app shows, and the serial speed to the flight controller.</li>
<li><b>Rename receiver</b> &mdash; the name is also the WiFi network name and the <code>.local</code> address.</li>
</ul>
<h3>Tips</h3>
<p>A brand-new receiver only needs two visits here: check the protocol and add your WiFi (Bind now lives on the front menu). After that you may never need this page at the field.</p>
</template>
</body>
</html>
