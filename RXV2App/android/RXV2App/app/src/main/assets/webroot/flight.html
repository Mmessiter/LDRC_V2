<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name=theme-color content="#5fa099">
<meta name=apple-mobile-web-app-capable content=yes>
<meta name=apple-mobile-web-app-status-bar-style content=black-translucent>
<meta name=apple-mobile-web-app-title content="LDRC RX V2">
<title>Flight analysis &middot; LDRC RX V2</title>
<link rel=stylesheet href="/style.css?v=316">
<script src="/app.js?v=316" defer></script>
<style>
/* Landscape = reading mode (Malcolm 2026-07-31): the page widens and the
   graph grows to occupy most of the screen instead of a slim centre column. */
@media (orientation: landscape) {
    /* Side padding keeps the floating home/help buttons off the cards. */
    .container { max-width: 96vw; padding: 0 3.6em; }
}
</style>
</head>
<body>
<button class=helpBtn aria-label=Help title=Help onclick="LDRC.showHelp()">?</button>
<div class=bg-photo aria-hidden=true></div>
<div class=bg-wash  aria-hidden=true></div>
<div class=container>
    <h1>Flight analysis</h1>
    <p class=subtitle>Telemetry graph &amp; radio-link statistics, flight by flight</p>

    <div class=card>
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.4em .8em;margin-bottom:.5em">
            <h2 style="margin:0">Flight</h2>
            <select id=flSel style="padding:.32em .5em;font-size:.95em;border-radius:8px;border:1px solid #b8c7d0;background:#fff"></select>
        </div>
        <div id=lkRows class=muted style="font-size:.92em;line-height:1.9">&hellip;</div>
        <div id=lkHist style="margin-top:.5em"></div>
        <p id=lkNote class=muted style="font-size:.82em;margin-top:.4em"></p>
        <!-- Prune the diary (Malcolm 2026-08-01): brief boring tests can go.
             Two-tap confirm — dialogs are silent no-ops in the app WebView. -->
        <button id=delBtn style="display:none;margin-top:.6em;padding:.45em 1em;font-size:.9em;
                border-radius:8px;border:1px solid #c98a8a;background:#fff;color:#a4242a;cursor:pointer">
            🗑 Delete this flight</button>
    </div>

    <div class=card>
        <h2 style="margin-top:0">Flight graph</h2>
        <canvas id=flChart width=680 height=260 style="width:100%;height:auto;display:block"></canvas>
        <div id=flLegend style="font-size:.82em;margin-top:.45em"></div>
        <p id=flNote class=muted style="font-size:.82em;margin-top:.3em"></p>
    </div>

    <div class=footer></div>
</div>

<script>
function fmt(ms) {
    const s = Math.floor(ms / 1000);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const ss = s % 60;
    return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
}

// Link statistics for a chosen flight (from the flightlog's `link` object).
// savedAt (epoch seconds, from the phone's clock via /api/time) and fIdx let
// the card lead with WHEN the flight happened — the selector alone wasn't
// enough to place a flight in time.
function renderLink(lk, savedAt, fIdx) {
    const lkRows = document.getElementById('lkRows'), lkHist = document.getElementById('lkHist');
    if (!lk || !lk.packets) {
        lkRows.textContent = 'No flight recorded yet.'; lkHist.innerHTML = '';
        document.getElementById('lkNote').textContent = ''; return;
    }
    const dfmt = (ms) => new Date(ms).toLocaleString([],
        { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric',
          hour: '2-digit', minute: '2-digit' });
    let when = '';
    if (fIdx > 0) {
        when = savedAt
            ? 'Flown: <b>' + dfmt(savedAt * 1000) + '</b><br>'
            : 'Flown: <b>date unknown</b> <span class=muted>(saved before the receiver was told the time)</span><br>';
    } else if (savedAt) {
        // Live flight: savedAt is "now" by the receiver's clock (phone- or
        // transmitter-taught) — show when this session began.
        when = 'Started: <b>' + dfmt((savedAt - Math.floor(lk.conn_ms / 1000)) * 1000) + '</b><br>';
    }
    // Frame rate: prefer the MEASURED packet spacing (1000/expected_ms) —
    // it reads the true link rate (~500 Hz) even when Bluetooth desense ate
    // some packets; packets÷duration understates it (Malcolm: 'TX says over
    // 500, RX says 480'). Saved flights (no expected_ms) keep the average.
    const secs = lk.conn_ms / 1000;
    const fr = lk.expected_ms ? 1000 / lk.expected_ms : (secs > 0 ? lk.packets / secs : 0);
    const gapCol = lk.max_gap_ms > 100 ? '#c0392b' : lk.max_gap_ms > 30 ? '#c98a4a' : '#2e7d32';
    // Transceiver failover figures (FLT2 flights; absent on older saves)
    let rsw = '';
    if (lk.swaps !== undefined && lk.radio_ms) {
        rsw = '<br>Radio swaps: <b>' + lk.swaps.toLocaleString() + '</b>';
        for (let i = 0; i < 3; i++)
            if (lk.radio_ms[i] > 0)
                rsw += ' &nbsp;&middot;&nbsp; R' + (i + 1) + ': <b>' + fmt(lk.radio_ms[i]) + '</b>';
    }
    lkRows.innerHTML =
        when +
        'Duration: <b>' + fmt(lk.conn_ms) + '</b><br>' +
        'Avg frame rate: <b>' + fr.toFixed(0) + ' Hz</b> &nbsp;&middot;&nbsp; Packets: <b>' + lk.packets.toLocaleString() + '</b><br>' +
        // Gap figures are LATENESS: how much later than the measured packet
        // spacing (2 ms solo / 4 ms buddy-box, self-calibrated) — on-time
        // packets are not gaps at all, and lateness below the threshold is
        // ignored entirely (Malcolm 2026-07-27).
        'Avg lateness: <b>' + lk.avg_gap_ms.toFixed(2) + ' ms</b> &nbsp;&middot;&nbsp; Worst: <b style="color:' + gapCol + '">' + lk.max_gap_ms.toFixed(1) + ' ms late</b>' +
        // WHEN it struck (time into the flight) — a gap at 00:00:03 is the
        // connect ritual's tail; one mid-flight deserves attention.
        (lk.max_gap_at_ms > 0 ? ' <span class=muted>at ' + fmt(lk.max_gap_at_ms) + '</span>' : '') + rsw;
    const labels = ['&lt;8', '8-16', '16-32', '32-64', '64-150', '&ge;150'];
    const mx = Math.max(1, ...lk.hist);
    const spacing = lk.expected_ms ? ' &middot; spacing ' + lk.expected_ms.toFixed(1) + ' ms' : '';
    let h = '<div style="font-size:.8em;color:#5a6b74;margin-bottom:.2em">Late packets (ms late' + spacing + ')</div>';
    for (let i = 0; i < 6; i++) {
        const w = Math.round(100 * lk.hist[i] / mx);
        h += '<div style="display:flex;align-items:center;gap:.4em;margin:1px 0">' +
             '<span style="width:3em;text-align:right;font-size:.78em;color:#5a6b74">' + labels[i] + '</span>' +
             '<span style="flex:1;background:#e3e9ec;border-radius:3px;overflow:hidden;height:12px"><span style="display:block;height:100%;width:' + w + '%;background:' + (i >= 3 ? '#c98a4a' : '#5fa099') + '"></span></span>' +
             '<span style="width:4.5em;font-size:.78em;color:#5a6b74;text-align:right">' + lk.hist[i].toLocaleString() + '</span></div>';
    }
    // Friendly explanation (Malcolm 2026-08-02): tuning sessions produce
    // bigger gaps because the TRANSMITTER pauses briefly for each parameter
    // read/save — honest numbers, but alarming without context.
    // Wording: param_ops counts READS as well as writes — merely opening a
    // Rotorflight screen on the TX fires a read, so "were edited" claimed
    // edits the user never made (Malcolm 2026-08-14, Black Thunder II's
    // first flights: "I made no Rotorflight edits").
    if (lk.param_ops > 0) {
        h += '<div style="margin-top:.5em;padding:.55em .8em;border-radius:8px;background:#ffdf9e;' +
             'color:#5c3a00;font-size:.85em;line-height:1.45">&#128295; Rotorflight screens were viewed (or ' +
             'settings edited) from the transmitter during this session — each read or save briefly pauses its ' +
             'transmission, so larger gaps and radio swaps here are expected, not a link problem.</div>';
    }
    lkHist.innerHTML = h;
    const note = document.getElementById('lkNote');
    if (lk.gap_min_ms !== undefined) {
        note.innerHTML = 'Only packets at least <input id=gapMinIn type=number min=1 max=100 value="'
            + lk.gap_min_ms + '" style="width:3.2em;font-size:1em;text-align:center"> ms late are counted '
            + '<button onclick=setGapMin() style="font-size:.9em;padding:.1em .6em;border-radius:6px;border:1px solid #b8c7d0;background:#fff">Set</button>';
    } else note.textContent = '';
}

async function setGapMin() {
    const v = document.getElementById('gapMinIn').value;
    try {
        await fetch('/api/gapmin', { method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'ms=' + encodeURIComponent(v) });
    } catch (e) {}
    loadFlight();
}

// Rotating the phone re-lays-out the graph (landscape = big reading mode).
addEventListener('resize', () => { if (drawFlight.last) drawFlight(drawFlight.last); });

// Tell the receiver the time (it has no clock) so flights get real dates —
// including any saved before this page opened (stamped retroactively).
// (time-teaching runs from app.js on every page — a top-level LDRC call
// here ran BEFORE deferred app.js defined LDRC and killed this whole script)

// Populate the flight selector (Current + saved flights) from /api/flights.json.
async function populateFlightSelector() {
    let list;
    try { list = await (await fetch('/api/flights.json', { cache: 'no-store' })).json(); } catch (e) { return; }
    const sel = document.getElementById('flSel');
    if (!sel) return;
    const cur = sel.value;
    let html = '';
    for (const fl of list) {
        let label;
        // Saved flights carry a wall-clock stamp (from the phone's clock via
        // /api/time) — show the real date; fall back to relative names.
        const ds = fl.saved_at ? new Date(fl.saved_at * 1000).toLocaleString([],
            { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : null;
        if (fl.i === 0) label = 'Current' + (fl.saving ? ' — saving the last flight, a moment…'
                                            : fl.count > 1 ? ' (' + fmt(fl.dur_ms) + ')' : ' — none yet');
        else label = (ds || (fl.i === 1 ? 'Previous' : fl.i + ' flights ago')) + ' (' + fmt(fl.dur_ms) + ')';
        html += '<option value="' + fl.i + '" data-phys="' + (fl.phys !== undefined ? fl.phys : '') + '">' + label + '</option>';
    }
    sel.innerHTML = html;
    if (cur && sel.querySelector('option[value="' + cur + '"]')) sel.value = cur;
}

// Fetch the selected flight and update the link stats + graph.
async function loadFlight() {
    const sel = document.getElementById('flSel');
    const f = sel ? (+sel.value || 0) : 0;
    paintDelBtn(f);
    let d;
    try { d = await (await fetch('/api/flightlog.json?f=' + f, { cache: 'no-store' })).json(); } catch (e) { return; }
    renderLink(d.link, d.saved_at, f);
    drawFlight(d);
}

// Delete button: only for SAVED flights (never Current). First tap arms it
// (red, 3 s window), second tap deletes and returns to Current.
function paintDelBtn(f) {
    const b = document.getElementById('delBtn');
    if (!b) return;
    b.style.display = f > 0 ? '' : 'none';
    b.textContent = '🗑 Delete this flight';
    b.style.background = '#fff'; b.style.color = '#a4242a';
    b.dataset.armed = '';
}
document.getElementById('delBtn').addEventListener('click', async function () {
    const sel = document.getElementById('flSel');
    const f = sel ? (+sel.value || 0) : 0;
    if (!f) return;
    if (!this.dataset.armed) {
        this.dataset.armed = '1';
        this.textContent = '⚠️ Tap again to delete — cannot be undone';
        this.style.background = '#c0392b'; this.style.color = '#fff';
        setTimeout(() => paintDelBtn((+sel.value || 0)), 3000);
        return;
    }
    try {
        // Delete by the STABLE physical slot when known: quick successive
        // deletions shift the logical numbering under the page (the
        // "reluctant" flight, 2026-08-04); the phys slot never moves.
        const opt = sel && sel.selectedOptions[0];
        const phys = opt ? opt.dataset.phys : undefined;
        await fetch('/api/flight/delete', { method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: (phys !== undefined && phys !== '') ? ('phys=' + phys) : ('i=' + f) });
    } catch (e) {}
    await populateFlightSelector();
    if (sel) sel.value = '0';
    loadFlight();
});

// --- Flight graph: multiple traces vs time, each auto-scaled to its own range ---
function drawFlight(d) {
    const cv = document.getElementById('flChart');
    if (!cv) return;
    drawFlight.last = d;   // redrawn on rotate/resize
    // Size the canvas to its real on-screen box (landscape: ~2/3 of the
    // screen height), with a devicePixelRatio-scaled backing store so the
    // lines stay crisp. All drawing below is in CSS-pixel coordinates.
    const land = matchMedia('(orientation: landscape)').matches;
    const cssW = cv.parentElement.clientWidth;
    const cssH = land ? Math.max(220, Math.round(window.innerHeight * 0.62))
                      : Math.round(cssW * 0.38);
    cv.style.height = cssH + 'px';
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (cv.width !== Math.round(cssW * dpr) || cv.height !== Math.round(cssH * dpr)) {
        cv.width  = Math.round(cssW * dpr);
        cv.height = Math.round(cssH * dpr);
    }
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const W = cssW, H = cssH;
    ctx.clearRect(0, 0, W, H);
    const n = d.count || 0;
    const note = document.getElementById('flNote'), leg = document.getElementById('flLegend');
    if (n < 2) {
        note.textContent = 'No flight logged yet — the graph fills in during a flight (one point per second).';
        leg.innerHTML = '';
        return;
    }
    const iv = d.interval_s || 1;
    const pad = { l: 8, r: 8, t: 10, b: 20 };
    const gx = W - pad.l - pad.r, gy = H - pad.t - pad.b;
    ctx.strokeStyle = '#cdd7dc'; ctx.lineWidth = 1; ctx.strokeRect(pad.l, pad.t, gx, gy);
    const xat = i => pad.l + gx * i / (n - 1);
    // Scale indication (Malcolm 2026-07-31): dotted gridlines at quarter
    // heights (each line auto-scales, so a gridline = ¼ of THAT line's own
    // min–max range from the key), plus a dotted line + label every minute.
    ctx.save();
    ctx.strokeStyle = 'rgba(90,107,116,.22)'; ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
    for (const f of [0.25, 0.5, 0.75]) {
        const y = pad.t + gy * f;
        ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(pad.l + gx, y); ctx.stroke();
    }
    const totalS = n * iv;
    ctx.fillStyle = '#8199a8'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
    for (let s = 60; s < totalS - 30; s += 60) {
        const x = pad.l + gx * (s / totalS);
        ctx.beginPath(); ctx.moveTo(x, pad.t); ctx.lineTo(x, pad.t + gy); ctx.stroke();
        if (totalS < 1500 || (s % 300) === 0)   // label each minute; every 5 on long flights
            ctx.fillText((s / 60) + 'm', x, H - 5);
    }
    ctx.restore();
    // minSpan: the smallest y-range a trace is drawn against, so sensor noise
    // isn't magnified into mountains (a plane's battery idling within ±50 mV
    // used to fill the whole graph height with jitter).
    // eps: sensor jitter to IGNORE when de-staircasing (Malcolm 2026-08-04:
    // a governed head speed is truly steady — ±a few rpm of sensor noise
    // must not draw as continuous change on a short flight). Samples within
    // eps of a run's start belong to the run; the run plots at its mean.
    // q: one sensor quantisation step. Jumps of ~one q between runs are the
    // units' fault → drawn as a slope through run centres. Jumps far bigger
    // than q are REAL events (motor on/off, battery plugged) → the flat is
    // pinned to its full length and the change drawn steeply where it
    // happened (Malcolm 2026-08-04: 'vertical and horizontal, not 45°').
    const traces = [
        { key: 'esc',  label: 'ESC temp',   unit: '°C',  col: '#c0392b', dp: 0, minSpan: 10,  eps: 0,    q: 1    },
        { key: 'head', label: 'Head speed', unit: 'rpm', col: '#2b6cb0', dp: 0, minSpan: 100, eps: 5,    q: 5    },
        { key: 'v',    label: 'Battery',    unit: 'V',   col: '#2e8b57', dp: 2, minSpan: 0.8, eps: 0.02, q: 0.02 },
        { key: 'amps', label: 'Current',    unit: 'A',   col: '#e08a1e', dp: 1, minSpan: 2,   eps: 0.2,  q: 0.2  },
    ];
    let legHtml = '';
    let anyDrawn = false;
    const drawn = [];   // per-trace scale info for the Y gridline numbers
    for (const t of traces) {
        const a = d[t.key];
        if (!a || a.length < 2) continue;
        const lo = Math.min.apply(null, a), hi = Math.max.apply(null, a);
        // All-zero series = the sensor doesn't exist on this model (a plane
        // with plain servos has no ESC temp / head speed / current). Grey it
        // out in the key and draw nothing — no misleading flat lines.
        if (lo === 0 && hi === 0) {
            legHtml += '<span style="white-space:nowrap;display:inline-block;margin:0 1em .2em 0;color:#a9b7bf">'
                     + '<span style="font-weight:700">■</span> ' + t.label + ' — no sensor</span>';
            continue;
        }
        anyDrawn = true;
        let m = (hi - lo) * 0.08 || 1;                   // small margin (or 1 if flat)
        let ymin = lo - m, range = (hi - lo + 2 * m) || 1;
        if (t.minSpan && range < t.minSpan) {            // pad tiny ranges: noise stays calm
            const mid = (hi + lo) / 2;
            ymin = mid - t.minSpan / 2; range = t.minSpan;
        }
        drawn.push({ t, ymin, range });
        // De-staircase (Malcolm 2026-08-04): sensors report in discrete
        // units, so a slowly-climbing value sits flat then jumps — but the
        // REAL quantity moved along a slope. Collapse each run of equal
        // samples to one node at the run's centre, keep the true endpoints,
        // and draw a gently smoothed line through the nodes. Fast-moving
        // series (every sample different) reduce to the original points.
        const eps = t.eps || 0;
        const big = 2.5 * Math.max(t.q || 1, eps);   // bigger than this = real event
        const runs = [];
        let s0 = 0, sum = a[0];
        for (let i = 1; i <= n; i++) {
            if (i === n || Math.abs(a[i] - a[s0]) > eps) {
                runs.push({ s: s0, e: i - 1, m: sum / (i - s0) });
                s0 = i;
                sum = i < n ? a[i] : 0;
            } else {
                sum += a[i];
            }
        }
        const nodes = [];
        for (let i = 0; i < runs.length; i++) {
            const r = runs[i];
            const pj = i > 0 ? Math.abs(r.m - runs[i - 1].m) : 0;
            const nj = i < runs.length - 1 ? Math.abs(runs[i + 1].m - r.m) : 0;
            const pts = [];
            if (pj > big) pts.push([r.s, r.m]);          // real event before: pin flat start
            pts.push([(r.s + r.e) / 2, r.m]);            // quantisation: slope via centre
            if (nj > big) pts.push([r.e, r.m]);          // real event after: pin flat end
            for (const p of pts)
                if (!nodes.length || p[0] > nodes[nodes.length - 1][0]) nodes.push(p);
        }
        if (nodes[0][0] > 0) nodes.unshift([0, a[0]]);
        if (nodes[nodes.length - 1][0] < n - 1) nodes.push([n - 1, a[n - 1]]);
        const P = nodes.map(nd => [xat(nd[0]), pad.t + gy * (1 - (nd[1] - ymin) / range)]);
        // STRAIGHT slopes between nodes, corners gently rounded over a few
        // pixels only (Malcolm 2026-08-04: full-span curve smoothing made
        // sparse data swoop like sine waves — 'still rather curved').
        ctx.strokeStyle = t.col; ctx.lineWidth = 1.8; ctx.beginPath();
        ctx.moveTo(P[0][0], P[0][1]);
        const R = 7;   // corner radius in px
        for (let i = 1; i < P.length - 1; i++) {
            const a2 = P[i - 1], b2 = P[i], c2 = P[i + 1];
            const d1 = Math.hypot(b2[0] - a2[0], b2[1] - a2[1]) || 1;
            const d2 = Math.hypot(c2[0] - b2[0], c2[1] - b2[1]) || 1;
            const r1 = Math.min(R, d1 / 2), r2 = Math.min(R, d2 / 2);
            ctx.lineTo(b2[0] - (b2[0] - a2[0]) * r1 / d1, b2[1] - (b2[1] - a2[1]) * r1 / d1);
            ctx.quadraticCurveTo(b2[0], b2[1],
                                 b2[0] + (c2[0] - b2[0]) * r2 / d2, b2[1] + (c2[1] - b2[1]) * r2 / d2);
        }
        ctx.lineTo(P[P.length - 1][0], P[P.length - 1][1]);
        ctx.stroke();
        legHtml += '<span style="white-space:nowrap;display:inline-block;margin:0 1em .2em 0">'
                 + '<span style="color:' + t.col + ';font-weight:700">■</span> '
                 + t.label + ' <b>' + a[n-1].toFixed(t.dp) + ' ' + t.unit + '</b>'
                 + ' <span style="color:#8199a8">(' + lo.toFixed(t.dp) + '–' + hi.toFixed(t.dp) + ')</span></span>';
    }
    // Y scale (Malcolm 2026-07-31): each trace has its OWN scale, so each
    // gridline is labelled with every trace's value AT that height, in the
    // trace's colour — read the number that matches the line's colour.
    // Landscape only: there's room there, and portrait stays uncluttered.
    if (land && drawn.length) {
        ctx.font = '10px sans-serif'; ctx.textAlign = 'left';
        for (const f of [0, 0.25, 0.5, 0.75, 1]) {
            const y  = pad.t + gy * f;
            const ty = f === 0 ? y + 12 : y - 4;
            let x = pad.l + 5;
            for (const s of drawn) {
                const txt = (s.ymin + s.range * (1 - f)).toFixed(s.t.dp);
                ctx.fillStyle = s.t.col;
                ctx.fillText(txt, x, ty);
                x += ctx.measureText(txt).width + 12;
            }
        }
    }
    ctx.fillStyle = '#5a6b74'; ctx.font = '11px sans-serif';
    ctx.textAlign = 'left';  ctx.fillText('0:00', pad.l, H - 5);
    ctx.textAlign = 'right'; ctx.fillText(fmt(n * iv * 1000), pad.l + gx, H - 5);
    leg.innerHTML = legHtml;
    note.textContent = anyDrawn
        ? 'Each line auto-scaled to its own range (min–max in the key).'
        : 'No telemetry sensors on this model — link statistics above are still recorded for every flight.';
}

document.addEventListener('DOMContentLoaded', async () => {
    await populateFlightSelector();
    const sel = document.getElementById('flSel');
    if (sel) sel.addEventListener('change', loadFlight);
    loadFlight();
    // Refresh the selector (a new flight may have saved) and, only when viewing
    // the CURRENT flight, redraw it live.
    setInterval(async () => {
        await populateFlightSelector();
        if (sel && (+sel.value || 0) === 0) loadFlight();
    }, 5000);
});
</script>
<template id=helpContent><h2>Flight analysis</h2>
<p>Everything the receiver recorded about a flight, for the current session and the last twenty saved flights.</p>
<h3>How to use it</h3>
<p>Pick a flight with the selector at the top. <b>Current</b> is live (it redraws during a flight); saved flights are kept in flash, so they survive reboots and battery swaps — compare today with yesterday. Each saved flight shows the <b>date and time it was flown</b>, learned from your phone's clock or from the transmitter's (so phone-free field days are dated too); flights saved before the receiver ever knew the time say "date unknown". A short armed hop still saves (30 seconds armed counts); a wiggle-check with nothing armed does not, and the <b>Delete</b> button (tap twice) prunes any saved flight you don't want. Turn the phone sideways for a much larger graph.</p>
<h3>What you're seeing</h3>
<ul>
<li><b>Link statistics</b> &mdash; duration, average frame rate, average and longest gap between packets, and the gap-size distribution. A longest gap under ~30&thinsp;ms is excellent.</li>
<li><b>Flight graph</b> &mdash; ESC temperature, head speed, battery voltage and current, one point per second. Each trace is auto-scaled to its own range (shown in the key) so their shapes can be compared.</li>
</ul>
<h3>Tips</h3>
<p>Watch ESC temperature track head speed and current, and the battery sag under load. A brief signal dropout shows up honestly as the longest gap — the recording carries straight on through it.</p>
<p><b>Why current seems to lag head speed:</b> on a spool-up the graph often shows head speed rising before current — in reality the current rises first (torque before acceleration). The ESC smooths its current reading internally and reports it more slowly than RPM, so the current trace arrives a second or two late. It's the reporting that lags, not the motor.</p>
