<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name=theme-color content="#5fa099">
<meta name=apple-mobile-web-app-capable content=yes>
<meta name=apple-mobile-web-app-status-bar-style content=black-translucent>
<meta name=apple-mobile-web-app-title content="LDRC RX V2">
<title>Tuning &middot; LDRC RX V2</title>
<link rel=stylesheet href="/style.css?v=280">
<script src="/app.js?v=280" defer></script>
<style>
.banner{padding:.7em;border-radius:10px;text-align:center;font-weight:600;margin:0 0 1em}
.banner.warn{background:#e8cf8f;color:#5c4a1a}
.step{display:grid;grid-template-columns:auto 1fr auto;gap:.6em .8em;align-items:center;
      background:#e7edf2;border-radius:12px;padding:.7em .8em;margin:.5em 0}
.step.done{background:#d7e8cf}
.step .num{font-size:1.25em;font-weight:800;color:#5d7a8c;min-width:1.3em;text-align:center}
.step.done .num{color:#4a7d38}
.step .tit b{display:block;font-size:1.02em;color:#2e4356}
.step .tit span{font-size:.8em;color:#5d7a8c;line-height:1.35;display:block}
.step a.go{background:#5fa099;color:#fff;border-radius:9px;padding:.55em .9em;font-weight:700;
           text-decoration:none;white-space:nowrap;font-size:.95em}
.step .tick{grid-column:1;justify-self:center}
.step input[type=checkbox]{width:1.5em;height:1.5em}
.prog{font-weight:700;text-align:center;margin:.4em 0;color:#2e4356}
.resetBtn{width:100%;margin-top:.8em;padding:.6em;border:0;border-radius:10px;background:#b06a6a;color:#fff;font-weight:700;cursor:pointer}
</style>
</head>
<body class=hasFab>
<button class=helpBtn aria-label=Help title=Help onclick="LDRC.showHelp()">?</button>
<div class=bg-photo aria-hidden=true></div>
<div class=bg-wash  aria-hidden=true></div>
<div class=container>
    <h1>Tuning</h1>
    <div class="banner warn">&#128336; One thing at a time: change <b>one</b> value, fly, judge, repeat. Land before every edit.</div>
    <p class=muted style="font-size:.9em;line-height:1.5;margin:.2em 0 .6em">After the build: make it fly beautifully, in the right order. One change per flight.</p>
    <div class=prog id=modelName style="color:#4a7a5f"></div>
    <div class=prog id=prog></div>
    <div id=steps></div>
    <button class=resetBtn onclick="resetAll()">Start over (clear all ticks)</button>
    <div class=footer></div>
</div>

<script>
const STEPS=[
 {k:'backup0',t:'Back up first', d:'One tap — today’s working setup stays safe.', href:'/rotorflight-backup'},
 {k:'hover',  t:'First hovers', d:'Hover at eye height. Shakes or twitches = mechanics, not tuning.'},
 {k:'gov',    t:'Governor', d:'Steady head speed, no sag on hard pulls (raise gain/precomp gently).', href:'/rotorflight-gov-profile'},
 {k:'tail',   t:'Tail', d:'Raise response until it wiggles, back off a touch. Pulls kicking the tail = precomp.', href:'/rotorflight-pid'},
 {k:'cyclic', t:'Cyclic', d:'Raise until a fast stop just wobbles, back off. Drift = more hold (I).', href:'/rotorflight-pid'},
 {k:'feel',   t:'Feel — rates & expo', d:'Roll rate and stick softness. Pure taste.', href:'/rotorflight-rates'},
 {k:'fine',   t:'Fine touches', d:'Only if something still niggles.', href:'/rotorflight-pidplus'},
 {k:'rescue', t:'Prove Rescue', d:'Three mistakes high: flick it upright AND inverted.', href:'/rotorflight-rescue'},
 {k:'backup1',t:'Back up the tune', d:'Save the tune you now trust.', href:'/rotorflight-backup'},
];
const $=id=>document.getElementById(id);
// Per-model ticks, same scheme as the New-helicopter checklist.
let KEY='rfTuning.';
async function bindModel(){
    try{
        if (window.LDRC && LDRC.replayReady) await LDRC.replayReady;
        const st=await (await fetch('/api/state.json',{cache:'no-store'})).json();
        const n=(st.info&&st.info.name)||'';
        if(n){ KEY='rfTuning.'+n+'.'; $('modelName').textContent='Tuning: '+n; }
    }catch(e){}
    paint();
}
function paint(){
    const host=$('steps'); host.innerHTML='';
    let done=0;
    STEPS.forEach((s,i)=>{
        const isDone=localStorage.getItem(KEY+s.k)==='1'; if(isDone)done++;
        const div=document.createElement('div');
        div.className='step'+(isDone?' done':'');
        div.innerHTML='<div class=num>'+(isDone?'✓':(i+1))+'</div>'
            +'<div class=tit><b>'+s.t+'</b><span>'+s.d+'</span></div>'
            +(s.href?'<a class=go href="'+s.href+'">Open</a>':'<div></div>')
            +'<div class=tick><input type=checkbox '+(isDone?'checked':'')+' aria-label="done"></div><div></div><div></div>';
        div.querySelector('input').addEventListener('change',ev=>{
            localStorage.setItem(KEY+s.k, ev.target.checked?'1':'0'); paint();
        });
        host.appendChild(div);
    });
    $('prog').textContent = done===STEPS.length
        ? '🏆 Tuned, proven and backed up — go enjoy it!'
        : done+' of '+STEPS.length+' steps done';
}
async function resetAll(){
    if(!(await LDRC.confirm('Clear all the ticks and start tuning again?',
        {title:'Start over',icon:'🔄',yes:'Clear ticks',kind:'warn'})))return;
    STEPS.forEach(s=>localStorage.removeItem(KEY+s.k)); paint();
}
paint();
bindModel();
</script>
<template id=helpContent><h2>Tuning</h2>
<p>The after-the-build checklist: from &ldquo;it flies&rdquo; to &ldquo;it flies beautifully&rdquo;, in the order that works.</p>
<ul>
<li><b>Why this order?</b> Each step assumes the one before it: gains are meaningless on a shaking airframe, cyclic feel is judged against a steady head speed, and rates are set last because they are pure taste.</li>
<li><b>One change per flight.</b> Change one value, fly, judge. Two changes at once and you won&rsquo;t know which one did it.</li>
<li><b>Back up first and last.</b> The first backup protects the working setup; the last one banks the tune you proved.</li>
<li>Ticks are remembered per model, so each helicopter in the fleet has its own tuning card.</li>
</ul>
</template>
</body>
</html>
