<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name=theme-color content="#5fa099">
<meta name=apple-mobile-web-app-capable content=yes>
<meta name=apple-mobile-web-app-status-bar-style content=black-translucent>
<meta name=apple-mobile-web-app-title content="LDRC RX V2">
<title>RealFlight controls &middot; LDRC RX V2</title>
<link rel=stylesheet href="/style.css?v=185">
<script src="/app.js?v=215" defer></script>
<style>
/* One tall column of equal, big, can't-miss targets, filling the screen. */
.pad{display:flex;flex-direction:column;gap:9px;
 min-height:calc(100vh - 104px);min-height:calc(100dvh - 104px)}
.simBtn{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.05em;
 border:0;border-radius:16px;cursor:pointer;color:#fff;font:inherit;text-align:center;min-height:56px;
 text-decoration:none;box-shadow:0 1px 4px rgba(0,0,0,.22);
 transition:transform .05s,filter .12s,box-shadow .12s;
 user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.simBtn:active{transform:scale(.985)}
.simBtn .lbl{font-weight:800;font-size:1.7em;line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.28)}
.simBtn .sub{font-size:.74em;opacity:.82;font-variant-numeric:tabular-nums}
/* pressed (a TX switch on its channel, or a tap/hold) — a glow that reads on any colour */
.simBtn.lit{filter:brightness(1.13);box-shadow:0 0 0 4px rgba(255,255,255,.7),0 1px 8px rgba(0,0,0,.3)}
.sel{background:#36a85a}              /* Select — green */
.ud{touch-action:none}               /* Up / Down share the press-and-hold auto-repeat */
.up{background:#6cabdf}              /* Up — pale blue */
.down{background:#2b568f}            /* Down — dark blue */
.can{background:#df8a36}             /* Cancel — amber */
.reset{background:#d6403c}           /* Reset — red */
.menu{background:#6f7e8b;flex:0 0 auto;min-height:50px}   /* Return to menu — normal height, not stretched */
.menu .lbl{font-size:1.05em;text-shadow:none}
.pageTitle{text-align:center;font-size:1.3em;font-weight:700;margin:.25em 0 .35em}
.offNote{text-align:center;color:#9a5;font-weight:600;margin:.1em 0 .5em;display:none}
</style>
</head>
<body>
<button class=helpBtn aria-label=Help title=Help onclick="LDRC.showHelp()">?</button>
<div class=bg-photo aria-hidden=true></div>
<div class=bg-wash  aria-hidden=true></div>
<div class=container>
    <h1>RealFlight controls</h1>
    <div id=offNote class=offNote>Simulator mode is OFF &mdash; turn it on from the home screen for these to work.</div>

    <div class=pad>
        <button class="simBtn sel" id=b6 data-n=6>
            <span class=lbl>Select</span><span class=sub>ch 14 &middot; <span id=cv6>&middot;</span></span></button>
        <button class="simBtn ud up" id=b4 data-n=4>
            <span class=lbl>&#9650; Up</span><span class=sub>ch 12 &middot; <span id=cv4>&middot;</span></span></button>
        <button class="simBtn ud down" id=b5 data-n=5>
            <span class=lbl>&#9660; Down</span><span class=sub>ch 13 &middot; <span id=cv5>&middot;</span></span></button>
        <button class="simBtn can" id=b3 data-n=3>
            <span class=lbl>Cancel</span><span class=sub>ch 11 &middot; <span id=cv3>&middot;</span></span></button>
        <button class="simBtn reset" id=b2 data-n=2>
            <span class=lbl>Reset</span><span class=sub>ch 10 &middot; <span id=cv2>&middot;</span></span></button>
    </div>

    <div class=footer></div>
</div>

<script>
const $ = id => document.getElementById(id);
const BTNS = [2, 3, 4, 5, 6];               // button numbers in use; ch = n + 8, lit/ch index = n - 1 (Reset moved to btn6/ch14)

// Momentary press: the firmware holds it ~150 ms (BTN_PULSE_MS), so a tap is a
// clean single press in the sim.
function fire(n, el) { if (el) el.classList.add('lit'); fetch('/api/sim/button?n=' + n, { method: 'POST', cache: 'no-store' }).catch(() => {}); }

// Up/Down auto-repeat: holding keeps the press alive (re-pulse faster than it
// expires); the firmware turns a sustained hold into repeated presses. Releasing
// stops the re-pulse and the press lapses server-side, so there's no stuck key.
function holdStart(n, el) { el.classList.add('holding', 'lit'); fire(n); el._t = setInterval(() => fire(n), 120); }
function holdStop(el) { if (el && el._t) { clearInterval(el._t); el._t = null; } if (el) el.classList.remove('holding'); }

async function poll() {
    if (window.LDRC && LDRC.navigating) return;
    // Be kind to the radio: each request briefly occupies the receiver's single-
    // threaded loop, so don't poll when the page is hidden, and poll gently (~3 Hz)
    // when visible. The buttons themselves still fire instantly on tap/hold.
    if (document.hidden) { setTimeout(poll, 700); return; }
    try {
        const d = await (await fetch('/api/sim/buttons.json', { cache: 'no-store' })).json();
        for (const n of BTNS) {
            const el = $('b' + n);
            if (Array.isArray(d.btn) && el && !el.classList.contains('holding')) el.classList.toggle('lit', !!d.btn[n - 1]);
            if (Array.isArray(d.ch) && $('cv' + n)) $('cv' + n).textContent = d.ch[n - 1] + 'µs';
        }
    } catch (e) { /* transient */ }
    setTimeout(poll, 300);          // ~3 Hz — light touch so it never starves the radio link
}

document.addEventListener('DOMContentLoaded', async () => {
    document.querySelectorAll('.simBtn').forEach(b => {
        const n = +b.dataset.n;
        if (!n) return;                                   // the "Return to menu" link just navigates
        if (b.classList.contains('ud')) {                 // Up / Down — press & hold to auto-repeat
            b.addEventListener('pointerdown', e => { e.preventDefault(); holdStart(n, b); });
            ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => holdStop(b)));
        } else {                                          // Select / Cancel / Reset — single tap
            // Fire 3× over ~180 ms: each is a separate POST, so a tap survives an
            // occasional dropped request over the (distant, low-power) WiFi. The
            // firmware OR's them into one ~250 ms press, so the sim still sees ONE
            // clean Reset — never a triple-fire.
            b.addEventListener('click', () => { fire(n, b); setTimeout(() => fire(n), 90); setTimeout(() => fire(n), 180); });
        }
    });
    // Gentle nudge if sim mode is off (the buttons still pulse, but nothing's listening).
    try { const s = await LDRC.fetchState(); if (s && !s.sim) $('offNote').style.display = ''; } catch (e) {}
    setTimeout(poll, 120);
});
</script>
<template id=helpContent><h2>RealFlight controls</h2>
<p>Five big buttons for RealFlight&rsquo;s <b>User Interface</b> functions &mdash; <b>Select, Up, Down,
Cancel, Reset</b> &mdash; so you can recover crashes and drive the sim&rsquo;s menus from your
transmitter, without touching the keyboard. Reset sits at the bottom, like the spacebar.</p>
<h3>Two ways to fire each one</h3>
<ul>
<li><b>Tap it here</b> on your phone &mdash; or <b>hold Up / Down</b> to auto-repeat through a menu.</li>
<li><b>Flip a switch on your transmitter</b>: ch&nbsp;10&rarr;Reset, ch&nbsp;11&rarr;Cancel, ch&nbsp;12&rarr;Up, ch&nbsp;13&rarr;Down, ch&nbsp;14&rarr;Select (ch&nbsp;9 is left free for RealFlight&rsquo;s autorotation). A button lights while its switch is up or you tap it (Up/Down repeat while held).</li>
</ul>
<h3>Setting it up (once)</h3>
<p>In RealFlight&rsquo;s <b>Edit Profile &rarr; User Interface</b>, click the <b>Input</b> box beside a
function (e.g. Reset) and <b>activate the control</b> &mdash; flip its TX switch or tap it here. RealFlight
captures it as the matching <b>Button</b>, then <b>Save</b>. (Same idea in neXt.)</p>
</template>
</body>
</html>
