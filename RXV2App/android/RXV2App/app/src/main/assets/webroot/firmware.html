<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name=theme-color content="#5fa099">
<meta name=apple-mobile-web-app-capable content=yes>
<meta name=apple-mobile-web-app-status-bar-style content=black-translucent>
<meta name=apple-mobile-web-app-title content="LDRC RX V2">
<title>Check for Update &middot; LDRC RX V2</title>
<link rel=stylesheet href="/style.css?v=345">
<script src="/app.js?v=345" defer></script>
<style>
/* --- Currently-installed card -------------------------------------- */
.installed-card .row{
    display:flex;justify-content:space-between;align-items:center;
    padding:.55em 0;
}
.installed-card .row + .row{border-top:1px solid rgba(125,158,176,.18)}
.installed-card .label{
    font-size:.74em;letter-spacing:.18em;text-transform:uppercase;
    color:#5d7a8c;font-weight:600;
}
.installed-card .value{
    font-family:ui-monospace,SFMono-Regular,monospace;
    font-size:1.05em;color:#2c3e50;
}

/* --- Generic status pill ------------------------------------------- */
.pill{
    display:inline-block;padding:.25em .8em;border-radius:999px;
    font-size:.78em;font-weight:600;letter-spacing:.04em;color:#fff;
    background:#7d9eb0;white-space:nowrap;
}
.pill.good   {background:#6cab5e}
.pill.amber  {background:#d4944a}
.pill.bad    {background:#c97464}
.pill.offline{background:#7a8b95}

/* --- "what the page is telling you" line --------------------------- */
.note{
    background:#f2f6f8;border-radius:12px;
    padding:.75em 1em;margin:.6em 0 1.2em;font-size:.94em;color:#3a5165;
    line-height:1.45;box-shadow:0 1px 3px rgba(0,0,0,.05);
}
.note code{font-family:ui-monospace,SFMono-Regular,monospace;color:#5d3a3a}
.note.tap{background:#ffd278;color:#5c3a00;cursor:pointer;box-shadow:0 3px 10px rgba(212,148,74,.35)}
.note.tap .tapHint{display:block;margin-top:.35em;font-size:1.05em}
.note.tap:active{transform:translateY(1px)}
.pill.tap{cursor:pointer;background:#ffd278;color:#5c3a00;box-shadow:0 2px 6px rgba(212,148,74,.35)}
.pill.tap:active{transform:translateY(1px)}

/* --- One source (Local server / Public release) -------------------- */
.source-section{margin:1.4em 0 .6em}
.source-section h2{
    font-family:inherit;font-size:1.1em;font-weight:500;color:#3a5165;
    margin:0 0 .35em;letter-spacing:.01em;
}
.source-section .source-state{margin:0 0 .7em}

/* --- One version card --------------------------------------------- */
.versions{display:flex;flex-direction:column;gap:.7em;margin:0 0 1em}
.ver{
    display:grid;
    grid-template-columns:1fr auto;
    column-gap:.9em;row-gap:.45em;align-items:center;
    background:#f2f6f8;
    border:1px solid rgba(125,158,176,.22);border-radius:14px;
    padding:.9em 1.05em;
    box-shadow:0 2px 6px rgba(0,0,0,.06);
}
.ver.current{outline:1.5px solid #6cab5e;outline-offset:-1px}
.ver-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:.55em}
.ver-num{
    font-family:ui-monospace,SFMono-Regular,monospace;
    font-size:1.25em;color:#2c3e50;letter-spacing:-.005em;
}
.ver-label{
    display:inline-block;font-size:.7em;letter-spacing:.16em;
    text-transform:uppercase;color:#3a5165;
    background:#e2eaef;border-radius:999px;
    padding:.2em .65em;
}
.ver-tag{
    font-size:.68em;letter-spacing:.16em;text-transform:uppercase;
    padding:.2em .65em;border-radius:999px;color:#fff;
}
.ver-tag.newer  {background:#d4944a}
.ver-tag.older  {background:#7a8b95}
.ver-tag.same   {background:#6cab5e}
.ver-notes{
    grid-column:1 / -1;font-size:.88em;color:#5d7a8c;line-height:1.45;
    margin:.15em 0 0;cursor:pointer;
}
/* Release notes are long by nature. Two lines; tap for the rest. */
.ver-notes.clip{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;
}
.ver-notes.clip::after{content:' more\2026';color:#2f6fb0;font-weight:600}
.ver .ver-btn{
    border:0;border-radius:999px;padding:.55em 1em;
    background:#fbf4e1;color:#3a5165;font-weight:600;font-size:.92em;
    cursor:pointer;white-space:nowrap;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
}
.ver .ver-btn:active{transform:translateY(1px)}
.ver .ver-btn:disabled{opacity:.45;cursor:default}

/* --- Bottom action row -------------------------------------------- */
.actions{
    display:flex;flex-wrap:wrap;gap:.6em;justify-content:flex-start;
    margin:1.6em 0 0;
}
.actions .btn{width:auto;flex:0 0 auto;padding:.85em 1.4em;font-size:1em}
.actions .btn-check{background:#d4944a}
.actions .btn-ghost{background:#fbf4e1;color:#3a5165}
</style>
</head>
<body>
<button class=helpBtn aria-label=Help title=Help onclick="LDRC.showHelp()">?</button>
<div class=bg-photo aria-hidden=true></div>
<div class=bg-wash  aria-hidden=true></div>
<div class=container>
    <h1>Check for Update</h1>

    <div class="card installed-card">
        <div class=row><span class=label>Installed</span><span class=value id=current>&hellip;</span></div>
        <div class=row><span class=label>Status</span><span class=value><span class="pill" id=state>Idle</span></span></div>
    </div>

    <p id=message class=note hidden></p>
    <div id=laneCard class=note hidden>
        <div style="margin:0 0 .5em"><b>Install over</b></div>
        <div style="display:flex;gap:.6em;flex-wrap:wrap">
            <button class="btn" type=button id=laneWifi style="flex:1 1 9em;margin:0"></button>
            <button class="btn" type=button id=laneBle  style="flex:1 1 9em;margin:0"></button>
        </div>
        <div id=laneWhy style="margin:.55em 0 0;font-size:.92em"></div>
    </div>

    <section id=local-section class=source-section hidden>
        <h2>Local server</h2>
        <p class=source-state><span class=pill id=local-state>&hellip;</span></p>
        <div id=versions-local class=versions></div>
    </section>

    <section id=public-section class=source-section hidden>
        <h2>Public release</h2>
        <p class=source-state><span class=pill id=public-state>&hellip;</span></p>
        <div id=versions-public class=versions></div>
    </section>

    <div class=actions>
        <button type=button id=check class="btn btn-check"><span class=ico>&#8635;</span>Check now</button>
    </div>

    <div class=footer></div>
</div>

<script>
// The chip's /api/firmware/check fetches both manifests (local dev +
// messiter.com) and returns a single JSON payload. We render from that —
// the page never reaches either server directly.

const $ = id => document.getElementById(id);
let currentFw = '';
let currentVer = '';
let installing = false;

// "RXV2-0.9.35-page-cards"  →  { ver: "0.9.35", label: "page-cards" }
// Lets the page show a clean version number (the user asked for the
// -tag suffix to be stripped) while still surfacing the release
// codename as a pill, ReedsV2-style.
function splitName(name) {
    const m = String(name || '').match(/RXV2-(\d+\.\d+\.\d+)(?:-(.+))?/);
    return m ? { ver: m[1], label: m[2] || '' } : { ver: name || '', label: '' };
}
function vTuple(name) {
    const m = String(name || '').match(/RXV2-(\d+)\.(\d+)\.(\d+)/);
    return m ? [+m[1], +m[2], +m[3]] : [0, 0, 0];
}
function vCmp(a, b) {
    const ta = vTuple(a), tb = vTuple(b);
    for (let i = 0; i < 3; i++) if (ta[i] !== tb[i]) return ta[i] - tb[i];
    return 0;
}
function resolveUrl(url, manifestUrl) {
    if (!url) return '';
    if (/^https?:\/\//i.test(url)) return url;
    try { return new URL(url, manifestUrl).href; }
    catch (e) { return url; }
}

function setStatePill(text, kind) {
    setPill('state', text, kind);
    // The amber "Update available" pill doubles as the install button
    // (Malcolm 2026-09-10: "I instinctively pressed it") - same action as
    // the note below it, with a hint so the tap is expected, not a guess.
    const el = $('state'); if (!el) return;
    if (kind === 'amber' && newestInstall && !installing) {   // not while an install is running (it read 'Installing… — tap to install')
        el.classList.add('tap'); el.onclick = installNewest;
        el.textContent = text + ' \u2014 tap to install';
    } else { el.classList.remove('tap'); el.onclick = null; }
}
function setPill(id, text, kind) {
    const el = $(id); if (!el) return;
    el.textContent = text;
    el.className = 'pill' + (kind ? ' ' + kind : '');
}
function showMessage(html) {
    const m = $('message'); m.innerHTML = html; m.hidden = !html;
    m.classList.remove('tap'); m.onclick = null;
}
// The newest version offered by any source — so the "update available"
// note itself can be tapped to install it (Malcolm 2026-09-02: the banner
// "should double as a button").
let newestInstall = null;
function noteNewest(v, sourceKey, url, fsUrl, btn) {
    if (!newestInstall || vCmp(v.name, newestInstall.v.name) > 0) newestInstall = { v, sourceKey, url, fsUrl, btn };
}
function installNewest() {
    const n = newestInstall; if (!n || installing) return;
    doInstall(n.v, n.sourceKey, n.url, n.fsUrl, n.btn);
}
function showInstallNote(html) {
    const n = newestInstall; if (!n) { showMessage(html); return; }
    showMessage(html + ' <b class=tapHint>&#11014;&#65039; Tap here to install ' + splitName(n.v.name).ver + '</b>');
    const m = $('message'); m.classList.add('tap'); m.onclick = installNewest;
}

// One version card, ReedsV2-style: version number + label pill +
// Newer/Older/Current tag, install button on the right, notes below.
const SOURCE_LABEL = {
    local:  { short: 'local', long: 'the local server' },
    public: { short: 'web',   long: 'messiter.com'     },
};
function makeVersionRow(v, sourceKey, srcManifestUrl) {
    const cmp = vCmp(v.name, currentFw);
    const tagClass = cmp > 0 ? 'newer' : cmp < 0 ? 'older' : 'same';
    const tagText  = cmp > 0 ? 'Newer' : cmp < 0 ? 'Older' : 'Current';

    const wrap = document.createElement('div');
    wrap.className = 'ver' + (cmp === 0 ? ' current' : '');

    const { ver, label } = splitName(v.name);
    const head = document.createElement('div');
    head.className = 'ver-head';
    head.innerHTML =
        '<span class=ver-num>' + ver + '</span>' +
        (label ? '<span class=ver-label>' + label + '</span>' : '') +
        '<span class="ver-tag ' + tagClass + '">' + tagText + '</span>';
    wrap.appendChild(head);

    const verb = cmp > 0 ? 'Install' : cmp < 0 ? 'Roll back' : 'Reinstall';
    const src  = SOURCE_LABEL[sourceKey];
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'ver-btn';
    btn.textContent = verb + (src ? ' · ' + src.short : '');
    const url = resolveUrl(v.url, srcManifestUrl);
    const fsUrl = v.fs_url ? resolveUrl(v.fs_url, srcManifestUrl) : '';
    const fsMd5 = v.fs_md5 || '';
    btn.addEventListener('click', () => doInstall(v, sourceKey, url, fsUrl, btn));
    if (cmp > 0) noteNewest(v, sourceKey, url, fsUrl, btn);
    wrap.appendChild(btn);

    if (v.notes) {
        const n = document.createElement('p');
        n.className = 'ver-notes clip';
        n.textContent = v.notes;
        n.onclick = () => n.classList.toggle('clip');
        wrap.appendChild(n);
    }
    return wrap;
}

// Render one source's manifest into its section. We trim to the
// newest "newer" + the "current" (if listed) + up to 2 "older" entries
// — matches the explicit "update + two previous" ask from earlier
// without flooding the page when the local dev server is offering 40
// historical builds. Returns count of newer entries displayed.
function renderSource(key, src) {
    const section = $(key + '-section');
    const host    = $('versions-' + key);
    host.innerHTML = '';
    if (!src || !src.ok) {
        section.hidden = true;
        return 0;
    }
    const versions = (src.manifest && src.manifest.versions) || [];
    if (versions.length === 0) {
        section.hidden = false;
        setPill(key + '-state', 'Empty manifest', 'amber');
        return 0;
    }
    section.hidden = false;

    const sorted = versions.slice().sort((a, b) => -vCmp(a.name, b.name));
    const newer   = sorted.filter(v => vCmp(v.name, currentFw) > 0);
    const current = sorted.find(v => v.name === currentFw);
    const older   = sorted.filter(v => vCmp(v.name, currentFw) < 0).slice(0, 2);

    setPill(key + '-state',
            newer.length
                ? newer.length + ' newer version' + (newer.length === 1 ? '' : 's')
                : 'Up to date',
            newer.length ? 'amber' : 'good');

    const show = [];
    if (newer.length) show.push(newer[0]);
    if (current)      show.push(current);
    older.forEach(v => show.push(v));

    show.forEach(v => host.appendChild(makeVersionRow(v, key, src.manifest_url)));
    return newer.length;
}

async function loadCurrent() {
    try {
        const s = await LDRC.fetchState();
        if (!s) throw new Error('no state');
        currentFw = s.info.fw_version;
        const { ver, label } = splitName(currentFw);
        currentVer = ver;
        $('current').textContent = ver + (label ? ' · ' + label : '');
        showLastUpdate(s.last_update);
        return s;
    } catch (e) {
        $('current').textContent = '(offline)';
        return null;
    }
}

// The public release manifest, fetched BY THE PHONE APP with its own internet
// (/app/manifest only exists inside the app; a plain browser 404s → null).
const PUBLIC_MANIFEST = 'https://messiter.com/rxv2/release/manifest.json';
async function appManifest() {
    try {
        const r = await fetch('/app/manifest', { cache: 'no-store' });
        if (!r.ok) return null;
        const m = await r.json();
        return (m && m.versions && m.versions.length) ? m : null;
    } catch (e) { return null; }
}

async function check() {
    setStatePill('Checking…', 'amber');
    newestInstall = null;
    showMessage('Asking the local and public manifest servers…');
    $('local-section').hidden = true;
    $('public-section').hidden = true;

    // INSIDE THE APP, phone-first (Malcolm 2026-08-08: the manual check was
    // 'terribly slow or doesn't work' while the banner was instant — the
    // banner reads the release list with the PHONE's internet, but this
    // page was asking the CHIP to fetch HTTPS manifests over its own WiFi:
    // seconds of stall at best, impossible with the transmitter on). Same
    // trick as the banner now: the phone fetches the public list instantly;
    // the chip-side path remains for WiFi/browser use and the dev server.
    if (window.LDRC && LDRC.viaBle) {
        showMessage('Reading the release list with the phone’s internet…');
        const mj = await appManifest();
        if (mj) {
            const publicNewer = renderSource('public',
                { ok: true, manifest: mj, manifest_url: PUBLIC_MANIFEST });
            if (publicNewer) {
                setStatePill('Update available', 'amber');
                showInstallNote('You are running <code>' + currentVer + '</code>. ' +
                    publicNewer + ' newer version' + (publicNewer === 1 ? '' : 's') + ' available.');
            } else {
                setStatePill('Up to date', 'good');
                showMessage('You are running the latest public release.');
            }
            return;
        }
        // Phone has no internet — fall through to the chip-side check.
    }

    // Retry once on a transient failure: the check fetches manifests over HTTPS
    // (a few seconds) and the receiver may still be settling its WiFi just after
    // a reboot, so a single blip shouldn't show a hard error.
    let j;
    for (let attempt = 0; attempt < 12; attempt++) {
        if (attempt) { showMessage('Checking for updates…'); await new Promise(res => setTimeout(res, 2500)); }
        try {
            const r = await fetch('/api/firmware/check', { cache: 'no-store' });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            j = await r.json();
            if (j && j.checking) { j = undefined; continue; }   // background check running — poll again
            break;
        } catch (e) {
            if (attempt >= 2) {
                setStatePill('Error', 'offline');
                showMessage('Network error talking to the receiver — is it powered and on your WiFi?');
                return;
            }
        }
    }
    if (!j) {
        setStatePill('Error', 'offline');
        showMessage('The update check didn\'t finish — reload the page to try again.');
        return;
    }

    if (j.offline) {
        // Bluetooth-only field mode: the receiver has no internet, but inside
        // the app the PHONE does — /app/manifest is the app fetching the
        // public release manifest with its own connection. Installs then go
        // over Bluetooth too, so everything works at the field.
        const mj = await appManifest();
        if (mj) {
            j = { public: { ok: true, manifest: mj, manifest_url: PUBLIC_MANIFEST } };
        } else {
            setStatePill(j.net_mode || 'offline', 'offline');
            showMessage('The receiver is in <b>' + (j.net_mode || 'AP') + '</b> mode, ' +
                'so it cannot reach the manifest servers. ' +
                '<a href="/wifi">Join your home WiFi</a> and come back.');
            return;
        }
    }

    if (j.link_active) {
        setStatePill('Transmitter connected', 'offline');
        showMessage('The transmitter is connected, so the update check is paused to keep the radio ' +
            'link rock-solid. Turn the transmitter off (or exit Simulator mode), then tap ' +
            '<b>Check again</b>.');
        return;
    }

    // Chip online but neither source reachable from it \u2014 the app may still
    // manage with the phone's own connection.
    if (!(j.local && j.local.ok) && !(j.public && j.public.ok)) {
        const mj = await appManifest();
        if (mj) j = { public: { ok: true, manifest: mj, manifest_url: PUBLIC_MANIFEST } };
    }

    const localNewer  = renderSource('local',  j.local);
    const publicNewer = renderSource('public', j.public);

    const localShown  = j.local  && j.local.ok;
    const publicShown = j.public && j.public.ok;
    const totalNewer  = localNewer + publicNewer;

    if (!localShown && !publicShown) {
        setStatePill('Both unreachable', 'offline');
        showMessage('No internet over WiFi from here \u2014 that is normal at the field. Use the PHONE APP over Bluetooth to update: it fetches releases through your phone\u2019s own connection and pushes them to the receiver.');
        return;
    }
    if (totalNewer) {
        setStatePill('Updates available', 'amber');
        const where = localShown && publicShown ? 'either source below'
                    : localShown ? 'the local server below'
                                 : 'the public release below';
        showInstallNote('You are running <code>' + currentVer + '</code>. ' +
            totalNewer + ' newer version' + (totalNewer === 1 ? '' : 's') +
            ' available from ' + where + '.');
    } else {
        setStatePill('Up to date', 'good');
        showMessage('You are running the latest version offered by ' +
            (localShown && publicShown ? 'both sources.' :
             localShown ? 'the local server.' : 'the public release.'));
    }

    // Flag when local is ahead of public — typically means a release that
    // hasn't been FTP-pushed to messiter.com yet.
    if (localShown && publicShown) {
        const maxOf = vs => vs.slice().sort((a, b) => vCmp(a.name, b.name)).pop();
        const lmax = maxOf(j.local.manifest.versions  || []);
        const pmax = maxOf(j.public.manifest.versions || []);
        if (lmax && pmax && vCmp(lmax.name, pmax.name) > 0) {
            const m = $('message');
            const lv = splitName(lmax.name).ver;
            const pv = splitName(pmax.name).ver;
            m.innerHTML += '<br><br><b>Local is ahead:</b> <code>' + lv + '</code> vs <code>' + pv + '</code> on the web.';
        }
    }
}

// Malcolm 2026-09-15: "on occasions where WiFi is available but very faint,
// our system will attempt to update over WiFi. I just did this. It was slow and
// then it failed." The lane used to be chosen on "is WiFi up" alone, with no
// regard for how weak it is. -70 dBm is the threshold already used for deciding
// whether a receiver is close enough to update at all.
// Module scope: both doInstall() and paintLanes() need it.
const WEAK_WIFI_DBM = -70;

// The top row follows the install (Malcolm 2026-09-18: "instead of saying what
// was installed i think it should say which version is being installed").
// THE LAST UPDATE, in the receiver's own words (0.9.813). It keeps a record
// of what it was asked to become and how far it got, so this page can SAY
// whether the last install worked — even one opened long afterwards, and even
// when the install's own progress was never seen. Malcolm twice had an update
// succeed while the page "stopped short of telling me so", and had to work it
// out by reloading and reading the version.
function showLastUpdate(u) {
    if (!u || !u.to || installing) return;
    const el = document.getElementById('message');
    if (!el || el.dataset.updShown) return;
    const to = splitName(u.to).ver || u.to, from = splitName(u.from).ver || u.from;
    if (u.ok) {
        // Only worth saying while it is news: the boot straight after it.
        if (!u.fresh) return;
        el.dataset.updShown = '1';
        el.className = 'note';
        el.innerHTML = '<b>\u2713 Update finished.</b> ' +
            (from && from !== to ? 'This receiver went from <code>' + from + '</code> to <code>' + to + '</code>.'
                                 : 'This receiver is running <code>' + to + '</code>.');
        el.hidden = false;
        return;
    }
    if (u.stage === 'none' || u.stage === 'done') return;
    el.dataset.updShown = '1';
    el.className = 'note';
    el.innerHTML = '<b>The last update did not finish.</b> It was installing <code>' + to +
        '</code> and stopped while <b>' + u.stage + '</b>. This receiver is still on <code>' +
        (from || currentVer) + '</code>, which is untouched \u2014 try again below.';
    el.hidden = false;
}

function paintTopRow(installingVer) {
    const lbl = document.querySelector('.installed-card .row .label');
    const { ver, label } = splitName(currentFw);
    if (installingVer) {
        if (lbl) lbl.textContent = 'Installing';
        $('current').textContent = installingVer + (ver ? '  (was ' + ver + ')' : '');
    } else {
        if (lbl) lbl.textContent = 'Installed';
        $('current').textContent = currentFw ? ver + (label ? ' · ' + label : '') : '(offline)';
    }
}

async function doInstall(v, sourceKey, url, fsUrl, btnEl) {
    if (installing) return;
    const { ver } = splitName(v.name);
    // fsMd5 lives HERE, not in the card builder's scope — referencing the
    // builder's copy threw a ReferenceError that killed every manual
    // install before its POST ever fired (all three stuck screens).
    const fsMd5 = v.fs_md5 || '';
    if (!(await LDRC.confirm(
            'Install ' + ver + ' from ' + (SOURCE_LABEL[sourceKey]?.long || 'this source') +
            '? The receiver will reboot.',
            { title: 'Install firmware', icon: '📥', yes: 'Install + reboot', kind: 'warn' }))) return;

    installing = true;
    paintTopRow(ver);
    // Keep the screen awake for the whole install where the browser allows it
    // (Malcolm 2026-09-18: "The iPhone screen timed out during update causing
    // a hiccup"). The apps hold the screen natively as well; this covers a
    // plain browser. Held until the page unloads - every ending leaves it.
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
    document.querySelectorAll('.ver-btn').forEach(b => b.disabled = true);
    $('check').disabled = true;
    setStatePill('Installing ' + ver + '…', 'amber');
    // The chip is single-minded while flashing (it can't answer requests
    // mid-install), so true progress isn't possible — an honest elapsed
    // ticker beats a frozen screen.
    const instT0 = Date.now();
    const instTick = setInterval(() => {
        const el = document.getElementById('instSecs');
        if (el) el.textContent = Math.round((Date.now() - instT0) / 1000);
        else clearInterval(instTick);
    }, 1000);
    showMessage('<b>Installing</b> <code>' + ver + '</code> from <b>' +
        (SOURCE_LABEL[sourceKey]?.long || 'this source') + '</b>… ' +
        '<span class=muted>(<span id=instSecs>0</span> s elapsed — typically 30–90 s, longer over Bluetooth. The receiver reboots when done.)</span>');
    // FASTEST FIRST (Malcolm 2026-08-05): if the receiver's own WiFi is up
    // (STA joined a network → internet), skip the slow Bluetooth stream and
    // let the chip PULL the images itself at WiFi speed — the tiny install
    // request still travels over whatever link this page is on. Only the
    // genuinely offline field case pays the Bluetooth price.
    // Still joining its network (just powered up, router slow to re-admit it)?
    // Wait for it — up to 45 s is still far quicker than a Bluetooth push
    // (Malcolm 2026-09-02: "over Bluetooth – but it should be Wi-Fi, of course").
    let chipHasInternet = false;
    try {
        // The pilot's own choice wins. Tapping Bluetooth means Bluetooth - not
        // "wait up to 45 s for WiFi, then use Bluetooth anyway". Malcolm
        // 2026-09-18, on a dongle that could not join: "even though Bluetooth
        // is selected, it's attempting to download over Wi-Fi and failing".
        if (window.__preferBle || window.__laneBle) throw new Error('Bluetooth chosen - skip the WiFi wait');
        const t0 = Date.now();
        let misses = 0;
        for (;;) {
            // One dropped status read must not send a WiFi-capable receiver
            // down the Bluetooth path (Malcolm 2026-09-02: "sometimes go over
            // BLE when they could easily go over Wi-Fi") — retry a few times.
            let st = null;
            try { st = await (await fetch('/api/state.json', { cache: 'no-store' })).json(); } catch (e) {}
            if (!st) { if (++misses >= 4) break; await new Promise(r => setTimeout(r, 1500)); continue; }
            misses = 0;
            const mode = st.net ? st.net.mode : '';
            // 0.9.779: WiFi chosen while the receiver is still rejoining is fine
            // too - the receiver pauses Bluetooth and finishes the join itself
            // before downloading. Only when WiFi was picked, never by default.
            chipHasInternet = !window.__preferBle && !window.__laneBle &&
                (mode === 'WiFi up' || (mode === 'connecting WiFi' && st.net.sta_status !== 1));
            // sta_status 1 = home network not in range (the field): don't wait.
            const joining = (mode === 'connecting WiFi' && st.net.sta_status !== 1) || mode === 'waiting for TX' || mode === 'init';
            if (chipHasInternet || !joining || Date.now() - t0 > 45000) break;
            showMessage('<b>Installing</b> <code>' + ver + '</code>… <span class=muted>waiting for the receiver’s WiFi (' + Math.round((Date.now() - t0) / 1000) + ' s) — faster than Bluetooth.</span>');
            await new Promise(r => setTimeout(r, 2000));
        }
    } catch (e) {}
    // Inside the app WITHOUT receiver WiFi: native Bluetooth push — the
    // PHONE downloads the images (WiFi or 5G) and streams them over BLE, so
    // no receiver-side internet is needed (hello, hunting lodge). On WiFi
    // (or an older app) the /app/ probe 404s and we fall to chip-pull.
    try {
        if (chipHasInternet) throw new Error('receiver WiFi is faster');
        const r0 = await fetch('/app/bleota/start?fw=' + encodeURIComponent(url) +
                               (fsUrl ? '&fs=' + encodeURIComponent(fsUrl) : ''), { cache: 'no-store' });
        if (r0.ok && ((await r0.json()).ok)) {
            clearInterval(instTick);
            const t0 = Date.now();
            let rebootT0 = 0;   // when the runner first said 'rebooting'
            const bar = pct =>
                '<div style="height:12px;border-radius:6px;background:rgba(128,128,128,.25);overflow:hidden;margin-top:10px">' +
                '<div style="height:100%;width:' + pct + '%;background:#3b82f6;border-radius:6px;transition:width .5s"></div></div>';
            // The app's runner owns the whole install INCLUDING the reboot:
            // it reconnects over BLE afterwards and confirms the new version,
            // so this loop only displays phases until done/error.
            for (;;) {
                await new Promise(res => setTimeout(res, 600));
                let p = null;
                try { p = await (await fetch('/app/bleota/progress', { cache: 'no-store' })).json(); } catch (e) {}
                if (!p) continue;
                if (p.phase === 'error') {
                    setStatePill('Failed', 'bad');
                    showMessage('Bluetooth install failed: ' + p.msg + ' \u2014 the old firmware is untouched.');
                    installing = false; paintTopRow(''); $('check').disabled = false;
                    document.querySelectorAll('.ver-btn').forEach(b => b.disabled = false);
                    return;
                }
                if (p.phase === 'done') {
                    setStatePill('Installed', 'good');
                    // confirmed:false (apps 5.99 / 5.93): the runner never saw the
                    // receiver again over Bluetooth. A reload over a link that is
                    // not back hangs on this screen for good (DongleSim,
                    // 2026-09-18: "it just sat there... it had updated
                    // successfully, but it didn't know it had"). Go back to the
                    // list instead: the scanner reconnects by itself.
                    if (p.confirmed === false) {
                        showMessage('<b>Installed.</b> ' + p.msg + '<br><br>Back to the list in a moment \u2014 tap the model there and the new version shows at the bottom.' + bar(100));
                        setTimeout(() => { try { window.webkit.messageHandlers.rxv2.postMessage('disconnect'); } catch (e) {} }, 4000);
                        return;
                    }
                    showMessage('<b>\u2713 Updated over Bluetooth</b> \u2014 ' + p.msg + '. Page reloads in 5\u2009s.' + bar(100));
                    setTimeout(() => location.href = '/', 5000);
                    return;
                }
                if (p.phase === 'rebooting') {
                    if (!rebootT0) rebootT0 = Date.now();
                    const rs = Math.round((Date.now() - rebootT0) / 1000);
                    setStatePill('Rebooting\u2026', 'amber');
                    showMessage('<b>Installed.</b> ' + p.msg + ' <span class=muted>(' + rs + '\u2009s)</span>'
                        + (rs > 75 ? '<br><span class=muted>Bluetooth is slow to re-find it. The update is in: if this goes on, go back to the list and tap the model.</span>' : '')
                        + bar(100));
                } else if (p.total > 0) {
                    const pct = Math.round(100 * p.sent / p.total);
                    setStatePill('Installing ' + pct + '%', 'amber');
                    showMessage('<b>Installing over Bluetooth</b> \u2014 ' + p.msg +
                                ' <span class=muted>(' + Math.round(p.sent / 1024) + ' of ' +
                                Math.round(p.total / 1024) + ' KB \u2014 ' + pct + '%)</span>' + bar(pct));
                } else {
                    setStatePill('Installing\u2026', 'amber');
                    showMessage('<b>Installing over Bluetooth</b> \u2014 ' + p.msg + bar(0));
                }
                if (Date.now() - t0 > 10 * 60 * 1000) {
                    setStatePill('Waiting\u2026', 'amber');
                    showMessage('This is taking longer than expected \u2014 reload this page to check the receiver.');
                    installing = false; paintTopRow(''); $('check').disabled = false;
                    document.querySelectorAll('.ver-btn').forEach(b => b.disabled = false);
                    return;
                }
            }
        }
    } catch (e) { /* not running inside the app — use the chip-pull path below */ }

    // IN-APP chip-pull: deterministic by design (Malcolm 2026-08-08, third
    // stuck screen). The install POST's reply is IRRELEVANT — the receiver
    // blocks for the whole download then reboots, so over Bluetooth the
    // reply may time out, error, or die with the link, and branching on it
    // stranded the page three different ways. Fire it, forget it, and judge
    // ONLY by the receiver's version changing.
    if (window.LDRC && LDRC.viaBle) {
        fetch('/api/firmware/install?url=' + encodeURIComponent(url) +
              (fsUrl ? '&fs_url=' + encodeURIComponent(fsUrl) : '') +
              (fsMd5 ? '&fs_md5=' + encodeURIComponent(fsMd5) : '') +
              '&name=' + encodeURIComponent(v.name),
              { method: 'POST' }).catch(() => {});
        clearInterval(instTick);
        setStatePill('Installing…', 'amber');
        const before2 = currentFw;
        const t2 = Date.now();
        // Estimated glide (same idea as the front-page banner): fill to ~94%
        // over ~75 s, snap to 100% on confirmation. Malcolm 2026-08-09: "a
        // long wait will make users give up" — the bar is the reassurance.
        const ibar = pct =>
            '<div style="background:rgba(125,158,176,.28);border-radius:9px;height:16px;overflow:hidden;margin:.9em 0 .2em">' +
            '<div id=__ibar style="height:100%;width:' + pct + '%;background:#6cab5e;border-radius:9px"></div></div>';
        showMessage('<b>Installing</b> <code>' + ver + '</code> — <span id=__iphase>downloading…</span> ' +
            '<span class=muted>(<span id=__wsecs>0</span> s)</span>' + ibar(0));
        setTimeout(() => {
            const b = document.getElementById('__ibar');
            if (b) { b.style.transition = 'width 75s linear'; b.style.width = '94%'; }
        }, 60);
        // Success = the receiver reports the TARGET version after the install
        // cycle. "Version changed" alone can't judge a same-version REINSTALL
        // (Malcolm hit this within the hour of 0.9.351 shipping): there the
        // proof is silence-then-return \u2014 the chip can't answer while it
        // flashes, so polls failing and then the target answering IS the
        // completed cycle.
        let answered2 = false, sawSilence = false;
        const markFlashing = () => {
            const p = document.getElementById('__iphase');
            if (p) p.textContent = 'flashing + rebooting…';
        };
        while (Date.now() - t2 < 150000) {
            await new Promise(res => setTimeout(res, 2500));
            const we = document.getElementById('__wsecs');
            if (we) we.textContent = Math.round((Date.now() - t2) / 1000);
            if (!answered2 && Date.now() - t2 > 100000) break;   // rescue below
            try {
                const rs = await fetch('/api/state.json', { cache: 'no-store' });
                if (!rs.ok) { sawSilence = true; markFlashing(); continue; }
                const st = await rs.json();
                const now = (st.info && st.info.fw_version) ? st.info.fw_version : '';
                if (!now) { sawSilence = true; markFlashing(); continue; }
                answered2 = true;
                if (now === v.name && (now !== before2 || sawSilence)) {
                    setStatePill('Installed', 'good');
                    showMessage('<b>\u2713 ' + (before2 === v.name ? 'Reinstalled' : 'Updated') +
                        '</b> \u2014 now running <code>' + now + '</code>. Page reloads in 5\u2009s.' + ibar(100));
                    setTimeout(() => location.href = '/', 5000);
                    return;
                }
                if (Date.now() - t2 > 120000) break;   // answering but never completed
            } catch (e2) { sawSilence = true; markFlashing(); /* rebooting */ }
        }
        // BEFORE calling it a failure, look once more, patiently.
        // Malcolm 2026-09-15: "I was about to try the update again... and to my
        // surprise, it told me that it was already up-to-date! So the failure
        // was in fact not a failure. It was simply recorded wrongly."
        // The 150 s window above is generous on a good link and far too short on
        // a weak one — a 1.5 MB firmware plus a 1.5 MB filesystem can still be
        // arriving. Declaring failure then is not just wrong, it invites the
        // pilot to reflash a receiver that is busy flashing, which is the one
        // thing we must not encourage. So: keep watching quietly for another
        // three minutes, and only say it did not work if it still is not there.
        {
            const graceT0 = Date.now();
            setStatePill('Working', '');
            showMessage('<b>Still going.</b> This install is taking longer than usual \u2014 a weak WiFi signal '
                      + 'will do that. <span class=muted>Watching for another <span id=__gsecs>0</span>\u2009s. '
                      + 'Leave the receiver powered.</span>' + ibar(96));
            while (Date.now() - graceT0 < 180000) {
                await new Promise(res => setTimeout(res, 3000));
                const g = document.getElementById('__gsecs');
                if (g) g.textContent = Math.round((Date.now() - graceT0) / 1000);
                try {
                    const rs = await fetch('/api/state.json', { cache: 'no-store' });
                    if (!rs.ok) continue;
                    const st = await rs.json();
                    const now = (st.info && st.info.fw_version) ? st.info.fw_version : '';
                    if (now === v.name) {
                        setStatePill('Installed', 'good');
                        showMessage('<b>\u2713 ' + (before2 === v.name ? 'Reinstalled' : 'Updated') +
                            '</b> \u2014 now running <code>' + now + '</code>. It just took a while. ' +
                            'Page reloads in 5\u2009s.' + ibar(100));
                        setTimeout(() => location.href = '/', 5000);
                        return;
                    }
                } catch (e3) { /* still rebooting */ }
            }
        }
        if (answered2) {
            setStatePill('Failed', 'bad');
            // A WiFi install that crawls and then fails is the weak-signal case
            // (Malcolm 2026-09-15). Offer the other lane rather than leaving him
            // to guess, and say why it is worth trying.
            const overBle = LDRC.viaBle && !window.__preferBle;
            showMessage('Still on <code>' + splitName(before2).ver + '</code> \u2014 '
                + (before2 === v.name ? 'the reinstall did not run.' : 'the install did not complete.')
                + ' <b>The old firmware is untouched.</b>'
                + (overBle
                    ? '<br><br>Weak WiFi is the usual cause. <b>Bluetooth stands a better chance.</b>'
                      + '<div style="margin:.7em 0 0"><button class="btn" id=retryBle style="background:#2f6fb0;color:#fff;margin:0">Try again over Bluetooth</button></div>'
                    : ' Try again.'));
            installing = false; paintTopRow(''); $('check').disabled = false;
            document.querySelectorAll('.ver-btn').forEach(b => b.disabled = false);
            const rb = document.getElementById('retryBle');
            if (rb) rb.onclick = () => { window.__preferBle = true; doInstall(v, sourceKey, url, fsUrl, btnEl); };
        } else {
            // It went quiet and never came back within the window. That is
            // USUALLY a completed flash and a reboot, but we did not see the new
            // version with our own eyes, so do not claim we did.
            setStatePill('Rebooted', '');
            showMessage('<b>The receiver went quiet and rebooted</b> \u2014 which normally means the update '
                      + 'went in, but it did not answer again before we stopped watching, so this is not '
                      + 'confirmed. Returning to the model list: reconnect there and check the version at the '
                      + 'bottom of the screen.');
            setTimeout(() => { try { window.webkit.messageHandlers.rxv2.postMessage('disconnect'); } catch (e) {} }, 2500);
        }
        return;
    }

    try {
        const r = await fetch('/api/firmware/install?url=' + encodeURIComponent(url) +
                              (fsUrl ? '&fs_url=' + encodeURIComponent(fsUrl) : '') +
                              (fsMd5 ? '&fs_md5=' + encodeURIComponent(fsMd5) : '') +
                              '&name=' + encodeURIComponent(v.name),
                              { method: 'POST' });
        if (r.ok) {
            clearInterval(instTick);
            const t = await r.text();
            setStatePill('Installed', 'good');
            showMessage('<b>✓ Installed</b> <code>' + ver + '</code> — ' + t +
                '. Page reloads in 10 s.');
            setTimeout(() => location.href = '/', 10000);
        } else {
            clearInterval(instTick);
            const t = await r.text();
            setStatePill('Failed', 'bad');
            showMessage('Install failed: ' + t);
            installing = false; paintTopRow('');
            $('check').disabled = false;
            document.querySelectorAll('.ver-btn').forEach(b => b.disabled = false);
        }
    } catch (e) {
        // Over Bluetooth (and often over WiFi at the reboot moment) the link
        // drops before the reply arrives — that is NOT a failure. Wait for
        // the receiver to come back and judge by the version it reports.
        setStatePill('Installing\u2026', 'amber');
        showMessage('<b>Installing</b> <code>' + ver + '</code>\u2026 the connection paused while the ' +
                    'receiver downloads and reboots (normal). Waiting for it to come back\u2026');
        const before = currentFw;
        const t0 = Date.now();
        let verdict = '';
        let answered = false;
        while (Date.now() - t0 < 300000) {
            await new Promise(res => setTimeout(res, 2500));
            // In the APP: never wait forever (Malcolm 2026-08-08, 'it sticks
            // at the screen') — if Bluetooth hasn't reconnected ~100 s after
            // the reboot, the install has certainly finished on the receiver;
            // return to the model list and confirm the version there.
            if (!answered && window.LDRC && LDRC.viaBle && Date.now() - t0 > 100000) {
                verdict = 'scanner';
                break;
            }
            try {
                const rs = await fetch('/api/state.json', { cache: 'no-store' });
                if (!rs.ok) continue;
                answered = true;
                const st = await rs.json();
                const now = (st.info && st.info.fw_version) ? st.info.fw_version : '';
                if (!now) continue;
                if (now !== before) { verdict = now; break; }
                // Answering but still the OLD version: allow time for the
                // download phase, then call it a real failure.
                if (Date.now() - t0 > 90000) { verdict = 'same'; break; }
            } catch (e2) { /* still flashing / rebooting */ }
        }
        clearInterval(instTick);
        if (verdict && verdict !== 'same') {
            setStatePill('Installed', 'good');
            showMessage('<b>\u2713 Updated</b> \u2014 now running <code>' + verdict + '</code>. Page reloads in 5\u2009s.');
            setTimeout(() => location.href = '/', 5000);
            return;
        }
        if (verdict === 'scanner') {
            setStatePill('Installed', 'good');
            showMessage('<b>The receiver has rebooted with the update.</b> Returning to the model list — reconnect there to confirm the new version…');
            setTimeout(() => { try { window.webkit.messageHandlers.rxv2.postMessage('disconnect'); } catch (e) {} }, 2500);
            return;
        }
        if (verdict === 'same') {
            setStatePill('Failed', 'bad');
            showMessage('The receiver came back still on <code>' + splitName(before).ver + '</code> \u2014 the install did not complete. Try again.');
        } else {
            setStatePill('Waiting\u2026', 'amber');
            showMessage('The receiver hasn\u2019t come back yet \u2014 give it a moment and reload this page.');
        }
        installing = false; paintTopRow('');
        $('check').disabled = false;
        document.querySelectorAll('.ver-btn').forEach(b => b.disabled = false);
    }
}

$('check').addEventListener('click', check);
document.addEventListener('DOMContentLoaded', () => {
    // ONE installer (Malcolm 2026-09-17: "we seem to have multiple places that
    // install updates. One gives byte count, one does not. I suggest only one
    // bit of code should update so we only ever need to update that bit").
    // Quite right: the front page carried its own copy, which had drifted —
    // no byte count, no lane choice, no 3-minute grace, a different failure
    // message. It now sends people here with ?install=newest instead, and this
    // is the only code that installs anything.
    loadCurrent().then(check).then(() => {
        const wanted = new URLSearchParams(location.search).get('install');
        if (wanted === 'newest' && newestInstall) installNewest();
        else if (wanted === 'newest') showMessage('Nothing newer to install.');
    });
    // WHICH LANE, as a visible choice rather than a sentence (Malcolm
    // 2026-09-15: "I do not see the button to select Bluetooth instead of
    // WiFi - or perhaps two buttons, one to select each"). Quite right: a note
    // that only appears in one condition is a note nobody trusts is there.
    //
    // Two lanes, always both shown inside the app:
    //   WiFi      - the RECEIVER downloads the image itself. Fast, but only if
    //               its own WiFi is up and strong.
    //   Bluetooth - the PHONE downloads it (WiFi or 5G) and streams it across.
    //               Slower, but it works at the flying field and does not care
    //               how weak the receiver's WiFi is.
    // Outside the app (a browser over WiFi) there is no Bluetooth lane at all,
    // so the card stays hidden.
    function paintLanes(st) {
        const card = document.getElementById('laneCard');
        if (!card || !LDRC.viaBle) return;
        // Only a real state object may decide this (0.9.746). Malcolm's phone
        // was told "no WiFi here" beside the router: the Bluetooth bridge had
        // handed this page another request's reply, which parsed as JSON but
        // had no .net — and "no .net" read as "no WiFi". Anything without the
        // shape of a state is ignored, and we simply ask again.
        if (!st || !st.info || !st.net) {
            setTimeout(() => fetch('/api/state.json', { cache: 'no-store' }).then(r => r.json()).then(paintLanes).catch(() => {}), 2000);
            return;
        }
        const net  = (st && st.net) || {};
        const rssi = (st && st.info && typeof st.info.rssi === 'number') ? st.info.rssi : 0;
        const wifiUp   = net.mode === 'WiFi up';
        const joining  = net.mode === 'connecting WiFi';   // after a restart the join can take half a minute
        const wifiWeak = wifiUp && rssi && rssi <= WEAK_WIFI_DBM;
        if (joining) setTimeout(() => fetch('/api/state.json', { cache: 'no-store' }).then(r => r.json()).then(paintLanes).catch(() => {}), 3000);
        // No WiFi = Bluetooth, but as a FACT of this paint, never written into
        // the pilot's choice: __preferBle used to be forced true here and never
        // cleared, so one wrong "no WiFi" sent the install down the slow lane
        // even after WiFi was plainly up (0.9.746). It now holds only what the
        // pilot tapped.
        // Explicitly chosen WiFi holds while the receiver is rejoining (0.9.779);
        // otherwise Bluetooth unless WiFi is plainly up.
        const ble = (window.__preferBle === false) ? !(wifiUp || joining) : (!wifiUp || !!window.__preferBle);
        // What this paint TICKS is what an install must do (0.9.768). With no
        // WiFi up the card showed Bluetooth ticked, yet doInstall still sat
        // 45 s "waiting for the receiver's WiFi" unless the button had been
        // tapped (Malcolm 2026-09-18, DongleSim: "trying WiFi and failing even
        // though bluetooth is selected!!"). Re-painted every few seconds while
        // the receiver is joining, so it flips to WiFi the moment that is up.
        window.__laneBle = ble;

        const w = document.getElementById('laneWifi');
        const b = document.getElementById('laneBle');
        const why = document.getElementById('laneWhy');
        const on  = '#2f6fb0', off = '#9fb0bd';
        w.innerHTML = (ble ? '' : '\u2713 ') + 'Receiver WiFi';
        b.innerHTML = (ble ? '\u2713 ' : '') + 'Bluetooth';
        w.style.cssText = 'flex:1 1 9em;margin:0;color:#fff;background:' + (ble ? off : on);
        b.style.cssText = 'flex:1 1 9em;margin:0;color:#fff;background:' + (ble ? on : off);
        // 0.9.779: WiFi may be chosen while the receiver is rejoining - it
        // pauses Bluetooth (which is what was holding WiFi off) and finishes
        // the join itself before downloading.
        w.disabled = !(wifiUp || joining);
        if (!(wifiUp || joining)) w.style.opacity = '.55';

        why.innerHTML =
            joining   ? 'The receiver is rejoining WiFi \u2014 Bluetooth on the phone tends to hold it off. <b>Receiver WiFi</b> pauses Bluetooth for the download and is much faster; Bluetooth works too.'
          : !wifiUp   ? 'No receiver WiFi here \u2014 Bluetooth is the only way.'
          : wifiWeak  ? '<b>WiFi is weak here (' + rssi + ' dBm)</b> \u2014 Bluetooth stands a better chance.'
          : ble       ? 'Slower, but works anywhere.'
                      : 'Fast \u2014 30\u201390 s' + (rssi ? ' (' + rssi + ' dBm)' : '') + '.';
        card.hidden = false;
        w.onclick = () => { if (!(wifiUp || joining)) return; window.__preferBle = false; paintLanes(st); };
        b.onclick = () => { window.__preferBle = true;  paintLanes(st); };
    }
    if (LDRC.viaBle) {
        fetch('/api/state.json', { cache: 'no-store' })
            .then(r => r.json())
            .then(st => paintLanes(st))
            .catch(() => {});
    }
});
</script>
<template id=helpContent><h2>Firmware update</h2>
<p>Updates the receiver's firmware over the air, either from a local dev server on your home network (if one is running) or from the public messiter.com mirror.</p>
<h3>How to use it</h3>
<p>Tap <b>Check now</b> to refresh the version lists. Each version card shows:</p>
<ul>
<li>Each card is tagged <b>Newer</b> (amber), <b>Current</b> (green) or <b>Older</b> (grey), and its button says what it will do: Install, Reinstall or Roll back.</li>
</ul>
<p>Tap a button, confirm the dialog, and the receiver downloads, flashes and reboots itself — 30–90 seconds over WiFi, longer over Bluetooth. The page polls until the receiver returns, then takes you back to the menu.</p>
<h3>Install over</h3>
<p><b>Receiver WiFi</b> &mdash; the receiver fetches the update itself. Fast, 30&ndash;90 seconds, but it needs a decent signal: below &minus;70&nbsp;dBm an install can crawl and then give up.</p>
<p><b>Bluetooth</b> &mdash; your phone fetches it and passes it across. Slower, but it works anywhere, and it is the better bet on a weak signal or at the field.</p>
<h3>While it installs</h3>
<p>The receiver reconnects by itself. A slow install is not a failed one: the page keeps watching for several minutes before it says anything went wrong. Leave the receiver powered.</p>
<p>A failed install leaves the old firmware untouched, so there is nothing to undo.</p>
<p>Each version shows the first two lines of its release notes. Tap the notes to read the rest.</p>
<h3>If it doesn't come back</h3>
<p>It usually does. If it still hasn&rsquo;t after five minutes, your WiFi password is probably wrong &mdash; join the receiver&rsquo;s own hotspot (named after your model) at <code>http://192.168.4.1</code> — head there to fix.</p>
