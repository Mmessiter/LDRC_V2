        linear-gradient(#fafbfc,#eef0f2),

<script>
// ---------------------------------------------------------------------
//  Channel bar viewer
// ---------------------------------------------------------------------

// TX is sending the full 500..2500 us protocol range; centre 1500.
const CH_LO  = 500;
const CH_HI  = 2500;
const CH_MID = 1500;
// Fill-bar scale is slightly wider than the live range so even at full
// stick deflection a sliver of colour remains visible (matches Rotorflight).
const FILL_LO = 400;
const FILL_HI = 2600;
const POLL_MS  = 33;       // ~30 Hz — smooth-looking bars without hammering the chip
const STALE_MS = 500;

const CH_NAMES = [
    'Roll', 'Pitch', 'Throttle', 'Yaw', 'Collective',
    'AUX 1', 'AUX 2', 'AUX 3', 'AUX 4', 'AUX 5',
    'AUX 6', 'AUX 7', 'AUX 8', 'AUX 9', 'AUX 10', 'AUX 11'
];
const CH_BIPOLAR = [
    true, true, false, true, false,
    false, false, false, false, false,
    false, false, false, false, false, false
];

(function build() {
    let html = '';
    for (let i = 0; i < 16; ++i) {
        const hue = (i * 360 / 16) | 0;
        html += '<div class=chIdx>' + (i + 1) + '</div>'
              + '<div class=chLbl>' + CH_NAMES[i] + '</div>'
              + '<div class=chTrack>'
              +   '<div class=chFill id=f' + i + ' style="background:hsl(' + hue + ',70%,62%)"></div>'
              +   '<div class=chVal  id=v' + i + '>&mdash;</div>'
              + '</div>'
              + '<div class=chPct id=p' + i + '>&mdash;</div>';
    }
    document.getElementById('chTable').innerHTML = html;
})();

const table      = document.getElementById('chTable');
const status     = document.getElementById('status');
const heliWrap   = document.getElementById('heliWrap');
const heliReadout= document.getElementById('heliReadout');

// Stick → -1..+1 about 1500 us.
function stick(us) {
    const v = (us - CH_MID) / ((CH_HI - CH_LO) / 2);   // ±1 at the protocol extremes
    return Math.max(-1, Math.min(1, v));
}
// us → 0..1 from CH_LO..CH_HI.
function unit(us) {
    return Math.max(0, Math.min(1, (us - CH_LO) / (CH_HI - CH_LO)));
}

// ---------------------------------------------------------------------
//  3D helicopter (Three.js) — built once Three.js has loaded
// ---------------------------------------------------------------------

const I_ROLL = 0, I_PITCH = 1, I_THROTTLE = 2, I_YAW = 3, I_COLLECTIVE = 4;
const ROLL_RATE_DPS  = 220;
const PITCH_RATE_DPS = 160;
const YAW_RATE_DPS   = 280;
const STICK_DEAD     = 0.04;

let attRoll = 0, attPitch = 0, attYaw = 0;    // raw stick-deflection accumulators (readout only)
let lastTickMs = 0;
// In-flight default RPM. The disc/blades crossover (in the animation
// loop, below) shows the discrete blades up to ~3 RPS and a translucent
// blur disc above that — matches what a viewer actually sees. Resting
// values are high so the preview opens looking like a flying model.
let rotorRateRPS = 25;
let tailRateRPS  = 90;

let three    = null;
let heliQuat = null;                          // body orientation; identity until buildHeli3D

document.getElementById('heliReset').addEventListener('click', () => {
    attRoll = attPitch = attYaw = 0;
    if (heliQuat) heliQuat.identity();
});

function buildHeli3D() {
    if (!window.THREE) {
        document.getElementById('heliMsg').textContent = '3D library failed to load — bars still work.';
        return;
    }
    const canvas = document.getElementById('heli3D');
    const wrap   = heliWrap;

    const scene = new THREE.Scene();

    const w = wrap.clientWidth, h = wrap.clientHeight;
    const camera = new THREE.PerspectiveCamera(28, w / h, 0.1, 50);
    camera.position.set(2.8, 1.55, 3.4);
    camera.lookAt(0, 0.15, 0);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    // Cap at 1.5×: a 3× iPhone panel means 9× the pixels of @1x — that,
    // at 60 fps, was janking the page (~100 ms hitches) during full-stick
    // sweeps. At this widget size 1.5× is visually identical.
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    renderer.setClearColor(0x000000, 0);
    renderer.setSize(w, h, false);
    // 0.9.690 (Malcolm: "could be made more beautiful"): the model was lit by
    // plain Phong with no reflections, so glossy black read as flat grey.
    // sRGB output + filmic tone mapping is what makes a render look
    // photographed rather than computed.
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    // Environment map, drawn here rather than downloaded: a sky-to-ground
    // gradient with a soft overhead highlight, prefiltered into a proper IBL.
    // This is the single biggest change — a glossy black canopy has nothing to
    // reflect without it, which is exactly why the old model looked dull.
    (function buildEnvironment() {
        const c = document.createElement('canvas');
        c.width = 256; c.height = 128;
        const g = c.getContext('2d');
        const sky = g.createLinearGradient(0, 0, 0, 128);
        sky.addColorStop(0.00, '#eaf2f8');   // zenith
        sky.addColorStop(0.42, '#c2d2de');
        sky.addColorStop(0.52, '#9fb0bc');   // horizon
        sky.addColorStop(0.53, '#6e7a82');   // ground starts
        sky.addColorStop(1.00, '#3c4349');
        g.fillStyle = sky; g.fillRect(0, 0, 256, 128);
        // a soft key highlight for the body to catch
        const hot = g.createRadialGradient(86, 26, 2, 86, 26, 54);
        hot.addColorStop(0, 'rgba(255,255,255,0.95)');
        hot.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = hot; g.fillRect(0, 0, 256, 80);
        const tex = new THREE.CanvasTexture(c);
        tex.mapping = THREE.EquirectangularReflectionMapping;
        tex.colorSpace = THREE.SRGBColorSpace;
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromEquirectangular(tex).texture;
        pmrem.dispose(); tex.dispose();
    })();

    // Lights
    // The environment map now does most of the ambient work, so the lights
    // are here for shape: a key that casts the shadow, a gentle fill, and a
    // rim from behind that separates a black model from a pale background.
    scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa6b0, 0.35));
    const sun = new THREE.DirectionalLight(0xfff4e6, 2.1);
    sun.position.set(3.2, 4.6, 2.4);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    sun.shadow.camera.near = 1; sun.shadow.camera.far = 12;
    sun.shadow.camera.left = -2.2; sun.shadow.camera.right = 2.2;
    sun.shadow.camera.top = 2.2;   sun.shadow.camera.bottom = -2.2;
    sun.shadow.bias = -0.0012;
    sun.shadow.radius = 3;
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0xc8d8e4, 0.55);
    fill.position.set(-3.4, 1.6, -1.2);
    scene.add(fill);
    const rim = new THREE.DirectionalLight(0xffffff, 1.5);
    rim.position.set(-1.6, 1.1, -3.2);
    scene.add(rim);

    // Materials — SAB Heli Division-ish: glossy black body with bright
    // lime-yellow accents. Real RC helis are usually painted in strong
    // primary or fluorescent colours so they can be seen against sky
    // and field; muted tones make a stylised model look generic.
    // Materials — painted like an actual SAB Goblin 770 (Malcolm sent the
    // factory photograph 2026-09-13: "colours are not typical of models").
    // Fluorescent orange shell, white and black graphics, bare carbon frame
    // and boom, white skids. Orange is what model helis are actually painted,
    // because it is the colour that stays visible against both sky and grass.
    // 0.9.690: physically-based now, so metalness/roughness and the
    // environment map do the work that fixed "shininess" numbers used to fake.
    const M = {
        // Clearcoat is the trick that makes painted bodywork look painted:
        // a rough-ish colour coat under a smooth lacquer that reflects the sky.
        body:    new THREE.MeshPhysicalMaterial({ color: 0xf2551c, metalness: .05, roughness: .3,
                                                  clearcoat: 1, clearcoatRoughness: .07 }),
        accent:  new THREE.MeshPhysicalMaterial({ color: 0xf7f7f5, metalness: .05, roughness: .28,
                                                  clearcoat: 1, clearcoatRoughness: .12 }),
        accent2: new THREE.MeshPhysicalMaterial({ color: 0x14141a, metalness: .1,  roughness: .34,
                                                  clearcoat: 1, clearcoatRoughness: .16 }),
        dark:    new THREE.MeshPhysicalMaterial({ color: 0x1b1b1f, metalness: .3, roughness: .5 }),
        blade:   new THREE.MeshPhysicalMaterial({ color: 0x0e0e12, metalness: .15, roughness: .38,
                                                  clearcoat: .8, clearcoatRoughness: .2 }),
        // Anodised aluminium: properly metallic, so it reflects the gradient
        // rather than sitting there as flat grey.
        metal:   new THREE.MeshPhysicalMaterial({ color: 0xb4bac2, metalness: 1, roughness: .26,
                                                  envMapIntensity: 1.3 }),
        battery: new THREE.MeshPhysicalMaterial({ color: 0xcf3327, metalness: .1, roughness: .42,
                                                  clearcoat: .7, clearcoatRoughness: .25 }),
        // Spinning rotor: a motion-blurred disc, not a plate. The texture is
        // drawn here — a faint sweep with two brighter arcs, so the eye reads
        // blades passing rather than a sheet of grey plastic.
        disc:    new THREE.MeshBasicMaterial({
            map: (function () {
                const c = document.createElement('canvas');
                c.width = c.height = 256;
                const g = c.getContext('2d');
                g.clearRect(0, 0, 256, 256);
                // faint body of the blur, fading to nothing at the hub
                const r = g.createRadialGradient(128, 128, 18, 128, 128, 126);
                r.addColorStop(0.00, 'rgba(18,24,30,0)');
                r.addColorStop(0.22, 'rgba(18,24,30,0.05)');
                r.addColorStop(0.90, 'rgba(18,24,30,0.10)');
                r.addColorStop(1.00, 'rgba(18,24,30,0)');
                g.fillStyle = r; g.fillRect(0, 0, 256, 256);
                // two brighter sweeps = the blades you half-see
                for (let i = 0; i < 2; i++) {
                    g.save(); g.translate(128, 128); g.rotate(i * Math.PI);
                    const a = g.createLinearGradient(0, 0, 124, 0);
                    a.addColorStop(0, 'rgba(24,31,39,0)');
                    a.addColorStop(.60, 'rgba(24,31,39,0.55)');
                    a.addColorStop(.97, 'rgba(24,31,39,0.42)');
                    a.addColorStop(1, 'rgba(24,31,39,0)');
                    g.fillStyle = a;
                    g.beginPath(); g.moveTo(0, 0);
                    g.arc(0, 0, 124, -0.30, 0.30); g.closePath(); g.fill();
                    g.restore();
                }
                const t = new THREE.CanvasTexture(c);
                t.colorSpace = THREE.SRGBColorSpace;
                return t;
            })(),
            transparent: true, opacity: .55, toneMapped: false,
            side: THREE.DoubleSide, depthWrite: false
        }),
        // Blade tips travel furthest and read darker in a motion-blurred
        // photograph; this thin ring gives the disc its edge.
        discRim: new THREE.MeshBasicMaterial({
            color: 0x151b22, transparent: true, opacity: .10, toneMapped: false,
            side: THREE.DoubleSide, depthWrite: false
        })
    };

    const heli = new THREE.Group();
    heli.rotation.order = 'YZX';            // intrinsic yaw → pitch → roll
    heli.position.y = 0.1;

    // ============================================================
     // Lower chassis + battery — the single biggest "this is a model"
     // tell. Full-scale helis have a sealed fuselage; model helis are
     // a thin shell sitting on a visible carbon-plate chassis with
     // the battery slung beneath it between the skid struts. Showing
     // that open frame underneath is what turns the silhouette from
     // "torpedo" into "scratch-built RC model".
     // ============================================================
    // (Chassis box removed — the user found it sat awkwardly between
    //  the skids and read as a separate floating piece.)

    // Main shell — ONE lathed surface, not a stack of spheres.
    // Malcolm 2026-09-13: "remove the bulge at the nose, shortening the front".
    // The bulge was unavoidable with the old build: a scaled sphere for the
    // body and a second scaled sphere for the nose always meet at a visible
    // shoulder, because two ellipsoids cannot share a tangent. A LatheGeometry
    // spun from a single profile curve has no join anywhere along its length,
    // so the taper into the nose is continuous by construction — and the
    // profile is also where the shape is now tuned, one number at a time.
    //
    // Profile runs tail (-0.72) to nose (+0.50): the front is ~0.10 shorter
    // than the old nose reached, and it closes to a small rounded tip instead
    // of a ball. The spin axis is Y, so it is laid along X afterwards.
    const shellPts = [
        [0.205, -0.330],   // open rear mouth — the frame shows through here
        [0.222, -0.230],
        [0.232, -0.110],
        [0.237,  0.000],   // deepest point, under the mast
        [0.234,  0.110],
        [0.224,  0.210],
        [0.205,  0.300],
        [0.175,  0.375],
        [0.135,  0.435],
        [0.088,  0.478],
        [0.040,  0.500],
        [0.000,  0.508]    // small blunt tip, not a ball
    ].map(([r, y]) => new THREE.Vector2(r, y));
    const shellGeo = new THREE.LatheGeometry(shellPts, 40);
    shellGeo.rotateZ(-Math.PI / 2);          // spin axis Y -> body axis X
    shellGeo.scale(1, 1.06, 0.80);           // a fuselage is taller than it is wide
    shellGeo.computeVertexNormals();
    const fuse = new THREE.Mesh(shellGeo, M.body);
    fuse.position.set(0.14, 0.03, 0);
    heli.add(fuse);

    // Livery is PAINTED ON, not stuck on. The old graphics were flat
    // ShapeGeometry planes floating just outside the body; on a lathed shell
    // that curves in two directions they clip straight through it. A canvas
    // texture mapped to the shell's own UVs follows the surface exactly, costs
    // one 512x256 bitmap, and lets the swoosh wrap the way a real decal does.
    //
    // LatheGeometry UVs: u runs around the circumference, v along the profile
    // from tail (v=0) to nose (v=1). The flanks are therefore at u=0.25 and
    // u=0.75, which is where the graphic has to sit for it to appear on the
    // sides and not over the spine.
    (function paintShell() {
        const W = 512, H = 256;
        const c = document.createElement('canvas');
        c.width = W; c.height = H;
        const g = c.getContext('2d');
        g.fillStyle = '#f2551c'; g.fillRect(0, 0, W, H);          // base coat

        // One flank's graphic, drawn at a given horizontal centre.
        // Canvas y is flipped against v, so the nose is at the TOP here.
        // dir says which way the BELLY lies from this flank in u, so the
        // window and lettering land below the swoosh and not above it.
        function flank(cx, dir) {
            const halfW = W * 0.105;
            const x0 = cx - halfW, x1 = cx + halfW;
            // white swoosh: a long tapering sweep from the tail up to the nose
            g.beginPath();
            g.moveTo(x0, H * 0.30);
            g.bezierCurveTo(cx - halfW * 0.3, H * 0.42, cx + halfW * 0.3, H * 0.62, x1, H * 0.80);
            g.lineTo(x1, H * 0.92);
            g.bezierCurveTo(cx + halfW * 0.3, H * 0.74, cx - halfW * 0.3, H * 0.52, x0, H * 0.38);
            g.closePath();
            g.fillStyle = '#f7f7f5'; g.fill();
            // thin black liner hugging the underside of the swoosh
            g.beginPath();
            g.moveTo(x0, H * 0.38);
            g.bezierCurveTo(cx - halfW * 0.3, H * 0.52, cx + halfW * 0.3, H * 0.74, x1, H * 0.92);
            g.lineTo(x1, H * 0.975);
            g.bezierCurveTo(cx + halfW * 0.3, H * 0.79, cx - halfW * 0.3, H * 0.57, x0, H * 0.425);
            g.closePath();
            g.fillStyle = '#14141a'; g.fill();

            // The big side cut-out: on a real Goblin the lower canopy is
            // largely open, and you look straight through at the carbon frame.
            // Painted rather than modelled, because a hole cut in a lathed
            // shell would show the inside of the far side through it.
            const wx = cx + dir * W * 0.062;
            g.save();
            g.beginPath();
            const wy0 = H * 0.42, wy1 = H * 0.80, ww = W * 0.038;
            g.moveTo(wx - ww, wy0 + 12);
            g.quadraticCurveTo(wx - ww, wy0, wx - ww + 10, wy0);
            g.lineTo(wx + ww - 10, wy0 + 6);
            g.quadraticCurveTo(wx + ww, wy0 + 10, wx + ww, wy0 + 22);
            g.lineTo(wx + ww, wy1 - 12);
            g.quadraticCurveTo(wx + ww, wy1, wx + ww - 12, wy1);
            g.lineTo(wx - ww + 8, wy1 - 4);
            g.quadraticCurveTo(wx - ww, wy1 - 8, wx - ww, wy1 - 20);
            g.closePath();
            g.fillStyle = '#0d0d10'; g.fill();
            g.lineWidth = 3; g.strokeStyle = '#f7f7f5'; g.stroke();   // white surround
            g.restore();

            // Lettering — our own name, not the manufacturer's. Barely legible
            // at 480 pixels, but the eye reads "there is writing on it", which
            // is most of the effect.
            g.save();
            // This shell's UVs put the body's long axis along canvas Y, not X,
            // so unrotated text runs AROUND the fuselage instead of along it.
            // Rotate a quarter turn, then mirror per flank so it reads forwards
            // on whichever side you are looking at.
            g.translate(cx - dir * W * 0.042, H * 0.58);   // clear of the swoosh, up toward the spine
            g.rotate(-Math.PI / 2);
            g.scale(dir, 1);
            g.fillStyle = '#f7f7f5';
            g.font = 'bold 15px -apple-system, Helvetica, Arial, sans-serif';
            g.textAlign = 'center';
            g.fillText('LDRC', 0, 0);
            g.font = 'bold 8px -apple-system, Helvetica, Arial, sans-serif';
            g.fillText('LOCKDOWN RADIO CONTROL', 0, 12);
            g.restore();
        }
        // Measured from the render, not assumed: u=0.75 is the SPINE and
        // u=0.25 the belly, so the flanks sit at u=0 and u=0.5. u=0 straddles
        // the texture seam, so that flank is drawn twice, once at each edge.
        flank(0, +1);
        flank(W, +1);
        flank(W * 0.5, -1);

        // Dark vent panel on the spine, just ahead of the mast — the shadowed
        // cut-out every Goblin canopy has, and the thing that stops the top
        // reading as one unbroken orange dome.
        g.fillStyle = '#2a1c15';
        g.beginPath();
        g.ellipse(W * 0.75, H * 0.34, W * 0.05, H * 0.10, 0, 0, Math.PI * 2);
        g.fill();

        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        t.anisotropy = 4;
        // A DEDICATED material: assigning the map to M.body painted the decals
        // onto every other orange part that shares it (the tail fin sprouted
        // white slashes).
        const shellMat = M.body.clone();
        shellMat.map = t;
        shellMat.color.set(0xffffff);    // let the texture carry the colour
        fuse.material = shellMat;
    })();

    // (Nose and canopy meshes deleted: both are part of the lathed shell now.
    //  A separate nose sphere was exactly what produced the bulge, and a
    //  separate canopy dome sat on top of it as a second shoulder.)

    // ---- Carbon frame, seen through the shell's cut-out -------------------
    // The single most Goblin-ish thing about a Goblin: two black carbon side
    // plates carrying the motor and the belt, visible under and behind the
    // canopy. Without them the machine reads as one solid orange lozenge,
    // which is what a toy looks like and a real helicopter does not.
    const frameShape = new THREE.Shape();
    frameShape.moveTo(-0.30, -0.17);
    frameShape.lineTo( 0.20, -0.19);
    frameShape.lineTo( 0.30, -0.02);
    frameShape.lineTo( 0.26,  0.21);
    frameShape.lineTo(-0.16,  0.25);
    frameShape.lineTo(-0.32,  0.08);
    frameShape.closePath();
    const frameGeo = new THREE.ExtrudeGeometry(frameShape, { depth: 0.012, bevelEnabled: false });
    for (const z of [-0.118, 0.106]) {
        const fr = new THREE.Mesh(frameGeo, M.dark);
        fr.position.set(-0.11, 0.05, z);
        heli.add(fr);
    }
    // The dark gap between the plates, so the cut-out reads as a hole rather
    // than a painted patch.
    const gapGeo = new THREE.BoxGeometry(0.50, 0.34, 0.20);
    const gap = new THREE.Mesh(gapGeo, new THREE.MeshPhysicalMaterial({
        color: 0x0a0a0c, metalness: .2, roughness: .85
    }));
    gap.position.set(-0.13, 0.05, 0);
    heli.add(gap);

    // ---- Motor and belt pulley, low and forward between the plates --------
    const motorGeo = new THREE.CylinderGeometry(0.072, 0.072, 0.115, 16);
    const motor = new THREE.Mesh(motorGeo, M.metal);
    motor.rotation.x = Math.PI / 2;
    motor.position.set(0.01, 0.00, 0);
    heli.add(motor);
    const pulleyGeo = new THREE.CylinderGeometry(0.052, 0.052, 0.022, 16);
    const pulley = new THREE.Mesh(pulleyGeo, M.dark);
    pulleyGeo.rotateX(Math.PI / 2);
    pulley.position.set(0.01, 0.00, 0.085);
    heli.add(pulley);

    // ---- Three servos, the little black boxes round the front frame -------
    const servoGeo = new THREE.BoxGeometry(0.075, 0.058, 0.038);
    for (const [x, y, z] of [[0.14, -0.07, 0.125], [0.14, -0.07, -0.125], [-0.20, -0.06, 0.125]]) {
        const sv = new THREE.Mesh(servoGeo, M.dark);
        sv.position.set(x, y, z);
        heli.add(sv);
    }

    // ---- Flight battery, slung low under the nose ------------------------
    const battGeo = new THREE.BoxGeometry(0.30, 0.105, 0.145);
    const batt = new THREE.Mesh(battGeo, M.battery);
    batt.position.set(0.22, -0.135, 0);
    heli.add(batt);

    // Engine cowling — narrow dome over the motor mount, behind the canopy.
    const cowlGeo = new THREE.SphereGeometry(0.18, 18, 12);
    cowlGeo.scale(1.05, 0.55, 0.62);
    const cowl = new THREE.Mesh(cowlGeo, M.dark);
    cowl.position.set(-0.08, 0.26, 0);
    heli.add(cowl);

    // ---- A few untidy wires peeking out of the back of the frame ----------
    // Malcolm 2026-09-13: "often real models have a hint of slightly untidy
    // wires just peeking out from the rear of the main fuselage. We could
    // maybe add in a couple to make users smile?!"
    // Nobody's loom is ever quite tucked in. Three leads in the usual colours,
    // each with its own droop, deliberately NOT symmetrical — tidiness is what
    // would give the game away. They are the last thing that says "somebody
    // built this" rather than "a computer drew it".
    const wireMat = {
        black: new THREE.MeshPhysicalMaterial({ color: 0x121216, metalness: .05, roughness: .55 }),
        red:   new THREE.MeshPhysicalMaterial({ color: 0xc02a20, metalness: .05, roughness: .5 }),
        white: new THREE.MeshPhysicalMaterial({ color: 0xd8d8d4, metalness: .05, roughness: .5 })
    };
    // Each lead is a LOOP, not a stub. Malcolm 2026-09-13: "those showing
    // wires need to be not cut off! They must come out a tiny bit and go back
    // in!" — quite right: an open-ended tube shows its cut face hanging in
    // mid-air. So every wire STARTS and ENDS inside the frame (|z| < 0.09 and
    // x within the gap box, where the opaque black swallows it) and only the
    // middle of the curve bulges outboard past the plates at z = +/-0.118.
    const wires = [
        { mat: wireMat.black, r: 0.0060, pts: [
            [-0.290,  0.105,  0.080], [-0.345,  0.098,  0.150],
            [-0.400,  0.052,  0.156], [-0.355,  0.015,  0.082] ] },
        { mat: wireMat.red,   r: 0.0055, pts: [
            [-0.268,  0.135,  0.074], [-0.335,  0.132,  0.140],
            [-0.395,  0.098,  0.148], [-0.345,  0.060,  0.078] ] },
        { mat: wireMat.white, r: 0.0050, pts: [
            [-0.300,  0.085, -0.078], [-0.355,  0.070, -0.145],
            [-0.395,  0.030, -0.140], [-0.350,  0.005, -0.080] ] }
    ];
    for (const w of wires) {
        const path = new THREE.CatmullRomCurve3(w.pts.map(([x, y, z]) => new THREE.Vector3(x, y, z)));
        const geo = new THREE.TubeGeometry(path, 20, w.r, 6, false);
        heli.add(new THREE.Mesh(geo, w.mat));
    }

    // Tail boom + control rod
    const boomGeo = new THREE.CylinderGeometry(0.022, 0.07, 1.3, 14);
    // The boom carries the model's name in big letters, the way a real one
    // does — but OUR name. Drawn to a canvas and wrapped round the cylinder;
    // at this size it reads as lettering even where the characters do not
    // resolve. (Malcolm 2026-09-13: the manufacturer's name belongs to them,
    // and a third-party brand in a shipped app is an App Review 5.2.1 risk.)
    const boomMat = M.accent.clone();
    (function letterBoom() {
        const c = document.createElement('canvas');
        c.width = 512; c.height = 64;
        const g = c.getContext('2d');
        g.fillStyle = '#f7f7f5'; g.fillRect(0, 0, 512, 64);
        g.fillStyle = '#f2551c';
        g.font = 'bold 40px -apple-system, Helvetica, Arial, sans-serif';
        g.textBaseline = 'middle';
        g.setTransform(-1, 0, 0, 1, 512, 0);      // mirrored: the boom's UVs run aft
        g.fillText('LDRC', 168, 34);
        g.setTransform(1, 0, 0, 1, 0, 0);
        g.fillStyle = '#14141a';
        g.fillRect(0, 6, 512, 3);
        g.fillRect(0, 55, 512, 3);
        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        t.anisotropy = 4;
        boomMat.map = t;
        boomMat.color.set(0xffffff);
    })();
    const boom = new THREE.Mesh(boomGeo, boomMat);   // white boom, lettered
    boom.rotation.z = Math.PI / 2;
    boom.position.set(-0.86, 0.08, 0);
    heli.add(boom);

    // (No horizontal stabiliser. Malcolm 2026-09-13: "the horizontal
    //  stabiliser at the back should go" — it was busy without adding to the
    //  silhouette, and the real tail does not need it to read.)

    const rodGeo = new THREE.CylinderGeometry(0.008, 0.008, 1.18, 8);
    const rod = new THREE.Mesh(rodGeo, M.metal);
    rod.rotation.z = Math.PI / 2;
    rod.position.set(-0.82, 0.015, 0);
    heli.add(rod);

    // (Boom support strut removed — at the camera angle it stuck out
    //  diagonally and read as an aerial poking down out the back.)

    // Tail gearbox — a rounded case, not a brick. The old BoxGeometry read as
    // a tall square block bolted on the end of the boom.
    const tailCaseGeo = new THREE.CylinderGeometry(0.055, 0.055, 0.085, 16);
    tailCaseGeo.rotateX(Math.PI / 2);
    const tailCase = new THREE.Mesh(tailCaseGeo, M.dark);
    tailCase.position.set(-1.42, 0.08, 0);
    heli.add(tailCase);
    // the case fairs into the boom rather than stopping dead
    const tailNeckGeo = new THREE.CylinderGeometry(0.030, 0.050, 0.13, 12);
    const tailNeck = new THREE.Mesh(tailNeckGeo, M.dark);
    tailNeck.rotation.z = Math.PI / 2;
    tailNeck.position.set(-1.355, 0.08, 0);
    heli.add(tailNeck);

    // (No vertical fin. Malcolm 2026-09-13: "the orange fin that sticks up
    //  from the tail should be removed" — a Goblin 770 carries none, and the
    //  earlier swept fin was an invention that only made the tail top-heavy.)

    // TAIL SKID — Malcolm 2026-09-13, pointing at the factory photograph:
    // "notice the tail skid in the photo. It goes down and back (not up)".
    // It is the bent orange rod that hangs off the very end of the tail and
    // rakes aft, so that a tail-low landing puts the skid on the ground
    // instead of the tail-rotor blades. The old part was a straight ventral
    // fin pointing vertically down, which is neither the shape nor the job.
    const skidPathT = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-1.395,  0.035, 0),   // root, under the tail case
        new THREE.Vector3(-1.432, -0.055, 0),
        new THREE.Vector3(-1.492, -0.145, 0),
        new THREE.Vector3(-1.567, -0.203, 0)    // tip, down AND aft
    ]);
    const tailSkidGeo = new THREE.TubeGeometry(skidPathT, 18, 0.011, 8, false);
    const tailSkid = new THREE.Mesh(tailSkidGeo, M.body);   // orange, as on the real one
    heli.add(tailSkid);
    // a small black foot on the end, the bit that actually takes the knock
    const tFootGeo = new THREE.SphereGeometry(0.016, 10, 8);
    const tFoot = new THREE.Mesh(tFootGeo, M.dark);
    tFoot.position.set(-1.569, -0.205, 0);
    heli.add(tFoot);

    // Rotor mast — taller and clearly visible above the body.
    const mastGeo = new THREE.CylinderGeometry(0.035, 0.045, 0.22, 14);
    const mast = new THREE.Mesh(mastGeo, M.dark);
    mast.position.set(0, 0.44, 0);
    heli.add(mast);

    // Rotor head — model-heli style. A wide flat hub disc, plus two
    // cylindrical "blade grips" perpendicular to each other where the
    // blades hinge. The grips are short, blunt cylinders pointing out
    // sideways; on a real heli they are the most visually distinctive
    // part of the rotor system. Without them the hub reads as a coin
    // glued to the top of the mast.
    const hubGeo = new THREE.CylinderGeometry(0.10, 0.10, 0.035, 18);
    const hub = new THREE.Mesh(hubGeo, M.metal);
    hub.position.set(0, 0.55, 0);
    heli.add(hub);

    // Two grip stubs, 90° to each other. Blades attach to these.
    const gripGeo = new THREE.CylinderGeometry(0.038, 0.038, 0.20, 12);
    for (let i = 0; i < 2; ++i) {
        const grip = new THREE.Mesh(gripGeo, M.metal);
        grip.rotation.z = Math.PI / 2;
        grip.rotation.y = i * Math.PI / 2;
        grip.position.set(0, 0.55, 0);
        heli.add(grip);
    }

    // Swashplate suggestion — a thin disc just below the head where
    // the pitch link arms meet the rotating bits. Adds a clear band
    // of contrast under the hub.
    const swashGeo = new THREE.CylinderGeometry(0.085, 0.085, 0.018, 18);
    const swash = new THREE.Mesh(swashGeo, M.accent);
    swash.position.set(0, 0.50, 0);
    heli.add(swash);

    // Main rotor — keep two discrete blades for static / spool-up RPM,
    // but layer a translucent disc above them. The animation loop hides
    // the discrete blades and shows the disc once rotorRateRPS clears
    // the persistence-of-vision threshold (~3 RPS), so a viewer always
    // sees what their eye would actually see at that speed.
    const rotorGrp = new THREE.Group();
    rotorGrp.position.set(0, 0.58, 0);
    // A Goblin 770 is a TWO-blade head. Two full-width bars crossed at 90
    // degrees read as four blades, which no model helicopter of this class
    // has. One bar spanning the diameter IS the two blades; a white tip
    // flash on each end matches the factory paint and makes the disc's
    // edge legible when it spins.
    const bladeGeo = new THREE.BoxGeometry(1.76, 0.011, 0.055);
    const mainBlades = [];
    const mainBlade = new THREE.Mesh(bladeGeo, M.blade);
    rotorGrp.add(mainBlade);
    mainBlades.push(mainBlade);
    // SAB blades are black with a pale flash and an orange chevron out near
    // the tip — the markings that let you see blade track from the ground.
    const tipGeo = new THREE.BoxGeometry(0.17, 0.0125, 0.057);
    for (const x of [-0.74, 0.74]) {
        const tip = new THREE.Mesh(tipGeo, M.accent);
        tip.position.set(x, 0, 0);
        rotorGrp.add(tip);
        mainBlades.push(tip);
    }
    const chevGeo = new THREE.BoxGeometry(0.07, 0.0128, 0.058);
    for (const x of [-0.60, 0.60]) {
        const ch = new THREE.Mesh(chevGeo, M.body);
        ch.position.set(x, 0, 0);
        rotorGrp.add(ch);
        mainBlades.push(ch);
    }
    heli.add(rotorGrp);

    const mainDiscGeo = new THREE.CircleGeometry(0.88, 64);
    const mainDisc    = new THREE.Mesh(mainDiscGeo, M.disc);
    mainDisc.rotation.x = -Math.PI / 2;
    mainDisc.position.set(0, 0.585, 0);
    mainDisc.visible = false;
    heli.add(mainDisc);

    const mainRimGeo = new THREE.RingGeometry(0.83, 0.88, 64);
    const mainRim    = new THREE.Mesh(mainRimGeo, M.discRim);
    mainRim.rotation.x = -Math.PI / 2;
    mainRim.position.set(0, 0.586, 0);
    mainRim.visible = false;
    heli.add(mainRim);

    // Pitch links — the two thin rods from the swashplate up to the blade
    // grips. At this size they are what makes the head read as machinery
    // rather than a knob on a stick.
    const linkGeo = new THREE.CylinderGeometry(0.007, 0.007, 0.115, 6);
    for (const [lx, lz] of [[0.052, 0.052], [-0.052, -0.052]]) {
        const lk = new THREE.Mesh(linkGeo, M.metal);
        lk.position.set(lx, 0.495, lz);
        lk.rotation.z = 0.16;
        heli.add(lk);
    }
    // Washout / damper block just under the grips.
    const dampGeo = new THREE.BoxGeometry(0.085, 0.032, 0.085);
    const damp = new THREE.Mesh(dampGeo, M.dark);
    damp.position.set(0, 0.523, 0);
    heli.add(damp);

    // Tail rotor — same disc-or-blades treatment, in the X-Y plane.
    const tailRotorGrp = new THREE.Group();
    tailRotorGrp.position.set(-1.42, 0.08, 0.09);
    // Two tail blades, like the main head — one bar across the diameter. The
    // old pair crossed at 90 degrees made a four-blade tail rotor.
    const tBladeGeo = new THREE.BoxGeometry(0.58, 0.014, 0.030);
    const tailBlades = [];
    const tBlade = new THREE.Mesh(tBladeGeo, M.blade);
    tailRotorGrp.add(tBlade);
    tailBlades.push(tBlade);
    // The orange pitch bracket at the hub — small, but it is the one splash of
    // colour back there on the real machine.
    const tHubGeo = new THREE.CylinderGeometry(0.026, 0.026, 0.030, 12);
    tHubGeo.rotateX(Math.PI / 2);
    const tHub = new THREE.Mesh(tHubGeo, M.body);
    tailRotorGrp.add(tHub);
    tailBlades.push(tHub);
    heli.add(tailRotorGrp);

    // CircleGeometry defaults to the X-Y plane (normal along +Z), which
    // is exactly the plane the tail blades sweep in (group rotates about
    // its own Z axis). No extra rotation needed — the earlier
    // `rotation.y = π/2` accidentally tipped the disc into the Y-Z plane,
    // 90° out from the blades and the rim it's meant to replace.
    const tailDiscGeo = new THREE.CircleGeometry(0.29, 36);
    const tailDisc    = new THREE.Mesh(tailDiscGeo, M.disc);
    tailDisc.position.set(-1.42, 0.08, 0.095);
    tailDisc.visible = false;
    heli.add(tailDisc);

    const tailRimGeo = new THREE.RingGeometry(0.25, 0.29, 36);
    const tailRim    = new THREE.Mesh(tailRimGeo, M.discRim);
    tailRim.position.set(-1.42, 0.08, 0.096);
    tailRim.visible = false;
    heli.add(tailRim);

    // Skids — landing-gear tubes that follow a curve so the front
    // sweeps up off the ground, the way a real model heli's skid does
    // (a straight cylinder always looks like an unfinished broom
    // handle). The curve is defined in 2D (z=0) and the two skid
    // meshes are then translated out to the left and right.
    const skidPath = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-0.50, -0.36, 0),
        new THREE.Vector3(-0.20, -0.36, 0),
        new THREE.Vector3( 0.30, -0.36, 0),
        new THREE.Vector3( 0.52, -0.33, 0),
        new THREE.Vector3( 0.62, -0.26, 0)
    ]);
    const skidGeo  = new THREE.TubeGeometry(skidPath, 24, 0.024, 10, false);
    const capGeo = new THREE.SphereGeometry(0.027, 12, 10);
    for (const z of [-0.24, 0.24]) {
        const skid = new THREE.Mesh(skidGeo, M.accent);   // white tubes, as on the real thing
        skid.position.set(0, 0, z);
        heli.add(skid);
        // Black end caps, both ends — the rubber bungs a real skid wears.
        for (const [cx, cy] of [[-0.50, -0.36], [0.62, -0.26]]) {
            const cap = new THREE.Mesh(capGeo, M.dark);
            cap.position.set(cx, cy, z);
            heli.add(cap);
        }
    }
    // Landing-gear struts — WIDE FLAT CARBON PLATES, not tubes (Malcolm's
    // factory photograph, 2026-09-13). A Goblin's gear is two broad black
    // plates that splay outward as they drop to the skids; thin round struts
    // read as wire legs and were the last obviously toy-like thing left.
    // Each plate is drawn in side view (x against y) and extruded in z, then
    // tilted so its foot sits outboard of its top.
    const gearShape = new THREE.Shape();
    gearShape.moveTo(-0.062,  0.00);    // top, where it meets the frame
    gearShape.lineTo( 0.062,  0.00);
    gearShape.lineTo( 0.046, -0.275);   // narrows slightly on the way down
    gearShape.lineTo(-0.046, -0.275);
    gearShape.closePath();
    const gearGeo = new THREE.ExtrudeGeometry(gearShape, { depth: 0.016, bevelEnabled: false });
    gearGeo.translate(0, 0, -0.008);
    for (const xs of [-0.17, 0.16]) {
        for (const zs of [-1, 1]) {
            const plate = new THREE.Mesh(gearGeo, M.dark);
            plate.position.set(xs, -0.100, zs * 0.115);   // top buried in the frame
            // asin(0.125 / 0.275): exactly the splay that carries the foot from
            // z=0.115 out to the skid at z=0.240, so it lands ON the tube.
            plate.rotation.x = zs * -0.4716;   // splayed: foot outboard of top
            heli.add(plate);
        }
    }
    // (No gear cross-tube. It was a CylinderGeometry that I never rotated, so
    //  it stood on its end: two black posts poking out of the belly, which is
    //  what Malcolm spotted. The plates carry the gear on their own.)

    // Everything solid casts the shadow; the discs must not, or the rotor
    // throws a black plate across the ground.
    heli.traverse(o => {
        if (o.isMesh && o.material !== M.disc && o.material !== M.discRim) {
            o.castShadow = true;
        }
    });
    scene.add(heli);

    // A shadow needs something to fall on. ShadowMaterial paints ONLY the
    // shadow, so the card's own background still shows through everywhere
    // else — the model reads as sitting on the page rather than floating.
    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(7, 7),
        new THREE.ShadowMaterial({ opacity: .26 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.62;
    ground.receiveShadow = true;
    scene.add(ground);

    heliQuat = new THREE.Quaternion();        // starts at identity

    // Resize handling
    new ResizeObserver(() => {
        const W = wrap.clientWidth, H = wrap.clientHeight;
        if (W < 2 || H < 2) return;
        renderer.setSize(W, H, false);
        camera.aspect = W / H;
        camera.updateProjectionMatrix();
    }).observe(wrap);

    // Animation loop. Pose is set externally in updatePose() by composing
    // body-frame delta quaternions; we just apply heliQuat each frame,
    // spin the rotors, and swap discrete blades for a translucent disc
    // once the spin rate exceeds what the eye can resolve.
    let rotorAng = 0, tailAng = 0, lastT = 0;
    function frame(t) {
        requestAnimationFrame(frame);
        // 30 fps: indistinguishable for this widget, halves the render load
        // that was stealing main-thread time from the live channel bars.
        if (t - lastT < 32) return;
        const dt = lastT ? Math.min(0.1, (t - lastT) / 1000) : 0;
        lastT = t;
        rotorAng += rotorRateRPS * 2 * Math.PI * dt;
        tailAng  += tailRateRPS  * 2 * Math.PI * dt;
        rotorGrp.rotation.y     = rotorAng;     // main rotor about vertical mast
        tailRotorGrp.rotation.z = tailAng;      // tail rotor in X-Y plane

        // Persistence-of-vision threshold: above ~3 revolutions per
        // second the eye merges the blades into a translucent disc.
        // Show the disc + tip ring instead of the discrete blades
        // (which would otherwise read as solid bars at every frame).
        const POV_RPS = 3;
        const mainBlur = rotorRateRPS > POV_RPS;
        mainBlades.forEach(b => b.visible = !mainBlur);
        mainDisc.visible = mainBlur;
        mainRim.visible  = mainBlur;
        const tailBlur = tailRateRPS > POV_RPS;
        tailBlades.forEach(b => b.visible = !tailBlur);
        tailDisc.visible = tailBlur;
        tailRim.visible  = tailBlur;

        integratePose(dt);            // dead-reckon body rotation every frame
        heli.quaternion.copy(heliQuat);
        renderer.render(scene, camera);
    }
    requestAnimationFrame(frame);

    document.getElementById('heliMsg').style.display = 'none';
    three = { scene, camera, renderer, heli };
}

window.addEventListener('load', buildHeli3D);

// ---------------------------------------------------------------------
//  Stale handling + readout
// ---------------------------------------------------------------------

// Scratch quaternion + axis vectors reused per tick to avoid garbage.
const _tq        = (typeof THREE !== 'undefined') ? null : null;   // lazy-allocated once Three loads
const _axisRoll  = { x: 1, y: 0, z: 0 };
const _axisPitch = { x: 0, y: 0, z: 1 };
const _axisYaw   = { x: 0, y: 1, z: 0 };

// updatePose only STORES the latest stick command now. The rotation itself
// is integrated in the render loop (integratePose below) at a steady 30 fps
// — dead-reckoning at the last commanded rates. Data-frame gaps (e.g. the
// iPhone pausing BLE ~once a second to service WiFi on its shared antenna)
// no longer freeze the motion: sticks command RATES, and the rate between
// two frames 100 ms apart is simply the last one heard.
const poseCmd = { roll: 0, pitch: 0, yaw: 0, thr: 0, stale: true };

function updatePose(ch, stale) {
    if (stale) {
        poseCmd.stale = true;
        rotorRateRPS = 0;
        tailRateRPS  = 0;
        heliWrap.classList.add('heliStale');
        return;
    }
    heliWrap.classList.remove('heliStale');
    poseCmd.stale = false;
    poseCmd.roll  = stick(ch[I_ROLL]);
    poseCmd.pitch = stick(ch[I_PITCH]);
    poseCmd.yaw   = stick(ch[I_YAW]);
    poseCmd.thr   = unit(ch[I_THROTTLE]);

    // Realistic-ish flight RPM scaling. Below the POV threshold (3 RPS)
    // the discrete blades are visible during spool-up; from ~idle on
    // up the disc takes over. Tail rotor is geared ~4.7:1 off the main.
    rotorRateRPS = 8  + 28  * poseCmd.thr;   // idle 8 RPS, full ~36 RPS (~2160 RPM)
    tailRateRPS  = 30 + 110 * poseCmd.thr;   // idle 30 RPS, full ~140 RPS
}

// Called from the 30 fps render loop with the frame's dt.
let _lastReadout = '';
function integratePose(dt) {
    if (poseCmd.stale || !dt) return;
    const roll  = poseCmd.roll;
    const pitch = poseCmd.pitch;
    const yaw   = poseCmd.yaw;

    const dRoll  = roll  * ROLL_RATE_DPS  * dt * Math.PI / 180;
    const dPitch = pitch * PITCH_RATE_DPS * dt * Math.PI / 180;
    const dYaw   = yaw   * YAW_RATE_DPS   * dt * Math.PI / 180;

    // Compose body-frame delta rotations into heliQuat. After each multiply,
    // the heli's body axes (including the rotor-mast Y axis) rotate with it,
    // so the next yaw delta is around the *new* mast position — i.e. yaw is
    // always around the heli's current vertical axis, regardless of pitch
    // or roll. Same for pitch/roll about current body axes.
    //
    // Signs (after matching Malcolm's TX):
    //   yaw right  → CW from above   → negative angle about body +Y
    //   pitch fwd  → nose down       → negative angle about body +Z
    //   roll right → right side dips → positive angle about body +X
    if (heliQuat && window.THREE) {
        // reuse scratch objects — allocating per frame feeds the GC
        if (!window._poseTq) { window._poseTq = new THREE.Quaternion(); window._poseV = new THREE.Vector3(); }
        const tq = window._poseTq;
        const v  = window._poseV;
        if (Math.abs(yaw) > STICK_DEAD) {
            tq.setFromAxisAngle(v.set(0, 1, 0), -dYaw);
            heliQuat.multiply(tq);
        }
        if (Math.abs(pitch) > STICK_DEAD) {
            tq.setFromAxisAngle(v.set(0, 0, 1), -dPitch);
            heliQuat.multiply(tq);
        }
        if (Math.abs(roll) > STICK_DEAD) {
            tq.setFromAxisAngle(v.set(1, 0, 0),  dRoll);
            heliQuat.multiply(tq);
        }
    }

    // Stick-deflection accumulators for the on-screen readout — these are
    // just "how hard have you held the sticks" totals, not real heli angles.
    if (Math.abs(roll)  > STICK_DEAD) attRoll  += roll  * ROLL_RATE_DPS  * dt;
    if (Math.abs(pitch) > STICK_DEAD) attPitch += pitch * PITCH_RATE_DPS * dt;
    if (Math.abs(yaw)   > STICK_DEAD) attYaw   += yaw   * YAW_RATE_DPS   * dt;

    const wrap = a => { let x = ((a + 180) % 360 + 360) % 360 - 180; return x.toFixed(0); };
    const txt =
        'roll '  + wrap(attRoll)  + '° · ' +
        'pitch ' + wrap(attPitch) + '° · ' +
        'yaw '   + wrap(attYaw)   + '° · ' +
        'thr '   + Math.round(poseCmd.thr * 100) + '%';
    if (txt !== _lastReadout) { _lastReadout = txt; heliReadout.textContent = txt; }
}

// ---------------------------------------------------------------------
//  Bar paint + polling
// ---------------------------------------------------------------------

let _rowEls = null;      // cached row elements — 48 getElementById per frame adds up at 21 Hz
let _lastStale = null;
function paint(s) {
    const ch    = s.ch;
    const age   = s.age_ms;
    const stale = (age < 0) || (age > STALE_MS);
    if (stale !== _lastStale) {
        _lastStale = stale;
        table.classList.toggle('stale', stale);
        const viaFc = document.documentElement.classList.contains('h-dongle');
        status.innerHTML = stale
            ? '<span class=statusBad>' + (viaFc ? 'The flight controller is not receiving' : 'No RC signal') + '</span>'
            : '<span class=statusOK>' + (viaFc ? 'Live, as the flight controller sees it' : 'RC signal live') + '<span id=rate></span></span>';
    }

    if (!_rowEls) {
        _rowEls = [];
        for (let i = 0; i < 16; ++i) _rowEls.push({
            f: document.getElementById('f' + i),
            v: document.getElementById('v' + i),
            p: document.getElementById('p' + i),
            us: null,
        });
    }
    setChannelTargets(ch, stale);              // bars animate towards these (loop below)
    for (let i = 0; i < 16; ++i) {
        const us = ch[i];
        const e  = _rowEls[i];
        if (e.us === us) continue;             // unchanged — skip the DOM entirely
        e.us = us;
        // numeric readouts show the REAL latest sample (bars may be mid-glide)
        let pctTxt;
        if (CH_BIPOLAR[i]) {
            const v = ((us - CH_MID) / ((CH_HI - CH_LO) / 2)) * 100;
            const c = Math.max(-100, Math.min(100, v));
            pctTxt = (c >= 0 ? '+' : '') + c.toFixed(1) + '%';
        } else {
            const u = Math.max(0, Math.min(100, ((us - CH_LO) / (CH_HI - CH_LO)) * 100));
            pctTxt = u.toFixed(1) + '%';
        }
        e.v.textContent = us;
        e.p.textContent = pctTxt;
    }
    updatePose(ch, stale);
}

// ---- bar animation: extrapolate-and-chase, 30 fps -------------------
// Each sample records per-channel velocity. Between samples the target is
// extended along that velocity for up to EXTRAP_MS (so a ~100-150 ms link
// gap mid-sweep keeps the bar moving), and the displayed position chases
// the prediction with a damped approach (TAU) — continuous motion, no
// hard stops, self-correcting the moment real data lands.
const _barTgt = new Array(16).fill(1500);
const _barVel = new Array(16).fill(0);       // µs per ms
const _barPos = new Array(16).fill(null);
let _barSampleT = 0;

function setChannelTargets(ch, stale) {
    const now = performance.now();
    const dtS = _barSampleT ? (now - _barSampleT) : 0;
    for (let i = 0; i < 16; ++i) {
        const v = ch[i];
        _barVel[i] = (!stale && dtS > 5 && dtS < 400) ? (v - _barTgt[i]) / dtS : 0;
        _barTgt[i] = v;
    }
    _barSampleT = now;
}

const EXTRAP_MS = 140, BAR_TAU = 55;
// With the pushed stream running (30 ms frames) the damping can be much
// tighter and the loop can run at 60 fps: 55 ms was ~170 ms to settle, the
// "still some latency" left after the stream came back (0.9.777). Polled
// samples keep the softer 55 ms so 5/s does not look like steps.
const BAR_TAU_PUSHED = 25;
let _lastBarT = 0;
function animateBars(now) {
    requestAnimationFrame(animateBars);
    const pushed = (now - _streamAlive) < 1200;             // the 20-33/s Bluetooth stream is live
    if (now - _lastBarT < (pushed ? 15 : 32)) return;       // 60 fps on the stream, ~30 fps otherwise
    const dt = _lastBarT ? Math.min(100, now - _lastBarT) : 16;
    _lastBarT = now;
    if (!_rowEls || !_barSampleT) return;
    const ex = Math.min(now - _barSampleT, EXTRAP_MS);
    const k  = 1 - Math.exp(-dt / (pushed ? BAR_TAU_PUSHED : BAR_TAU));
    for (let i = 0; i < 16; ++i) {
        const pred = Math.max(500, Math.min(2500, _barTgt[i] + _barVel[i] * ex));
        let p = (_barPos[i] == null) ? pred : _barPos[i] + (pred - _barPos[i]) * k;
        if (Math.abs(p - pred) < 0.5) p = pred;
        if (_barPos[i] === p) continue;
        _barPos[i] = p;
        const fillPct = Math.max(0, Math.min(100, ((p - FILL_LO) / (FILL_HI - FILL_LO)) * 100));
        _rowEls[i].f.style.width = fillPct.toFixed(2) + '%';
    }
}
requestAnimationFrame(animateBars);

// --- Failsafe (no-transmitter) positions ---------------------------------
function setFsStatus(set) {
    const el = document.getElementById('fsStatus');
    if (!el) return;
    el.innerHTML = set
        ? '<b style="color:#2e7d32">Failsafe is SET</b> — these saved positions are output when the receiver boots with no transmitter.'
        : 'No failsafe saved — using the built-in safe default (sticks centred, AUX channels low).';
}
let _lastFsFetch = 0;
async function refreshFsStatus() {
    // While the pushed channel stream is alive it carries the armed flag,
    // so this heavyweight state fetch relaxes to housekeeping every 10 s —
    // a 2.5 kB request per second was pausing the stream (visible hiccups).
    const now = performance.now();
    const streaming = (now - _streamAlive) < 1200;
    if (streaming && (now - _lastFsFetch) < 10000) return;
    _lastFsFetch = now;
    try { const s = await (await fetch('/api/state.json', { cache: 'no-store' })).json();
          setFsStatus(!!(s.rf && s.rf.failsafe_set));
          if (s.rf && s.rf.vbat) {
              const v = s.rf.vbat;
              if (!vbatTouched) {
                  document.getElementById('vbatPin').value = v.pin;
                  document.getElementById('vbatRatio').value = v.ratio;
                  document.getElementById('vbatCells').value = v.cells;
              }
              const lv = document.getElementById('vbatLive');
              if (!v.pin) lv.textContent = '';
              else if (v.volts > 0.5) {
                  let t = v.volts.toFixed(2) + ' V' + (v.auto ? ' (auto-detected)' : '');
                  if (v.cells > 0) t += ' (' + (v.volts / v.cells).toFixed(2) + ' V/cell)';
                  lv.innerHTML = '<b style="color:#2e7d32">' + t + '</b>';
              } else lv.textContent = 'no reading';
          }
    } catch (e) {}
}
let vbatTouched = false;
for (const id of ['vbatPin', 'vbatRatio', 'vbatCells'])
    document.getElementById(id).addEventListener('input', () => { vbatTouched = true; });
document.getElementById('vbatSave').addEventListener('click', async () => {
    const pin   = document.getElementById('vbatPin').value;
    const ratio = document.getElementById('vbatRatio').value || '23.0';
    const cells = document.getElementById('vbatCells').value || '0';
    try {
        const j = await (await fetch('/api/vbat?pin=' + pin + '&ratio=' + ratio + '&cells=' + cells,
                                     { method: 'POST' })).json();
        if (!j.ok) throw new Error(j.error || 'rejected');
        vbatTouched = false;
        await LDRC.alert(j.pin ? ('Battery settings saved \u2014 pin D9, ratio ' + j.ratio +
                                  (j.cells > 0 ? ', ' + j.cells + ' cells' : '') + '.')
                               : 'Battery measurement turned off.',
                         { title: 'Saved', icon: '\ud83d\udd0b' });
    } catch (e) { await LDRC.alert('Battery settings save failed (' + (e.message || e) + ').',
                                   { title: 'Error', icon: '\u26a0\ufe0f', kind: 'danger' }); }
});
setInterval(refreshFsStatus, 1000);   // live armed indicator
document.getElementById('fsSave').addEventListener('click', async () => {
    if (!(await LDRC.confirm('Save the CURRENT channel positions as the in-flight signal-loss failsafe? Set the model to a safe posture (e.g. motor off) first.',
        { title: 'Save failsafe', icon: '💾', yes: 'Save failsafe' }))) return;
    try { const r = await (await fetch('/api/failsafe/save', { method: 'POST' })).json(); setFsStatus(!!r.failsafe_set); } catch (e) {}
});
document.getElementById('fsClear').addEventListener('click', async () => {
    if (!(await LDRC.confirm('Clear the saved failsafe and revert to the built-in safe default?',
        { title: 'Clear failsafe', icon: '❌', yes: 'Clear', kind: 'warn' }))) return;
    try { const r = await (await fetch('/api/failsafe/clear', { method: 'POST' })).json(); setFsStatus(!!r.failsafe_set); } catch (e) {}
});
refreshFsStatus();

let _stopping = false;
let _lastSample = 0, _period = POLL_MS, _lastDur = 0;

// Match each bar's glide time to the real sample period, so however fast
// the link actually is (WiFi ~20 fps, Bluetooth ~8-12 fps with jitter),
// bars slide smoothly between samples instead of stepping. The period is
// an EMA of measured arrival times; the duration only rewrites styles
// when it changes meaningfully.
// Bars animate game-style now (see animateBars): a 30 fps loop chases each
// channel's target with a damped approach and briefly EXTRAPOLATES along
// its velocity through short link gaps (the iPhone parks BLE ~100 ms about
// once a second to service WiFi on the shared antenna). CSS width
// transitions are gone — one smoother, no queueing, no dead stops.
function syncGlide() {}   // retired — kept so older call sites are harmless

// ---- pushed channel stream (Bluetooth app only) ----------------------
// The receiver notifies "S|us0,..,us15|age" frames continuously; the app
// forwards them here. Push kills the request leg entirely, so bars react
// in one radio slot. Polling below stays alive as a slow watchdog and
// takes over automatically if frames stop (e.g. over WiFi, or old fw).
let _streamAlive = 0;
let _streamEverAlive = false;   // has a pushed frame EVER arrived on this link?
window.__rxStream = (line) => {
    const seg = String(line).trim().split('|');
    if (seg.length < 3 || seg[0] !== 'S') return;
    const ch = seg[1].split(',').map(Number);
    if (ch.length < 16 || ch.some(isNaN)) return;
    const now = performance.now();
    if (_lastSample) _period = _period * 0.8 + (now - _lastSample) * 0.2;
    _lastSample = now;
    _streamAlive = now;
    _streamEverAlive = true;
    syncGlide();
    paint({ ch: ch, age_ms: parseInt(seg[2], 10) });
    // optional 4th field: arming state (-1 none / 0 disarmed / 1 armed) —
    // keeps the ARMED indicator live without the per-second state poll
    if (seg.length >= 4) {
        const a = parseInt(seg[3], 10);
        const al = document.getElementById('armLive');
        if (al && !isNaN(a)) {
            al.innerHTML = (a < 0) ? ''
                : a ? '<b style="color:#c0392b">● ARMED</b>'
                    : '<b style="color:#2e7d32">○ disarmed</b>';
        }
    }
};
// How fast the bars are really updating, and by which route (0.9.775). Over
// Bluetooth "pushed" is the 20/s stream; "polled" is the fallback, and the
// visible lag with it (Malcolm 2026-09-18, on the simulator interface: "big
// latency") is the thing to report.
setInterval(() => {
    const el = document.getElementById('rate');
    if (!el || !_lastSample) return;
    const pushed = (performance.now() - _streamAlive) < 1200;
    el.textContent = ' — ' + Math.round(1000 / Math.max(_period, 1)) + ' updates/s (' + (pushed ? 'pushed' : 'polled') + ')';
}, 1000);
// Arm AFTER app.js has loaded (it is deferred): at top level `window.LDRC`
// is still undefined, so a guarded `if (window.LDRC && ...)` here never ran
// and the stream was never armed - View channels polled at 5/s over
// Bluetooth for weeks without an error to show for it (found 0.9.776 on the
// simulator interface: "big latency"; the dongle's stream_sent stayed 0).
document.addEventListener('DOMContentLoaded', () => {
    if (!(window.LDRC && LDRC.viaBle)) return;
    const armStream = () => {
        if (!document.hidden) fetch('/api/channels.stream?on=1&ms=30', { cache: 'no-store' }).catch(() => {});   // 30 ms: ~33 frames/s (0.9.777; was 50)
    };
    armStream();
    setInterval(armStream, 25000);   // firmware auto-disarms 60 s after the last arm
});

async function tick() {
    if (_stopping) return;
    // While pushed frames are flowing, polling stands down to a watchdog.
    if (performance.now() - _streamAlive < 1200) { setTimeout(tick, 400); return; }
    const t0 = performance.now();
    try {
        const r = await fetch('/api/channels.json', { cache: 'no-store' });
        if (r.ok) {
            const j = await r.json();
            const now = performance.now();
            if (_lastSample) _period = _period * 0.8 + (now - _lastSample) * 0.2;
            _lastSample = now;
            syncGlide();
            paint(j);
        }
    } catch (e) { /* single misses are fine */ }
    // Self-pacing: aim for POLL_MS between REQUEST STARTS. On a slow link
    // the round-trip itself is the pacing — don't add a fixed gap on top
    // (that alone was costing a third of the Bluetooth frame rate).
    //
    // OVER BLUETOOTH, THOUGH, THE GAP IS THE WHOLE POINT. The firmware only
    // pushes a channel frame when nothing is in flight:
    //     if (... || bleReqReady || blePumping) return;   // BleConfig.h
    // and the app's BLE queue is serial. So a 15 ms floor means the pipe is
    // busy essentially all the time, the stream never finds a gap to start in,
    // the page never sees a pushed frame, and it therefore keeps polling — a
    // livelock that starves the very stream that would make it fast.
    // Malcolm 2026-09-14: View channels "didn't respond at all" to the sticks.
    //
    // So on BLE, leave real air between polls until the stream is running.
    // 220 ms is still 4-5 updates a second from polling alone, and it is a
    // wide enough gap for the 50 ms stream to get going — after which the
    // watchdog above takes over and polling stops almost entirely.
    const elapsed = performance.now() - t0;
    // ADAPTIVE, because a fixed floor is wrong in one direction or the other.
    //
    // The firmware only pushes a channel frame when nothing is in flight, so
    // polling flat out starves the stream (0.9.711). But backing off to 220 ms
    // unconditionally is worse than the old behaviour whenever the stream does
    // NOT run — which is Malcolm's "still slower than a few days ago on view
    // channels" (2026-09-14).
    //
    // So: poll briskly until we have actually SEEN a pushed frame. That proves
    // the stream works, and only then do we stand back and let it do the work.
    // If a frame never arrives we keep the old brisk cadence, so this can never
    // be slower than before — only faster.
    const floor = !LDRC.viaBle ? 15 : (_streamEverAlive ? 220 : 60);
    setTimeout(tick, Math.max(floor, POLL_MS - elapsed));
}
document.addEventListener('DOMContentLoaded', () => setTimeout(tick, 200));
document.addEventListener('visibilitychange', () => { _stopping = document.hidden; if (!_stopping) { _lastSample = 0; tick(); } });
</script>
<template id=helpContent><h2>View Channels</h2>
<p>Shows the 16 RC channels arriving from the transmitter in real time, plus a 3-D model helicopter that mirrors your stick movements (roll, pitch, yaw, throttle, collective).</p>
<h3>How to use it</h3>
<p>Move the sticks on your transmitter — the bars should respond instantly and the helicopter should bank, pitch and yaw accordingly. Throttle changes the rotor speed.</p>
<p><b>On a dongle</b> these are the flight controller's own channels, read down the cable, so they prove the whole chain: transmitter, its receiver, and the flight controller. They pause while the model is armed.</p>
<h3>What to look for</h3>
<ul>
<li>Each of channels 1–16 should respond cleanly to its assigned stick or switch.</li>
<li>If a channel is dead while others move, the TX hasn't mapped it.</li>
<li>If <em>all</em> channels freeze, the link has dropped — wait for a swap or check the TX.</li>
</ul>
<p>The <b>Reset</b> button straightens the helicopter back to neutral attitude if it looks tilted from accumulated stick deflections.</p>
</template>
