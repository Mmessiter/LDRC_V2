<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name=theme-color content="#5fa099">
<meta name=apple-mobile-web-app-capable content=yes>
<meta name=apple-mobile-web-app-status-bar-style content=black-translucent>
<meta name=apple-mobile-web-app-title content="LDRC RX V2">
<title>New helicopter &middot; LDRC RX V2</title>
<link rel=stylesheet href="/style.css?v=379">
<script src="/app.js?v=379" defer></script>
<style>
.banner{padding:.7em;border-radius:10px;text-align:center;font-weight:600;margin:0 0 1em}
.banner.warn{background:#e8cf8f;color:#5c4a1a}
.step{display:grid;grid-template-columns:auto 1fr auto;gap:.6em .8em;align-items:center;
      background:#e7edf2;border-radius:12px;padding:.7em .8em;margin:.5em 0}
.step.done{background:#d7e8cf}
.step .num{font-size:1.25em;font-weight:800;color:#5d7a8c;min-width:1.3em;text-align:center}
.step.done .num{color:#4a7d38}
.step .tit b{display:block;font-size:1.02em;color:#2e4356}
.step .tit span{font-size:.8em;color:#5d7a8c;line-height:1.35;display:block}
.step a.go{background:#5fa099;color:#fff;border-radius:9px;padding:.55em .9em;font-weight:700;
           text-decoration:none;white-space:nowrap;font-size:.95em}
.step .tick{grid-column:1;justify-self:center}
.step input[type=checkbox]{width:1.5em;height:1.5em}
.prog{font-weight:700;text-align:center;margin:.4em 0;color:#2e4356}
.resetBtn{width:100%;margin-top:.8em;padding:.6em;border:0;border-radius:10px;background:#b06a6a;color:#fff;font-weight:700;cursor:pointer}
</style>
</head>
<body class=hasFab>
<button class=helpBtn aria-label=Help title=Help onclick="LDRC.showHelp()">?</button>
<div class=bg-photo aria-hidden=true></div>
<div class=bg-wash  aria-hidden=true></div>
<div class=container>
    <h1>New helicopter</h1>
    <div style="text-align:center;margin:.2em 0 .6em"><img src="/wizard.jpg" alt="" style="width:150px;height:150px;border-radius:22px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15)"></div>
    <div class="banner warn">&#9888;&#65039; <b>Take the main and tail blades OFF</b> (or unplug the motor) until the last step says otherwise.</div>
    <p class=muted style="font-size:.9em;line-height:1.5;margin:.2em 0 .6em">Work top to bottom, tick as you go. Each model keeps its own list.</p>
    <div class=prog id=modelName style="color:#4a7a5f"></div>
    <div class=prog id=prog></div>
    <div id=steps></div>
    <button class=resetBtn onclick="resetAll()">Start over (clear all ticks)</button>
    <div class=footer></div>
</div>

<script>
const STEPS=[
 {k:'fw',    t:'Before you start (a computer for the firmware, the phone for the rest)', d:'Flash the latest Rotorflight from a computer - the one job a phone cannot do. Then, with a short USB-C data cable from the receiver to the flight controller, the Ports page sets the receiver port, CRSF, serial receiver mode and telemetry in one Save. No cable? The configurator does those in the same computer session.', href:'/rotorflight-computer'},
 {k:'cal',   t:'Calibrate the flight controller', d:'Teach the flight controller which way is level (accelerometer calibration). Do it on the desk, flat and perfectly still, BEFORE the board goes into the model - a mounted helicopter rarely sits truly level. It takes two seconds, and front-or-back mounting does not affect it.', href:'/rotorflight-calibrate'},
 {k:'wire',  t:'Wire it up', d:'Every plug explained: S1 is the front-or-back servo, then go clockwise round the swashplate; the tail servo is S4; the ESC has its throttle lead, its one-wire telemetry and an RPM wire. Important: do not power the servos until their settings are made in the Servos step.', href:'/rotorflight-wiring'},
 {k:'esc',   t:'ESC setup (its own app)', d:'Set up the ESC in its own app, box or card: governor OFF / external, telemetry ON, short soft start, BEC voltage and motor timing - then calibrate its 1000-2000 microsecond throttle range straight from this phone. The head-speed gear ratio for your transmitter display lives here too.', href:'/rotorflight-esc'},
 {k:'tx',    t:'Transmitter first', d:'Create a new model memory on your transmitter, then tell the wizard which channel does what - pick from the lists, or tap Detect and wiggle that stick or switch. The Arm and Rescue switches and the Bank/Rates selectors are set here too, each with a live bar.', href:'/rotorflight-txchannels'},
 {k:'basics',t:'First-time basics', d:'The one-screen essentials: which way round the board is mounted, the functions you plan to use, which telemetry readings go to your transmitter, the brand of ESC on the telemetry wire, and the battery.', href:'/rotorflight-firsttime'},
 {k:'servos',t:'Servos', d:'Centre each servo so the arms sit level, then set travel limits and direction. One tap copies servo 1 settings to servos 2 and 3. Do this BEFORE mechanical linkage fine-tuning.', href:'/rotorflight-servos'},
 {k:'travel',t:'Travel extents', d:'Set collective and cyclic blade-pitch limits, calibrate the gains against a pitch gauge (a bench-hold drives the swash to exact angles for you), fix any control that moves the wrong way, and set the tail travel.', href:'/rotorflight-travel'},
 {k:'switch',t:'Switches', d:'Prove every switch does what you chose: flip each one and watch its live red tick, and see which Bank and Rates profile the flight controller says it has actually selected.', href:'/rotorflight-modes'},
 {k:'rescue',t:'Rescue', d:'Choose what the rescue switch does - flip upright, level, pull up, climb - and how firmly. Set it up now, prove it high in the air later: it is the safety net for a disorienting moment.', href:'/rotorflight-rescue'},
 {k:'gov',   t:'Governor', d:'Set the target head speed for each bank and how gently the rotor spools up. Rotorflight governs the head speed and adds power the instant collective demands it - before the RPM can sag.', href:'/rotorflight-gov-profile'},
 {k:'rates', t:'Rates & PIDs', d:'How fast the model rotates at full stick, and how soft the feel is around centre. The starting values are fine for a first flight - tune later with the Tuning wizard.', href:'/rotorflight-rates'},
 {k:'bb',    t:'Black box (Flight recorder)', d:'Turn on Rotorflight\u2019s own black box: it records sticks, gyro, servos, governor and ESC hundreds of times a second onto the flight controller, so any problem in the first flights can be seen afterwards. Set it to record whenever armed, tick the recommended fields, and erase the memory before a test session.', href:'/rotorflight-blackbox'},
 {k:'blades',t:'Blades on \u2014 pitch & travel check', d:'Put the main and tail blades back on. Check main and tail pitch with a pitch gauge, and sweep full travel slowly, looking for anything that binds or touches. The last job before flying.'},
 {k:'backup',t:'Back up', d:'One tap saves the whole flight-controller setup to your phone. Restore it after any mishap - or use it as the starting point for your next helicopter.', href:'/rotorflight-backup'},
];
const $=id=>document.getElementById(id);
// Ticks are per MODEL (receiver name), not per phone — Malcolm is setting up
// a dozen helicopters and each must start its checklist fresh (2026-08-23).
let KEY='rfNewHeli.';
async function bindModel(){
    try{
        if (window.LDRC && LDRC.replayReady) await LDRC.replayReady;
        const st=await (await fetch('/api/state.json',{cache:'no-store'})).json();
        const n=(st.info&&st.info.name)||'';
        if(n){ KEY='rfNewHeli.'+n+'.'; $('modelName').textContent='Setting up: '+n; }
    }catch(e){}
    paint();
}
function paint(){
    const host=$('steps'); host.innerHTML='';
    let done=0;
    STEPS.forEach((s,i)=>{
        const isDone=localStorage.getItem(KEY+s.k)==='1'; if(isDone)done++;
        const div=document.createElement('div');
        div.className='step'+(isDone?' done':'');
        div.innerHTML='<div class=num>'+(isDone?'✓':(i+1))+'</div>'
            +'<div class=tit><b data-help="'+s.d+'">'+s.t+'</b></div>'
            +(s.href?'<a class=go href="'+s.href+'">Open</a>':'<div></div>')
            +'<div class=tick><input type=checkbox '+(isDone?'checked':'')+' aria-label="done"></div><div></div><div></div>';
        div.querySelector('input').addEventListener('change',ev=>{
            localStorage.setItem(KEY+s.k, ev.target.checked?'1':'0'); paint();
        });
        host.appendChild(div);
    });
    $('prog').textContent = done===STEPS.length
        ? '🚁 All '+STEPS.length+' steps done — blades on, fly it in, then open Tuning for the polish!'
        : done+' of '+STEPS.length+' steps done';
}
async function resetAll(){
    if(!(await LDRC.confirm('Clear all the ticks and start the checklist again?',
        {title:'Start over',icon:'🔄',yes:'Clear ticks',kind:'warn'})))return;
    STEPS.forEach(s=>localStorage.removeItem(KEY+s.k)); paint();
}
paint();      // instant paint with the generic key…
bindModel();  // …then rebind to this model's own ticks when the name arrives
</script>
<template id=helpContent><h2>New helicopter</h2>
<p>The from-scratch setup checklist for a Rotorflight helicopter &mdash; the same ground the configurator covers, but step by step on the phone, in plain English.</p>
<ul>
<li><b>Step 1 is the only computer step:</b> flashing Rotorflight. With the USB-C cable in, the Ports page does the rest &mdash; port, CRSF, serial receiver mode and telemetry in one Save. No cable? Do those in the configurator in the same session. Everything after is phone-only.</li>
<li>Work top to bottom. Each <b>Open</b> button goes to the right page; come back and tick the step off.</li>
<li>Ticks are remembered per model (by its receiver name), so every new helicopter starts a fresh checklist.</li>
<li><b>Blades off</b> (or motor unplugged) until the very end &mdash; several steps move the servos, and one spins the motor if you let it.</li>
</ul>
<p>Already-set-up models don&rsquo;t need this page &mdash; it exists for the first hour of a new build.</p>
</template>
</body>
</html>
